<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>每日學術新聞 · OpenAlex</title>
<style>
:root{ color-scheme: light;
  --bg:#ffffff; --panel:#f7f7f5; --line:#e6e4df; --ink:#1f1e1c; --muted:#6f6c66;
  --accent:#b8541c; --accent-soft:#fdf1e8; --green:#2f6f4f; --green-soft:#eaf3ee;
  --blue:#2c4f7c; --blue-soft:#eef2f8; --plum:#6b3a63; --plum-soft:#f5eef4;
  --teal:#1f5f5b; --teal-soft:#eaf3f2; --gold:#8a6412; --gold-soft:#fbf5e6;
  --rose:#9b3b52; --rose-soft:#fbeef1; --slate:#33455c; --slate-soft:#f0f3f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.68 -apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.stat b{display:block;font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 20px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=search]{flex:1;min-width:170px;padding:7px 11px;border:1px solid var(--line);
  border-radius:8px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}

.runhead{display:flex;align-items:baseline;gap:9px;margin:28px 0 12px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.runhead h2{font-size:15px;margin:0;font-weight:650}
.runhead .when{font-size:12px;color:var(--muted)}

.card{border:1px solid var(--line);border-radius:12px;padding:17px 19px;margin-bottom:14px;background:#fff}
.card.fresh{border-color:#e8c3a6;background:linear-gradient(180deg,var(--accent-soft),#fff 70px)}
.meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel);
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.j{background:#eef1f6;border-color:#dde2eb;color:#3c4a63;font-weight:600}
.tag.new{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tag.oa{background:var(--green-soft);border-color:#cfe2d6;color:var(--green)}
.card h3{font-size:16px;margin:0 0 7px;line-height:1.44;font-weight:640}
.card h3 a{color:inherit;text-decoration:none;border-bottom:1px solid #d9d6d0}
.card h3 a:hover{border-color:var(--accent);color:var(--accent)}
.au{font-size:12.5px;color:var(--muted);margin-bottom:12px}

.sec{margin-top:14px}
.sec > h4{font-size:12px;margin:0 0 6px;letter-spacing:.06em;font-weight:700;
  text-transform:uppercase;display:flex;align-items:center;gap:7px}
.sec > h4::after{content:"";flex:1;height:1px;background:var(--line)}
.sec p{margin:0 0 8px;font-size:14px}
.sec p:last-child{margin-bottom:0}
.sec.gist > h4{color:var(--ink)}
.sec.design > h4{color:var(--blue)}
.sec.design .box{background:var(--blue-soft);border-radius:9px;padding:11px 13px;font-size:13.5px}
.sec.crit > h4{color:var(--plum)}
.sec.crit .box{background:var(--plum-soft);border-radius:9px;padding:11px 13px;font-size:13.5px}
.sec.crit ul{margin:0;padding-left:19px}
.sec.crit li{margin-bottom:6px}
.sec.crit li:last-child{margin-bottom:0}
.sec.crit li b{color:var(--plum)}

.sec.lin > h4{color:var(--teal)}
.sec.lin .box{background:var(--teal-soft);border-radius:9px;padding:11px 13px;font-size:13.5px}
.sec.lin ul{margin:0;padding-left:19px}
.sec.lin li{margin-bottom:7px}
.sec.lin li:last-child{margin-bottom:0}
.sec.lin li b{color:var(--teal)}

.sec.fig > h4{color:var(--rose)}
.figs{display:grid;gap:9px}
.fig{border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:0 9px 9px 0;
  padding:11px 13px;background:#fffdfd}
.fig .fh{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-bottom:3px}
.fig .fn{font-size:14.5px;font-weight:680}
.fig .fr{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--rose-soft);
  color:var(--rose);border:1px solid #ecd3d8;white-space:nowrap}
.fig .fr.own{background:var(--accent);border-color:var(--accent);color:#fff}
.fig .fr.ext{background:var(--panel);border-color:var(--line);color:var(--muted)}
.fig .fi{font-size:11.5px;color:var(--muted);margin-bottom:7px;font-variant-numeric:tabular-nums}
.fig p{margin:0 0 6px;font-size:13.3px}
.fig p:last-child{margin-bottom:0}
.fig p.mu{background:var(--panel);border-radius:7px;padding:8px 10px}
.fig p b{color:var(--rose)}

.sec.can > h4{color:var(--slate)}
dl.can{margin:0;display:grid;gap:8px}
dl.can div{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--slate-soft)}
dl.can dt{font-size:13.5px;font-weight:680;color:var(--slate);margin-bottom:2px}
dl.can dd{margin:0;font-size:13.3px}

details.idx{margin:0 0 18px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
details.idx summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:620;list-style:none}
details.idx summary::-webkit-details-marker{display:none}
details.idx summary::before{content:"▸ ";color:var(--rose)}
details.idx[open] summary::before{content:"▾ "}
.idxbody{padding:0 14px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px}
.idxi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.3px}
.idxi b{display:block;font-size:13px;font-weight:660}
.idxi span{color:var(--muted);font-size:11px}

.sec.acc > h4{color:var(--gold)}
.sec.acc .box{background:var(--gold-soft);border-radius:9px;padding:11px 13px;font-size:13.5px;
  border:1px solid #eadfc2}
.sec.acc ul{margin:0;padding-left:19px}
.sec.acc li{margin-bottom:7px}
.sec.acc li:last-child{margin-bottom:0}
.sec.acc li b{color:var(--gold)}
.sec.redo > h4{color:var(--accent)}
ol.redo{margin:0;padding:0;list-style:none;counter-reset:r}
ol.redo li{counter-increment:r;position:relative;padding:0 0 12px 34px;font-size:13.8px}
ol.redo li:last-child{padding-bottom:0}
ol.redo li::before{content:counter(r);position:absolute;left:0;top:1px;width:23px;height:23px;
  border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
ol.redo li strong{display:block;font-weight:670;margin-bottom:1px}
.fit{margin-top:12px;font-size:13px;background:var(--panel);border-left:2.5px solid var(--ink);
  padding:9px 12px;border-radius:0 7px 7px 0;color:#3d3a35}
.fit b{font-weight:670}

details.pod{margin-top:16px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
details.pod summary{cursor:pointer;padding:11px 15px;font-size:13.5px;font-weight:620;list-style:none}
details.pod summary::-webkit-details-marker{display:none}
details.pod summary::before{content:"▸ ";color:var(--accent)}
details.pod[open] summary::before{content:"▾ "}
details.pod.full{margin-top:14px;background:var(--slate-soft);border-color:#dde3ec}
details.pod.full summary{color:var(--slate)}
details.pod.full summary::before{color:var(--slate)}
details.pod.full .script p.hd{background:#e6ecf4;color:var(--slate)}
.podbody{padding:0 15px 14px}
.script{font-size:13px;line-height:1.75;background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:12px 13px;max-height:420px;overflow:auto}
.script p{margin:0 0 7px;padding:3px 6px;border-radius:5px;transition:background .15s;cursor:pointer}
.script p:hover{background:#f4f2ee}
.script p.now{background:#fdf1e8;box-shadow:inset 2px 0 0 var(--accent)}
.player label.fw{gap:4px;cursor:pointer;user-select:none}
.player label.fw input{accent-color:var(--accent);margin:0}
.script p.done{color:#9b968e}
.script p .sp{display:inline-block;min-width:17px;font-weight:700;color:var(--accent)}
.script p.b .sp{color:var(--blue)}
.script p.hd{font-weight:680;color:var(--ink);background:var(--panel);text-align:center}

.player{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.pbtn{padding:6px 14px;font:inherit;font-size:13px;font-weight:620;cursor:pointer;
  background:var(--accent);color:#fff;border:0;border-radius:7px;white-space:nowrap}
.pbtn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:6px 11px}
.pbtn:disabled{opacity:.45;cursor:default}
.player label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.player input[type=range]{width:82px;accent-color:var(--accent)}
.player select{font-size:11.5px;padding:4px 6px;max-width:150px}
.pstat{font-size:11.5px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.pwarn{font-size:12px;color:#9b3b52;background:var(--rose-soft);border-radius:7px;padding:8px 11px;margin-bottom:10px}
button.copy{margin-top:9px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer;
  background:var(--ink);color:#fff;border:0;border-radius:7px}
button.copy:active{opacity:.7}
.srcs{font-size:12px;color:var(--muted);margin-top:9px;word-break:break-all}
.srcs a{color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.75}
@media(max-width:600px){.player{gap:6px}.pbtn{padding:9px 15px;font-size:14px}.player select{max-width:120px}.script{max-height:60vh}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 13px 50px}}

.briefs{display:grid;gap:9px;margin-bottom:14px}
.bf{border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:0 9px 9px 0;
  padding:11px 13px;background:#fff}
.bf h4{margin:0 0 4px;font-size:14.2px;font-weight:645;line-height:1.45}
.bf h4 a{color:inherit;text-decoration:none;border-bottom:1px solid #d9d6d0}
.bf h4 a:hover{color:var(--accent);border-color:var(--accent)}
.bf .m{font-size:11px;color:var(--muted);margin-bottom:6px}
.bf p{margin:0 0 5px;font-size:13.1px}
.bf p:last-child{margin-bottom:0}
.bf .tc{background:var(--green-soft);border-radius:6px;padding:6px 9px;font-size:12.6px;margin-top:6px}
.bf .tc b{color:var(--green)}
details.idxall{margin:0 0 18px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
details.idxall summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:620;list-style:none}
details.idxall summary::-webkit-details-marker{display:none}
details.idxall summary::before{content:"▸ ";color:var(--slate)}
details.idxall[open] summary::before{content:"▾ "}
.idxlist{padding:0 14px 12px;max-height:60vh;overflow:auto}
.idxrow{display:flex;gap:9px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.6px}
.idxrow:last-child{border-bottom:0}
.idxrow .d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11px}
.idxrow .jn{color:#3c4a63;white-space:nowrap;font-size:11px;min-width:96px}
.idxrow a{color:inherit;text-decoration:none}
.idxrow a:hover{color:var(--accent)}

.blkplay{position:absolute;top:8px;right:8px;z-index:2;width:26px;height:26px;padding:0;
  font-size:11px;line-height:1;cursor:pointer;border:1px solid var(--line);border-radius:50%;
  background:#fff;color:var(--accent);opacity:.5;transition:opacity .15s}
.blkplay:hover{opacity:1;background:var(--accent-soft)}
.sec > .blkplay{top:-2px}
.minibar{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:14px;
  display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;
  border-radius:99px;padding:7px 9px 7px 16px;font-size:12.5px;z-index:99;
  box-shadow:0 4px 18px rgba(0,0,0,.22);transition:transform .22s;max-width:92vw}
.minibar.on{transform:translateX(-50%) translateY(0)}
.minibar .mt{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minibar .mn{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums;min-width:52px}
.minibar .pbtn{padding:4px 10px;font-size:12px;background:rgba(255,255,255,.16);color:#fff;border:0}
.minibar .pbtn:hover{background:rgba(255,255,255,.28)}

.tldr{border:2px solid var(--accent);border-radius:12px;padding:14px 16px;margin:0 0 12px;
  background:linear-gradient(180deg,var(--accent-soft),#fff 80px);position:relative}
.tldr h3{margin:0 0 9px;font-size:15px;font-weight:700;color:var(--accent)}
.tldr dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 11px;font-size:13.4px}
.tldr dt{font-weight:700;color:var(--accent);white-space:nowrap}
.tldr dd{margin:0}
.tldr .act{margin-top:10px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;font-size:13.2px}
.tldr .act b{color:#f0b98a}
details.deep{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:12px}
details.deep > summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:620;list-style:none;color:var(--slate)}
details.deep > summary::-webkit-details-marker{display:none}
details.deep > summary::before{content:"▸ ";color:var(--slate)}
details.deep[open] > summary::before{content:"▾ "}
.deepbody{padding:0 14px 12px}

/* ── 定位雷達：期刊胃口 × 本篇倚重 ───────────────────────────── */
.jfit{margin:14px 0 0;border:1px solid #dbe1ea;border-radius:11px;background:var(--slate-soft);padding:13px 15px}
.jfit > h4{font-size:12px;margin:0 0 3px;letter-spacing:.06em;font-weight:700;
  text-transform:uppercase;color:var(--slate)}
.jfit .rsub{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.jfit .rwrap{display:grid;grid-template-columns:minmax(210px,268px) 1fr;gap:14px;align-items:start}
@media(max-width:640px){.jfit .rwrap{grid-template-columns:1fr}}
.jfit .rcv{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px}
.jfit table.rax{width:100%;border-collapse:collapse;font-size:12px}
.jfit table.rax th{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;
  padding:0 5px 4px;border-bottom:1px solid #ccd4df;text-align:right;white-space:nowrap}
.jfit table.rax th:first-child,.jfit table.rax th:last-child{text-align:left}
.jfit table.rax td{padding:4px 5px;border-bottom:1px solid #e3e7ee;vertical-align:top}
.jfit table.rax tr:last-child td{border-bottom:0}
.jfit table.rax td.k{white-space:nowrap;font-weight:600;color:var(--slate)}
.jfit table.rax td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.jfit table.rax td.n i{font-style:normal;color:var(--muted)}
.jfit table.rax td.w{color:var(--muted);font-size:11.5px;line-height:1.5}
.jfit .chips{display:flex;flex-direction:column;gap:5px;margin:10px 0 0}
.jfit .chip{font-size:12px;border-radius:8px;padding:6px 9px;border:1px solid}
.jfit .chip b{display:inline-block;font-size:10.5px;letter-spacing:.05em;
  padding:1px 6px;border-radius:99px;margin-right:6px;vertical-align:1px;color:#fff}
.jfit .chip.hit{background:var(--green-soft);border-color:#cfe2d6;color:#26543c}
.jfit .chip.hit b{background:var(--green)}
.jfit .chip.bet{background:var(--gold-soft);border-color:#e8dcb8;color:#6f5210}
.jfit .chip.bet b{background:var(--gold)}
.jfit .chip.gap{background:var(--rose-soft);border-color:#eed3da;color:#7d2f42}
.jfit .chip.gap b{background:var(--rose)}
.jfit .rv{margin-top:11px;background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;font-size:13.5px}
.jfit .rv b.h{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--slate);margin-bottom:3px}
.jfit .rl{margin-top:8px;background:var(--accent-soft);border:1px solid #ecd4c0;
  border-radius:9px;padding:10px 12px;font-size:13.5px}
.jfit .rl b.h{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);margin-bottom:3px}
.jfit .rpend{background:#fff;border:1px dashed #c9cfd8;border-radius:9px;padding:11px 13px;
  font-size:13px;color:var(--muted)}
/* 期刊胃口對照 */
.jpx{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:14px}
.jpx > summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:640;list-style:none}
.jpx > summary::-webkit-details-marker{display:none}
.jpx > summary::before{content:"▸ ";color:var(--muted)}
.jpx[open] > summary::before{content:"▾ "}
.jpxb{padding:0 14px 14px}
.jpxb table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.jpxb th,.jpxb td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums}
.jpxb th:first-child,.jpxb td:first-child{text-align:left;white-space:nowrap;font-weight:600}
.jpxb thead th{background:var(--panel);font-size:11px;font-weight:700;color:var(--slate);
  text-align:right;line-height:1.35}
.jpxb tbody tr:last-child td{border-bottom:0}
.jpxb td.hi{background:var(--green-soft);color:#26543c;font-weight:700}
.jpxb td.lo{color:#b9b6b0}
.jpxb .nb{font-size:11.5px;color:var(--muted);margin:9px 0 0;line-height:1.6}
.jpxb .op{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:13px}
.jpxb .op li{margin-bottom:7px}
.jpxb .op li:last-child{margin-bottom:0}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <h1>每日學術新聞</h1>
  <div class="sub" id="sub"></div>

  <div class="stats">
    <div class="stat"><b id="s-done">0</b><span>已整理</span></div>
    <div class="stat"><b id="s-pool">0</b><span>2026 存量池</span></div>
    <div class="stat"><b id="s-j">15</b><span>追蹤期刊</span></div>
    <div class="stat"><b id="s-eta">—</b><span>預估追完</span></div>
  </div>
  <div class="bar"><i id="prog" style="width:0%"></i></div>

  <div class="tools">
    <input type="search" id="q" placeholder="搜尋標題、方法、主題…">
    <select id="fj"><option value="">全部期刊</option></select>
    <select id="fn"><option value="">全部</option><option value="1">只看當日最新</option><option value="oa">只看開放取用</option></select>
  </div>

  <div id="people"></div>
  <div id="feed"></div>

  <footer>

   "podcast": "【期刊專題輪　技術預測與社會變遷　二零二六年八月十三日】\n\n今天這一輪跟以往不同。不再一次掃十九本期刊,而是只針對一本 —— 技術預測與社會變遷 —— 而且三篇都是從既有庫存裡挑的,挑選判準只有一條:<b>用公開資料就能自己重做</b>。\n\n庫存裡這本期刊有七十四篇,其中六十九篇還沒處理過。以下是挑出來的三篇。\n\n【第一則　人工智慧與機器人專利的淘金熱】\n\n第一篇問的是,人工智慧與機器人的專利申請,是不是同一波浪潮。\n\n作者來自波隆那大學、義大利國家研究院與杜林大學。他們引入一個新的區分:傳統機器人,以及內嵌人工智慧功能的機器人。加上核心人工智慧本身,一共三條序列。\n\n資料是一九八零到二零一九年的專利,四十年跨度。方法是結構斷點檢定與共整合分析。\n\n三個發現。第一,三條軌跡各自不同,人工智慧增強的機器人從二零一零年代初開始急速加速。第二,結構斷點集中出現在二零一零年之後。第三,長期關係在國別之間系統性不同,中國在核心人工智慧與人工智慧增強機器人之間呈現強整合,而且大學與公共研究機構的貢獻相當可觀。\n\n【專家回應　第一則】\n\n最聰明的地方是那個三分法。把人工智慧增強的機器人單獨拉出來,是一個小動作,但改變了測量對象。如果沒有這一步,你看到的就只是機器人專利在二零一零年後變多,而看不到變多的是哪一種。\n\n但最脆弱的地方也是那個三分法。摘要沒有交代分類規則,而整篇的結論全部建立在它上面。如果分類是用關鍵詞做的,那麼加速有可能只是專利文件開始使用人工智慧詞彙 —— 那是書寫慣例的變化,不是技術的變化。\n\n那麼,如果要重現並且改進這項研究,該怎麼做呢。\n\n第一步,用世界智慧財產權組織公布的人工智慧專利分類定義,建立三分法的完整代碼清單並公布,然後抽樣人工複核,報告誤分類率。光是這一步,你的版本就比原文多了一個效度層。\n\n第二步,把書寫慣例變化這個對立假設檢定掉。對同一批專利,分別用分類碼與說明書關鍵詞兩種方式分類,看兩條序列的斷點是否落在同一年。如果關鍵詞法的斷點明顯更早,那就是慣例在動,不是技術在動。\n\n第三步,把創新系統從詮釋變成變數。原文用創新系統解釋國別差異,但創新系統沒有進模型。把各國公共研究支出佔比、大學專利佔比這些公開指標接進來,讓它變成可檢定的變數。\n\n第四步,專利的地理歸屬要自己處理。申請人國籍、發明人所在地、優先權國家會給出不同的分布,報告三種歸屬下結論是否一致。\n\n第五步,把序列延長到二零二四年,看生成式人工智慧的爆發有沒有造成第二個結構斷點。原文停在二零一九年,做不到這件事。\n\n【第二則　數位賦能的綠色技術】\n\n第二篇來自中國科學院大學與薩里大學。問的是,數位知識與綠色知識在一個地區裡的關聯程度,會不會影響該地區綠色技術的長期有用性。\n\n資料是二零零零到二零二零年中國各城市的專利與科學出版品。\n\n發現是倒 U 型 —— 關聯度處於中等水準時效果最強,太低或太高都不利。而且數位技術與數位科學的成熟度會把這條曲線壓平,也就是說隨著知識演化,關聯度的邊際重要性下降。\n\n【專家回應　第二則】\n\n最聰明的地方是把結果變數從數量換成有用性。綠色專利數量的研究已經很擁擠,問這些技術後來有沒有用,是比較新的切角。\n\n但這也把整篇的成敗押在有用性怎麼量。如果是用後續被引用次數,那會受到自我引用與技術領域引用習慣的影響。如果沒有做領域標準化,倒 U 型有可能是不同領域的引用習慣混合出來的。\n\n而我最想指出的一點是:整個設計依賴把專利與論文指派到城市,而這一步有系統性的失敗。機構名稱不規整、地址格式不一致、跨城市的機構分支,這些會讓某些城市的觀察值被系統性地少算。原文幾乎確定沒有處理,因為這個領域沒有人處理。\n\n那麼該怎麼改進呢。\n\n第一步,加一層地理編碼缺失的敏感度分析。量出各城市的指派失敗率、檢定它是否與城市規模或機構類型相關,再用逆機率加權重估關聯度指標,看倒 U 的轉折點會不會移動。這是原文沒有、這個領域也沒有人做的一層。\n\n第二步,把有用性做成多個版本:後續被引用、被後續專利引用、跨領域引用、專利家族大小。報告倒 U 在四種操作化下是否都存在。\n\n第三步,把政策放進來。中國二零零零到二零二零年的綠色技術政策有明確的時間與地理分布,而那些名單是公開的。把政策試點當成處理變數,既能處理遺漏變數,也能把論文推向準實驗識別。\n\n第四步,檢定倒 U 是不是組成效果。依城市規模、產業結構、是否為試點分組,看倒 U 在每一組內是否都成立。\n\n第五步,換一個國家做外部效度。歐盟的專利與論文資料同樣公開,而政策環境完全不同。如果倒 U 在歐洲也成立,論文就從中國的現象升級成一般規律。\n\n【第三則　驅動人工智慧創新的治理組態】\n\n第三篇來自湖南大學、弗勞恩霍夫系統與創新研究所,以及吉林大學。\n\n它問的不是哪一個治理要素最重要,而是哪幾種要素的組合會共同導向高創新。理論骨架是歐斯壯的制度分析與發展架構,方法是模糊集質性比較分析,案例是四十個國家。\n\n發現有三。沒有任何單一條件是高人工智慧創新的必要條件。資料與演算法的開放取用,加上國際參與,是所有路徑共有的底層。共辨識出三條等效的治理路徑,其中一條是資源與環境條件下的政府主導模式。\n\n【專家回應　第三則】\n\n最聰明的地方是理論與方法的一致性。歐斯壯的核心主張就是沒有萬用解方,制度要與脈絡匹配;而模糊集質性比較分析正是為了檢驗等效性而存在的方法。理論與方法互相支撐,不是硬湊。很多組態論文是先選了方法再找理論,審稿人看得出差別。\n\n最脆弱的一步是校準。所有結論都建立在把連續指標轉成隸屬度的門檻選擇上,而那些門檻通常由研究者決定。摘要沒有交代校準規則,而不同門檻可以產出完全不同的組態。\n\n還有一個是有限多樣性。四十個案例對上二的條件數次方的組態空間,必然有大量組合沒有實證案例,必須靠反事實假設補,而反事實的選擇會影響最終解。\n\n改進的方式如下。\n\n第一步,把校準做成可稽核的附錄。公布每個條件的完整校準錨點與依據,並做敏感度分析:把交叉點上下移動一個標準差,三條路徑還在不在。\n\n第二步,明確報告使用的是簡約解、中間解還是複雜解,以及每一個反事實假設的理論依據。\n\n第三步,結果變數做兩個版本。用專利與論文量產出,再用採用率量擴散,看治理組態是否相同。如果不同,那本身就是有價值的發現。\n\n第四步,檢驗跨國指標的測量等值性。資料開放程度在四十個國家之間,是不是量到同一件事。\n\n第五步,把台灣放進去,看它落在哪一條路徑上。\n\n【今日可教的一課】\n\n今天三篇有一個共同點,而且是這一輪最值得記住的事。\n\n三篇都是國家或城市層級的研究,分析單位都不是企業。而這本期刊有百分之四十五點四的文章以企業為分析單位。\n\n這說明一件事:當我先前提醒某一份稿件的分析單位問題時,我用的是另一本期刊百分之六十二點六的企業密度。那個數字不能直接套到這本期刊。這本期刊確實刊登大量國家與區域層級的研究。\n\n同一個維度,在不同期刊有不同的意義。用一本期刊的密度去推論另一本,是我自己犯過的錯。\n\n【今日總結】\n\n三篇都用公開資料,三篇都可以自己重做,而且三篇各自留了一個沒有人補的洞:專利分類規則的可稽核性、城市指派的誤差、以及模糊集校準的敏感度。\n\n三個洞的形狀是一樣的 —— 都是大家都在用、卻沒有人驗證的中間步驟。\n\n以上是今天的期刊專題輪。"

   "podcast": "【每日學術新聞　二零二六年八月十六日　早班】\n\n各位早安。這裡是每日學術新聞早班。我們追蹤十九本科學計量學與創新管理領域的期刊，把每天新上線的研究整理成可以聽的內容。今天的節目有三則深度報導，加上二十五篇中等長度的快訊。存量池目前是一千九百六十六篇，其中新增進索引的有一百五十篇。\n\n今天的三則報導有一個共同的線索。它們都在問同一件事：你以為你在測量的東西，跟你實際上測量到的東西，中間差了多少。第一則講的是性別，第二則講的是引用，第三則講的是合作。三個題目看起來不相干，但它們的裂縫開在同一個地方。\n\n第一則。〈性別、經費與開放取用，在西班牙構成一個三角〉。\n\n這篇論文刊在 Scientometrics，上線日期是二零二六年五月二十九日。兩位作者，第一作者是格拉納達大學的 Elvira González-Salmón，資深作者是西班牙國家研究委員會的 Zaida Chinchilla-Rodríguez。\n\n研究對象是西班牙的科學產出。資料來自 Web of Science，時間範圍是二零零八年到二零一七年，取的是至少有一位西班牙作者的論文。四個核心欄位被放在同一張分析表上：從姓名推斷出來的作者性別、從致謝欄抽出來的經費資訊、作者在署名裡的位置、以及論文的開放取用狀態。分析跨越五個大的學科領域。\n\n作者的問題意識不是「女性是不是比較少」。這個問題已經被問了幾十年，答案也很清楚。他們問的是另一件事：這些結構因素彼此之間怎麼交互作用。他們的主張是，過去一次只看一個面向的做法會導出誤導性的政策建議，因為真正讓不平等持續下去的，是這些面向之間的耦合。\n\n發現分成三層。第一層是位置的不對稱。女性在有國際經費的論文裡被低估，在末位作者，也就是通常代表資深主持人的位置上也被低估；但是在第一作者的位置上，女性反而出現得更頻繁。換句話說，做事的人跟掛名的人之間，有一道很清楚的落差。\n\n第二層是團隊效果。混合性別的團隊，女性的參與最均衡，而且女性的產出比較高。作者把合作稱為一個關鍵的均衡化脈絡。\n\n第三層跟開放取用有關，而且結論違反直覺。開放取用的採用率是由有沒有經費決定的，跟性別無關。也就是說，開放取用在這份資料裡不是一個性別議題，它是一個資源議題。\n\n還有一個發現作者說得很誠實：經費資訊的不完整，是監測學術公平最主要的障礙。\n\n要提醒聽眾一件事。這篇論文的摘要沒有報告樣本量，也沒有給出任何一項比例的具體數字，只給了方向。對一本以大規模量化為主食的期刊來說，這相當不尋常。\n\n第二則。〈同一批資料換一種轉換，結論就變了〉。\n\n這篇刊在 Journal of Informetrics，上線日期是二零二六年五月十五日。三位以色列作者，分別來自阿什凱隆學術學院、海法大學與巴伊蘭大學。\n\n資料是以色列各機構在二零一三年到二零二三年之間的完整 Scopus 紀錄，總共二十六萬兩千三百三十六篇論文。不是抽樣，是全部。\n\n自變數包括取用類型、學科領域、經費狀態、出版年份與合作規模。中介變數是作者團隊的規模。結果變數是引用，但引用有三個版本：原始的引用計數、開平方根之後的計數、以及取對數之後的場域正規化引用分數。所謂場域正規化，就是把一篇論文的引用數，除以同領域同年份的期望引用數，因為不同學科的引用密度可以差到十倍以上。\n\n分析用了三個固定效果的變異數分析，加上一個多群組結構方程模型。\n\n發現也分三層。描述層面，引用平均值呈現一個一致的階層：封閉取用最低，接著是金色與青銅色開放取用，兩者差不多，再上去是混合型，最高的是綠色開放取用，而且高出很多。所謂綠色開放取用，指的是作者自己把論文存到典藏庫裡。學科方面，生命與健康科學的引用比社會科學高出百分之一百三十一，自然科學高出百分之四十九。合作規模方面，引用隨著作者人數單調上升，超過二十位作者的論文，拿到的引用是小團隊的四倍。\n\n模型層面，結構方程模型解釋了引用結果百分之二十二的變異，團隊規模承載了結構特徵與引用之間的一部分關聯。\n\n但是這篇論文真正的重點在第三層，也就是方法層面。同一批資料，經費這個變數在原始引用計數之下，跟引用沒有關聯；換成轉換後的規格，它就變成顯著的。同樣的資料，同樣的變數，只因為換了一種轉換方式，結論就從沒有效果變成有效果。\n\n作者據此提出的主張是規範性的：轉換感知的分析，應該成為大規模書目計量研究的方法論標準。他們也很克制地聲明，橫斷面的設計不容許因果解讀，所以措辭用的是「在統計上解釋了一部分關聯」，而不是「透過團隊規模造成」。\n\n第三則。〈雙邊經費買到合作的開始，買不到延續〉。\n\n這篇是今天最新的一篇，刊在 Scientometrics，上線日期是二零二六年八月十四日。作者來自巴伊蘭大學、海法大學、德國萊布尼茲社會科學研究所，四位作者。\n\n研究對象是德以基金會，一個只綁定德國與以色列兩個國家的雙邊研究補助計畫。資料涵蓋六百四十二項補助、兩千三百八十六位研究者、五萬兩千八百四十七篇論文。\n\n這類雙邊計畫在各國都很常見，但相較於國家型與多國型的經費，實證上幾乎沒有被檢驗過。作者的問題很直接：這種計畫到底有沒有創造出新的合作，而且這些合作能不能持續。\n\n方法是把每個團隊的共著行為切成補助之前、補助期間、補助之後三段，用一種時間感知的分群方法把合作軌跡分類，再用機器學習模型去預測團隊會落在哪一類。這個設計的好處是不預設「合作會增加」這樣的單一假設，而是讓資料自己長出幾種軌跡型態。\n\n結果是這樣。補助期間，共著行為明顯增加，甚至在補助開始之前就已經略有上升。原本沒有共著紀錄的團隊，有百分之四十五在受補助期間開始共著。但是補助一結束，活動就迅速下滑，只有大約三分之一的團隊能維持比較長期的共著，能維持高強度的更是少數。\n\n最後還有一句，可能是整篇最重要的一句：團隊的組成與書目計量特徵，大致上不足以預測補助期間以及補助之後的共著活動。\n\n【專家回應　第一則　〈推斷出來的變數，錯誤率就是設計的一部分〉】\n\n先講這篇最聰明的地方。多數關於性別的書目計量論文，貢獻是「我又測了一個國家」。這篇的貢獻不是這個。它的貢獻是主張：分開測會得到誤導性的政策建議。這個框架讓一份本質上是描述統計的研究有了理論姿態，也讓它在一本已經刊過大量性別論文的期刊裡站得住腳。另外，作者明白寫出「本研究不提出新的評鑑準則，只提供診斷洞見」，這是一個很老練的自保動作，等於預先解除了「你憑什麼定義公平」這一類的規範性攻擊。\n\n接下來講最致命的缺口，而這個缺口正好是引了卻沒做的那一種。\n\n整篇論文的每一個結論，都建立在姓名推斷性別這一步上。書目資料庫不記錄性別，所以研究者必須用姓名字典或機率模型，把姓名對應到性別。這是這個領域的標準做法，沒有問題。有問題的是，在被引用最多的那一批參考文獻裡，看不到專門評估姓名推斷工具準確率與偏誤的方法論研究。也就是說，推斷的錯誤率被當成背景噪音處理了。\n\n為什麼這件事致命。因為姓名推斷的準確率，在西班牙語系姓名、東亞姓名與阿拉伯姓名之間，差距很大。而國際經費的論文，正好有比較多的外籍合作者。把這兩件事放在一起，你就得到一個很不舒服的可能性：「女性在有國際經費的論文裡被低估」這個發現，有一部分可能不是社會現象，而是測量假象。論文的設計無法分辨這兩者。\n\n次要的問題有兩個。第一，論文宣稱的是結構因素的交互作用，但呈現的是分層描述。要支持交互的主張，至少需要交互項的正式檢定與效果量，而摘要裡一個數字都沒有。宣稱的層級高於證據的層級。第二，混合團隊那一格有內生性。混合性別團隊的女性產出比較高，可能是團隊組成的效果，也可能是選擇效果，也就是能進入混合團隊的女性本來就是資源與網絡比較好的一群。論文的設計無法分辨，但政策建議完全依賴前一種解釋。\n\n那麼，如果要重現並且改進這項研究，該怎麼做。\n\n第一步，不要一開始就得到一張乾淨的性別欄。改成三欄：推斷結果、推斷信心、推斷來源。西班牙有一個便利之處，國家統計局有完整的姓名性別分布，可以當成本地基準。把不可推斷的比例，以及不可推斷者在領域與國際合作上的分布，先報出來。\n\n第二步，把測量誤差當成參數。設定推斷錯誤率在西班牙語系與非西班牙語系姓名上分別是兩個不同的數值，在合理區間內掃描，看那個「女性在國際經費論文被低估」的結論，在什麼樣的錯誤率組合下會翻轉。如果翻轉需要不合理的高錯誤率，結論就穩；如果在文獻報告過的範圍內就會翻轉，那這個發現不能寫成結論。\n\n第三步，把經費資訊的缺漏本身變成被解釋變數。建一個二元變數，這篇論文有沒有可用的經費致謝，用領域、年份、國際合作、作者序位去預測它。如果缺漏可以被系統性地預測，那麼所有以有經費資訊的子集為基礎的結論，都要加上選擇性校正。作者誠實地指出了缺漏是障礙，卻沒有把障礙變成分析對象，這是最可惜的地方。\n\n第四步，把交互作用正式檢定出來。以女性參與比例或女性是否為末位作者為結果，放入經費類型、團隊性別組成、開放取用類型，以及它們的兩兩交互項，領域與年份設固定效果。報告交互項的效果量與信賴區間，不要只報顯著性。\n\n第五步，用制度斷點做因果識別。西班牙在這十年間有數次國家研究計畫與開放取用政策的變動，可以當成準實驗。以政策生效年份為斷點，比較受影響與未受影響的領域或機構，做雙重差分。這一步能把「經費造成開放取用」從關聯提升到準因果。\n\n第六步，把混合團隊拆成組成效果與選擇效果。用作者層次的固定效果，同一位女性研究者在混合團隊與同性別團隊之間的產出差異，才是組成效果。如果組成效果消失，那麼「鼓勵混合團隊」這個政策建議就沒有證據基礎，而這個否定結果本身是可以發表的。\n\n【專家回應　第二則　〈轉換不是技術細節，是結論的一部分〉】\n\n這篇最聰明的地方，是把方法論紀律偽裝成實證發現。如果直接投一篇論文，題目叫做「論書目計量應該做轉換敏感度分析」，那是一篇評論，很難進 Journal of Informetrics。但是把這個主張包在二十六萬篇的實證裡，再用經費這個變數當活體示範，方法論主張就有了證據。這是很老練的寫作策略，值得學。\n\n最致命的缺口在工具與資料的配對。結構方程模型對付潛在結構與多重路徑很好，但引用是高度右偏的計數資料，而結構方程模型假設的是連續且近似常態的指標。作者用轉換來讓資料就範，而不是換一個模型。於是整篇的邏輯有一點循環：用轉換解決分布問題，再宣稱轉換的選擇會改變結論。\n\n缺的是第四種規格。負二項回歸，或者對數常態回歸，直接對計數的資料生成過程建模，不轉換。如果負二項的結論跟轉換後的結構方程模型一致，方法論主張就更強；如果不一致，那才是真正有價值的發現。而在被引用最多的參考文獻裡，看不到統計物理學那一支把引用分布做成普適函數的工作，也看不到計數模型的路子。這個缺席，對一篇主題就是「規格選擇」的論文來說，是可以被質疑的。\n\n第二個引了卻沒做的地方，在綠色開放取用。論文報告綠色開放取用的引用最高，而綠色正是最依賴作者自行典藏的一種。作者願意花力氣去典藏的，通常是自己認為最好的論文。這叫自選偏誤。而論文的參考文獻裡，就引了 Gargouri 等人二零一零年那篇，那篇的核心正是用強制典藏授權造成的準實驗，去分離自選偏誤與開放取用本身的效果。引了證明自選偏誤存在的文獻，卻把綠色最高當成描述性結論報告，這是審稿人最容易抓住、也最好改的一點。\n\n次要問題有三個。一，團隊規模不是隨機分配的，大團隊通常來自資源充足的機構、國際合作、以及本來就高影響力的次領域，像是粒子物理、基因體與臨床試驗。所以超過二十位作者拿四倍引用，有多少是團隊規模的效果，多少是次領域與資源的效果，現在的設計分不出來。二，百分之二十二這個解釋變異的數字，是在哪一種規格下算出來的，讀者很難知道。三，以色列的科學系統國際合作比例極高、英語發表是常態、而且高度集中在少數研究型大學，團隊規模與引用的關係在這種系統裡可能比在別的系統更強。\n\n那麼，如果要重現並且改進這項研究，該怎麼做。\n\n第一步，用 OpenAlex 而不是 Scopus 重建以色列語料，以機構識別碼過濾。同時建一個兩個資料庫的交集子集，報告差異率。這一步本身就能回答「資料庫選擇是否影響結論」。\n\n第二步，取用類型用 Unpaywall 的欄位，不要自己重新定義。場域正規化要明確寫出期望值是用平均還是中位數算的。經費狀態用致謝欄的有無，並且先報缺漏率。\n\n第三步，補上第四種規格，也就是負二項回歸，以原始引用計數為結果，曝光時間取對數當作偏移項。把四種規格的係數方向、效果量與顯著性並排成一張表，這張表就是論文的核心產出。\n\n第四步，加入機構固定效果與次領域固定效果，看團隊規模的係數還剩多少。更進一步，用作者固定效果，比較同一位作者在大團隊與小團隊論文之間的引用差異。\n\n第五步，直面綠色開放取用的自選偏誤。三個做法：排除以預印本文化為主的領域之後重跑；用機構典藏授權的生效時間做斷點，比較強制與自願典藏的差距；用典藏時間與出版時間的間隔當控制變數，檢查先紅才典藏的時間偏誤。\n\n第六步，換引用視窗重跑。二零一三年的論文有十一年的累積，二零二三年只有兩年，而年份在原文只是一個自變數，不是分析結構的一部分。\n\n【專家回應　第三則　〈預測失敗本身就是發現〉】\n\n這一則我講短一點，因為它的價值集中在一句話上。\n\n論文最後說，團隊的組成與書目計量特徵，大致上不足以預測共著活動。多數人會把這句話當成模型表現不佳的坦承，然後跳過去。不要跳過去。這句話直接質疑了經費評審所依賴的那一整套線索。評審在挑團隊的時候，看的就是團隊組成與過去的產出紀錄，而這篇論文說，這些線索預測不了團隊會不會真的合作，也預測不了合作會不會持續。\n\n第二個值得注意的是那個「補助開始之前共著就已經略有上升」的觀察。這有兩種解讀。一種是申請這個動作本身就促成了合作，因為要寫共同計畫書。另一種是已經有合作的人比較容易申請成功。這兩種解讀導向完全相反的政策建議，而論文的設計分不出來。要分辨，需要的是申請未獲補助的對照組，也就是那些提了申請但沒拿到錢的團隊。\n\n那麼，如果要重現並且改進這項研究，該怎麼做。第一，去要落選申請案的名單，那是最自然的對照組，很多基金會願意在匿名條件下提供。第二，把補助結束後的追蹤期拉長並且統一，不同年份的補助追蹤期不一樣的話，衰退曲線會被混淆。第三，把共著以外的合作訊號也納進來，例如共同申請專利、共同指導學生、以及互相引用，因為共著只是合作的一種形式，而且是門檻最高的一種。第四，把「持續」定義清楚，是連續每年都有共著，還是五年內至少有一次，兩種定義會得到差很多的比例。第五，重新看那個預測失敗，用可解釋性的方法去看模型到底抓不到什麼，那個抓不到的東西，可能才是真正決定合作能不能延續的因素。\n\n【今日快訊】\n\n今天的二十五篇中等摘要，依主題分成四群。\n\n第一群是研究評鑑與科學計量學的自我反省，這一群今天特別厚。Scientometrics 有一篇單一作者的批判評論，主張書目計量分析已經變成低成本的量產模板，需要一份類似系統性回顧的檢查表，並且批評使用者過度依賴軟體工具卻不理解背後的演算法。Journal of Informetrics 有一篇哲學論文，援引康德、維根斯坦、孔恩、傅柯與布爾迪厄，主張書目計量的限制不是技術缺陷，而是本體論與認識論上的結構限制。萊頓大學團隊分析了兩百四十八份研究評鑑改革聯盟的行動計畫，發現價值口號遠多於可操作的實踐，開放取用是唯一被廣泛提及的具體項目。另有一篇歷史性回顧，梳理高影響力研究預測二十年的發展，並且堅持事後辨識與事前預測是兩種不同的任務。還有一篇提出新指標，把閱讀數除以引用數，發現指數較低的學者，這個比值反而更高，原因是他們的閱讀數較高而引用數較低。\n\n第二群是資料基礎設施與文本探勘。武漢大學與萊頓的合作研究檢驗了 OpenAlex 對中文學術資料的覆蓋，結果只索引了中文核心期刊的百分之三十七、文章的百分之二十四，而且大多數中文文章的語言欄位被標成英文。另有一篇用資訊理論建構「意義空間」，主張摘要的語意本身就能預測引用。\n\n第三群是人工智慧與創新管理。Technology in Society 有一篇純理論建構，提出「規格成本」這個構念，主張當代理人是沒有自身動機的人工智慧系統時，代理理論與管家理論都失效，真正的約束是委託人能不能把目標說清楚。R and D Management 用三百三十五家中國廠商的問卷，顯示生成式人工智慧經由市場敏捷度與營運敏捷度兩條路徑，同時打開需求端與供給端的創新，而環境動態性的負向調節只出現在國有企業。Technovation 有三篇：一篇用受限創新任務證明，用人工智慧取代創意評審團裡的一位人類，評分者間信度不會下降，但人工智慧的評分變異較低而且系統性偏高；一篇檢驗公平、課責、透明三原則如何經由「願意分享個人資料」這個行為閘門，才轉化成演算法正當性；一篇用三十個義大利智慧城市專案，發現生產型創業會帶動永續型創業，但反過來不成立。另有一篇質性研究，指出開放創新的服務供應商正從促進者轉型為策略編排者，並提出價值分享這個新的第三塊。\n\n第四群是製造、組織與數位人文。Journal of Manufacturing Technology Management 有三篇：一篇用中東兩百六十位主管的問卷，顯示供應鏈整合、雙元與吸收能力全部要經由風險緩解才影響競爭績效；一篇用九百一十三則領英職缺跑自然語言處理，辨識出兩百六十九項能力需求，結論是工業四點零創造的是混合型人力模型，傳統製造能力並沒有被取代；一篇用一百九十三家印度廠商，結合結構方程模型與人工神經網路，顯示積層製造要先變成供應鏈慣例才會變成績效。歐洲創新管理期刊有一篇用七十六個團隊、三百五十四位成員的三波資料，證明團隊反思是雙面刃，共享認知彈性高的時候促進創新，低的時候反而製造角色模糊。Technology Analysis and Strategic Management 有一篇用中國 A 股公司二零零七到二零二三年的資料，以風險值與預期短缺測量下行風險，發現技術創新降低尾部風險，機制是吸引機構投資人與提高分析師覆蓋。負責任創新期刊有一篇行動研究，在阿姆斯特丹的監控技術專案裡蹲了一年半，結論是即使不完美的公民對話，也能促成脆弱但真實的制度變化。數位人文領域今天有四篇：一篇用司法文本比對的似然比框架，測試 ChatGPT 模仿三百位作者風格的能力，結論是機器在模仿別人的時候反而暴露了自己的簽名；一篇評估四個中文大模型寫科幻短篇的能力；一篇用五千九百零一筆紀錄跑主題模型，梳理數位人文的七個主題；一篇分析義大利的業餘書評，發現語言特徵比讀者的人口特徵更能預測書評好不好看。還有一篇從細讀直覺出發，測量荷蘭小說裡憤怒與文本複雜度的關係，同一個構念用三種互不相同的方式操作化。\n\n【今日可教的一課】\n\n今天可以拿去教學生的原則是這一句：同一批資料換一種轉換，結論可能從沒有效果變成有效果，所以轉換方式必須先寫進分析計畫，不是事後挑選。\n\n支撐這句話的具體事實，來自今天第二則那篇以色列的研究。經費這個變數，在原始的引用計數之下跟引用沒有關聯；做了轉換之後，它變成顯著。同樣的二十六萬篇論文，同樣的變數，差別只在分析者的一個設定選擇。\n\n可以這樣對學生說。你在論文裡看到的每一個顯著性，都是資料與設定選擇的合成物。你沒辦法用眼睛把兩者分開，唯一的檢查方法，是把所有合理的設定並排跑一遍，然後把那張表放進正文，而不是附錄。如果結論在所有設定下都一致，你的發現很穩；如果不一致，那個不一致本身就是你最值得報告的東西。而如果你只跑了一種設定就寫進論文，你其實不知道自己看到的是什麼。\n\n今天還有第二個原則，跟第一則有關，也值得記下來：當你的核心變數是推斷出來的，錯誤率就是研究設計的一部分，必須報告，不能當背景噪音。這句話可以直接搬到地理編碼、機構消歧與作者消歧上。\n\n【今日總結】\n\n今天三則報導的共同主題，是測量與被測量之間的那道縫。西班牙那篇的縫，開在姓名與性別之間。以色列那篇的縫，開在計數與模型假設之間。德以基金會那篇的縫，開在共著與合作之間。三道縫的處理方式也一樣：不是把它補起來，而是把它量出來，然後看結論在縫的寬度變化下會不會翻轉。\n\n一句話收束今天：你的結論穩不穩，取決於你有沒有把自己的測量當成研究對象。\n\n早班到這裡結束，中午再會。"

   "podcast": "【每日學術新聞　二零二六年八月十五日　午班】\n\n各位聽眾午安。這裡是每日學術新聞午班，我是今天的主播。\n\n我們追蹤十九本科學計量學與創新管理領域的期刊，每一輪從最新上線的論文裡挑出值得停下來看的幾篇，先報導它們做了什麼，再用審稿人的眼光把它們拆開來講。\n\n今天有兩則深度報導，另外還有二十四篇的快訊。兩則深度報導的主角，一篇來自 Scientometrics，談的是怎麼用大型語言模型量測科學創新；另一篇來自 Journal of Manufacturing Technology Management，談的是三維列印為什麼推了十五年還是推不動。\n\n兩篇都是這個星期才上線的新稿。我們開始。\n\n第一則。〈用語言模型判斷新穎，用引用判斷顛覆，兩件事能不能合成一個數字〉\n\n這篇論文八月十三日刊登在 Scientometrics，題目是「整合大型語言模型語意推理與文獻計量分析的科學創新測量框架」。作者有三位，分別是尚杜鑫、于曉華與張曉，論文署名機構是華東師範大學。\n\n研究要處理的問題，是研究評鑑裡一個長期沒有答案的老問題。我們一直想量測「創新」，但手上的工具都是單軸的。\n\n引用數量到的是一篇論文被接受的程度。顛覆指數量到的是後續的研究會不會繞開你另起爐灶。文本新穎性量到的是這個說法本身有多新。\n\n這三件事在概念上不是同一件事，可是在實務上，它們長期被互相替代使用。\n\n作者的主張是，不要再爭論哪一個才是真的創新，而是把三個都留下來，當成同一個構念的三個面。\n\n資料是 S2ORC 語料庫裡的一萬零八百七十五篇文獻。S2ORC 是艾倫人工智慧研究院釋出的大型學術全文語料庫，它提供全文與內文的引用位置，這是能做語意層分析的前提。\n\n方法最有企圖的一步在第一個維度。他們量文本新穎性的時候，不用詞袋，也不用主題模型算距離，而是用大型語言模型的比較能力。\n\n具體做法是，先用檢索增強生成的技術，替每一篇論文撈出一組相關的摘要當作參照集，再讓模型判斷這篇論文相對於這一組參照，究竟有多新。\n\n檢索增強生成，簡稱 RAG，指的是讓語言模型在回答之前，先從外部語料庫檢索相關文件，把檢索結果放進上下文再作答。它的好處是把模型的知識從參數裡搬到可控的語料裡。\n\n第二個維度是影響力，用正規化的引用數。第三個維度是顛覆性，用 CD 指數。\n\nCD 指數是二零一六年由 Funk 與 Owen-Smith 提出的測度，判斷後續的發明是站在你的既有技術基礎上往前走，還是繞過你另起爐灶。值介於負一到正一之間。\n\n三個維度算完之後，用熵權法整合。熵權法的邏輯是，哪一個指標在這批資料上的離散度大，就給它比較高的權重。\n\n輸出是一個三維的創新指標，並且依照三個軸的高低，切出八個象限，形成一套創新的類型學。\n\n效度檢驗做了三層。收斂效度，看三個軸是不是測到相關的東西。區辨效度，看它們彼此能不能分開。增量效度，看合成之後是不是比任何單一維度更能區分突破型、顛覆型與萌芽型的研究。\n\n結果是三維測度確實優於單一維度。程式碼公開在 GitHub 上。\n\n三位作者在 OpenAlex 上的紀錄都非常單薄。第一作者尚杜鑫只有一筆著作、零次被引。這意味著這篇論文靠的是方法本身，而不是既有的聲望。\n\n第二則。〈三維列印推了十五年推不動，問題不在技術，在公司與公司之間〉\n\n這篇論文八月十二日刊登在 Journal of Manufacturing Technology Management，題目是「跨組織治理是積層製造採用的缺失層次：障礙結構的誘因分析」。\n\n作者有三位，分別是 Vincent Czyrnik、Felix Carl Schultz 與 Ingo Pies，都來自德國的哈勒維滕貝格馬丁路德大學。\n\n積層製造，就是一般說的三維列印。這項技術從二零一一年前後被吹捧成新的工業革命，到現在已經十五年，技術成熟度也確實在上升，可是工業級的採用始終低於預期。\n\n既有的解釋分成兩類。一類是技術性的障礙，材料、精度、後處理、疲勞性能。另一類是公司層次的障礙，成本、能力、組織慣性。\n\n作者指出，這兩類解釋有一個共同的預設，就是障礙一定在某一個組織的內部。所以它們漏掉了一整類：產生在組織與組織的邊界上，任何一家公司自己努力都解決不了的障礙。\n\n研究場域是德國的積層製造生態系。這個選擇不是隨意的。德國同時擁有強勢的機械製造傳統、密集的中小企業供應網路，以及發達的標準制定機構與產業協會，是觀察跨組織協調問題解析度最高的地方。\n\n資料是十九場專家訪談，採用立意抽樣。立意抽樣的邏輯是依研究目的挑選資訊最豐富的受訪者，而不是追求統計上的代表性。\n\n分析方法叫做 GABEK-WinRelan。這是奧地利學者 Josef Zelger 發展出來的質性方法，做法是把受訪者的語言表述拆成概念單位，再重建概念之間的關聯網路。\n\n它產出的是一張語意關聯圖，不是一份主題編碼的清單。選這個工具而不是主流的主題分析，是一個明確的方法立場：作者要的是障礙之間的關聯結構，不是障礙的分類。\n\n詮釋的框架叫做 ordonomics，中文可以譯成秩序倫理學。它的核心主張是，看起來像道德衝突的現象，底層往往是誘因結構造成的社會困境，所以解方在於改變規則，而不是勸人向善。\n\n發現是四組障礙，配上四種治理回應。\n\n第一組，智慧財產權的不確定性。在三維列印裡，數位檔案就是產品，交出去就失去控制。回應是可追溯的資料處理承諾。\n\n第二組，品質的模糊性。回應是透過認證的材料系統，發出可信的品質訊號。\n\n第三組，標準化的碎裂。回應是產業別的集體對齊。\n\n第四組，技能短缺。回應是由中介機構支持的資格培育投資。\n\n實務上的貢獻是一個兩問診斷法。第一問，這個障礙反映的是單邊的協調問題，還是集體的協調問題。第二問，處理它需要的是自我約束，還是賦能式的承諾服務。\n\n這裡有一個非常重要的背景事實，我們待會兒在專家回應裡會回來談。\n\n第三作者 Ingo Pies，正是 ordonomics 這套框架的創建者。他在 OpenAlex 上有四百二十篇著作、將近兩千四百次被引用，h 指數是二十五。\n\n【專家回應　第一則　〈用語言模型量創新〉】\n\n先說最聰明的地方。\n\n把「新穎」從幾何距離改成語意判斷，這是這篇真正的原創處。\n\n過去用詞向量算新穎性，永遠有一個尷尬：兩篇論文用詞很不一樣，可能是因為主題不同，不是因為想法新。用語言模型加檢索，先撈出可比的參照集再作比較，理論上能繞開這個混淆。\n\n接下來是最致命的缺口。\n\n語言模型的判斷不可重製。\n\n模型的版本、溫度參數、提示詞的寫法、參照集的抽樣方式，任何一個變動都會改變新穎性的分數。作者公開了程式碼，可是公開程式碼不等於固定模型行為。程式碼可以跑，但跑不出同樣的數字。\n\n一個要進研究評鑑的指標，不能有這種不可重製性。這是這篇最脆弱的一格。\n\n而這個缺口，其實在它自己的參考文獻裡就寫著答案。\n\n被引用的文獻裡有一篇，是 Bornmann 等人二零二零年的〈顛覆指數是否具有收斂效度〉。那篇論文的結論，正是各種顛覆指數的變體之間，一致性堪憂。\n\n也就是說，作者引用了一篇專門在講「這一類指標彼此不一致」的文章，然後選了其中一個版本的 CD 指數，當成自己三個軸裡的一個軸，全篇沒有跑任何變體比較。\n\n這就是我們一直在講的那件事：引了卻沒做，比沒引更糟。因為引用等於你知道這個問題存在，卻選擇不處理。\n\n再說幾個次要的問題。\n\n第一，熵權法是一個沒有理論的加權。熵權說的是哪一軸在這批資料上變異大，就給它高權重。這是資料的性質，不是創新的性質。換一個學科的語料，權重就換一組，八個象限的切分點也跟著移動。\n\n第二，三個軸的時間性不一致。文本新穎性在論文發表當下就決定了，影響力與顛覆性卻需要好幾年的引用累積。把三個時間尺度不同的量放進同一個合成，等於用未來的資訊去評價當下的新穎。這意味著這個指標只能事後用，不能用來做資源的優先排序，而後者正是作者宣稱的實務價值。\n\n第三，增量效度的效標在哪裡。他們宣稱能更好地區分突破、顛覆與萌芽三類研究，但這三類的標籤從哪裡來？如果標籤本身就是由指標切出來的，那就是循環論證。\n\n那麼，如果要重現並且改進這項研究，該怎麼做？\n\n第一步，重建資料，並且固定引用窗。從 S2ORC 抽同樣量級的語料，但這次要先報告學科分布與年份分布。關鍵是把引用窗固定成發表後三年或五年並且明說，讓三個量處在同一個時間基準上。\n\n第二步，用兩種以上的工具各做一次新穎性。一路照原文用語言模型加檢索；另一路用 Shibayama 一系的文本新穎性，也就是概念或詞彙組合的稀有度，再加上 Uzzi 的期刊組合非典型性。三者算相關矩陣。如果相關低於零點三，那麼「文本新穎性」這個構念在三種操作化下就不是同一回事，整個三軸整合的前提都要重寫。\n\n第三步，把語言模型的判斷當成一台測量儀器來檢驗。同一批論文用同一組提示詞跑三次，算重測一致性。再換兩個不同的模型，算跨模型一致性。報告 Krippendorff alpha 或組內相關係數。這是原研究完全沒做，卻決定整篇能不能用於研究評鑑的一環。\n\n第四步，顛覆性那一軸做三重穩健。CD 指數用三種引用時間窗各算一次，用兩個不同的資料庫各算一次，再用三種指標變體各算一次，然後報告彼此的等級相關。如果相關普遍低於零點五，就在正文裡明說這一軸的不確定性，而不是挑一組報告。\n\n第五步，加權方式做敏感度分析，不要只用熵權。至少跑四種：等權、熵權、主成分的第一主軸負荷，以及由外部效標擬合出來的最適權重。看八個象限的分群結果在四種權重下的一致性。如果一致性很低，就承認類型學是權重的產物，不是資料的結構。\n\n第六步，建立獨立的效標。不要用指標自己切出來的標籤當效標。可以用的外部效標包括重大獎項的提名清單、教科書收錄、專家小組的盲評分數，或者後續被納入臨床指引與技術標準的紀錄。效標必須在指標計算之前就存在。\n\n【專家回應　第二則　〈三維列印的跨組織治理〉】\n\n先說最聰明的地方。\n\n「缺失層次」這個問題設定，成本最低，收益最高。\n\n它不否定既有文獻，只說既有文獻的分析層次還不夠。這種定位方式很聰明，因為審稿人多半就來自被它擴充的那個傳統，不會覺得被冒犯。標題就把貢獻說完了，這是很成熟的寫作。\n\n接下來是最致命的缺口。\n\n標題承諾的是「誘因分析」，可是論文做的是詮釋。\n\n誘因分析的標準做法，是把誘因結構寫成報酬矩陣，或者至少是明確的成本效益比較，然後推導出均衡。本篇的誘因，是從訪談的語料裡詮釋出來的：受訪者說他擔心資料外流，作者判讀為智慧財產權的困境。\n\n這是詮釋，不是分析。\n\n而這個落差，同樣在參考文獻裡就顯形了。\n\n被引用最高的一篇是 Olson 一九六五年的《集體行動的邏輯》，被引用一萬三千四百多次。它提供的核心命題是，集體利益不會自動產生集體行動，因為每個成員都有搭便車的誘因。\n\n問題是，全篇沒有任何一步去區辨搭便車與其他的失靈機制。\n\n舉個具體的例子。一家中小企業不願意投資積層製造的資格培育，可能有三個完全不同的理由。\n\n第一，擔心培訓好的技工被別人挖走，這是搭便車。第二，單純算過投報率不夠，這是不划算。第三，根本不知道有這個選項，這是資訊缺口。\n\n這三種在訪談的語料裡長得非常像，但是治理回應完全不同。引用了 Olson，就等於承擔了區辨的責任，而這個區辨沒有做。\n\n再說幾個次要問題。\n\n第一，被引文獻裡有 Olson，卻沒有 Ostrom。這在一篇談集體協調問題的論文裡是明顯的空缺。\n\nOstrom 是二零零九年的諾貝爾經濟學獎得主，也是至今唯一得到這個獎的女性。她一生的工作，就是證明在對的制度設計之下，使用者社群可以自己解決集體行動問題，並且歸納出八項制度設計原則。\n\n本篇的四種治理回應——可追溯的承諾、認證訊號、產業別集體對齊、中介支持的資格培育——幾乎每一項都能對到 Ostrom 的設計原則，卻沒有接上去。\n\n第二，十九場訪談要撐四組障礙，資料量與結論的粒度不太匹配。每一組平均只有不到五位受訪者的支撐。摘要也沒有報告受訪者的角色分布，我們不知道他們是設備商、使用者、材料商、認證機構還是產業協會。如果四組障礙不是每一組都跨角色出現，那麼「障礙群集」可能只是「角色群集」的另一種說法。\n\n第三，德國這兩個字被當成背景，而不是變數。德國有標準協會、有工商會主導的職業資格體系、有 Fraunhofer 這類中介機構。四種治理回應裡至少有兩種，幾乎是德國制度的直接產物。在缺乏這些中介的經濟體裡，同樣的診斷會導向完全不同的處方。\n\n那麼，如果要重現並且改進這項研究，該怎麼做？\n\n第一步，重建抽樣框，把行動者的類型攤開。先畫出德國積層製造生態系的行動者地圖，包括設備商、材料商、服務局、依產業別區分的終端使用者、認證機構、標準制定組織、產業協會、研究機構、保險與法務。然後報告十九位受訪者落在哪些格子，哪些格子是空的。這一步不需要新資料，只需要重新報告。\n\n第二步，把三種失靈機制操作化成可以區辨的訪談編碼。針對每一個被判為障礙的陳述，用三個互斥的編碼標記：搭便車、投報率不足、資訊或能力缺口。這三者在語料裡有明確的語言標記，是編得出來的。編完之後報告分布。這一步是整個重做計畫裡最關鍵的一步，因為它直接補上引了 Olson 卻沒做的那個洞。\n\n第三步，讓 GABEK 的分群準則變得可檢驗。報告軟體的關聯閾值設定，並且在三個不同的閾值下各跑一次分群，比較群集數量與組成的穩定性。同時做一次平行的主題分析當對照，報告兩種方法的結論差異。\n\n第四步，把 Ostrom 的設計原則當成競爭框架，而不是補充。把四組障礙同時用秩序倫理學的困境分類與 Ostrom 的八項設計原則各判讀一次，做成對照表，說明兩者在哪些地方給出相同的建議、哪些地方不同。如果秩序倫理學沒有多給出東西，就誠實地說它是重述。\n\n第五步，用制度差異當自然實驗。選一個中介機構密度明顯較低的經濟體，例如波蘭或葡萄牙的積層製造生態系，做一次平行的訪談。如果「中介支持的資格培育」這一項在缺乏工商會體系的地方消失了，就證明它是德國制度的產物，不是這項技術的固有屬性。這是把外部效度從限制變成發現的做法。\n\n第六步，做反身性的檢查。請一位不熟悉秩序倫理學的研究者，對同一批逐字稿獨立做一次開放編碼，比較兩份編碼在「什麼算是困境」上的重疊度。當框架的創建者是共同作者的時候，這一步不是禮貌，是必要。\n\n【今日快訊】\n\n以下是本輪整理的二十四篇中等摘要，依主題分群，每一篇一到兩句。\n\n先看科學計量與研究評鑑這一群。\n\nResearch Policy 八月十三日，Pathak 等人用歐洲兩百九十九家半導體設備公司二零一三到二零二二年的專利，問循環經濟創新到底是不是真的顛覆，答案要看共同發明人的網路結構。\n\nScientometrics 七月三十日，五百三十一篇撤稿論文顯示，發表在愈有名的期刊、作者機構排名愈前的撤稿論文，撤稿之後反而被引用得愈多。這篇用了自我對照病例系列設計，是觀察資料裡很漂亮的因果近似。\n\nJournal of Informetrics 八月十二日，肖婷把資訊檢索的 TF-IDF 借過來重新加權 CRediT 貢獻聲明，濾掉「所有人都掛所有角色」的雜訊，語料是 PLOS ONE 的大規模出版後設資料。\n\nScientometrics 七月二十九日，一篇用八百零一篇論文加上七千六百一十件專利，以熱沖壓技術為個案，提出結合文獻與專利來預測創新的方法。\n\n接下來是人工智慧與研究工作這一群。\n\nResearch Policy 七月二十七日，一個預先註冊的隨機實驗，三百一十位研究者參與。核心發現是研究經驗的負向調節：經驗愈多的研究者，愈不採納生成式人工智慧的構想建議。要注意的是結果變數是自陳的知覺，不是構想品質的獨立評分。\n\nTechnology in Society 八月一日，三百三十四位語音助理使用者的資料顯示，五種擬人特質都會透過自動化社會臨場感導向電子口碑，其中擬人線索是完全中介。\n\nTechnovation 七月二十四日，一篇用建構論的決策支援系統，盤點機器人理財顧問如何整合高齡者進入人工智慧時代。\n\nTechnology Analysis and Strategic Management 七月二十八日，一個三方演化賽局模型顯示，適度的管制能提升人工智慧的擴散，過度的管制則把系統推向低創新的均衡。\n\n再來是創新政策與企業績效這一群。\n\nResearch Policy 七月二十三日，股權群眾募資豁免對新創成立的平均效果不顯著，但在外部融資依賴度高的產業顯著為正，而且在相關多樣性高的區域效果會放大。這是一篇「平均效果為零但故事不為零」的範本。\n\nEuropean Journal of Innovation Management 七月二十八日，六千零七十五位韓國公務員的資料顯示，混合辦公對創新工作行為既沒有平均效果，也沒有可信的異質效果。作者用排列檢定、分組校準、一百次重抽與四種替代學習器層層驗證這個空結果。一篇把空結果當成貢獻本身的論文能夠被接受，說明機器學習異質效果的可信度危機已經被期刊端認真對待。這是本輪最值得完整讀完的一篇。\n\nJournal of Manufacturing Technology Management 八月十二日，中國上市製造業十六年的縱橫資料顯示，合作網路的可及性與獨立性透過技術生態位推高綠色創新效率。\n\nEuropean Journal of Innovation Management 七月二十四日，中國上市公司十六年的資料顯示，產學合作透過知識多元化推動後進企業在國內與全球兩個層次的技術追趕。\n\nTechnovation 七月二十三日，海洋生技萃取物 fucoidan 的商業化歷程顯示，撐得住低價值協作的機制，撐不住往高價值應用的躍遷。作者把這個現象命名為低價值陷阱。\n\nJournal of Product Innovation Management 七月二十二日，一個非洲離網太陽能社會企業的十年縱貫個案，把負責任創新當成敏感化框架而不是固定的倫理範本。\n\n接下來是製造與工作現場這一群。\n\nJournal of Manufacturing Technology Management 七月二十三日，八十位技職學生的隨機對照實驗顯示，投影式的作業指引顯著加快汽車電池的組裝速度。要注意分層之後每一格只剩二十人，交互作用的檢定力值得懷疑。\n\nJournal of Manufacturing Technology Management 七月二十四日，一個摩洛哥製藥業的個案，用層級分析法加上 TOPSIS 評選需求預測模型，結論是人工智慧方法優於傳統統計方法。\n\nTechnology Analysis and Strategic Management 七月二十九日，伊朗一家鋼鐵控股公司一百五十八份問卷的結構方程模型，數位領導對組織績效的直接效果是零點四六。所有變數來自同一份自陳問卷，共同方法變異值得警惕。\n\nTechnology Analysis and Strategic Management 七月二十九日，葡萄牙警政與觀光領域的六十三場訪談顯示，說出倫理疑慮並不會打斷技術軌跡，反而穩定了期待、維持了創新的動能。\n\n最後是衛生政策與數位人文這一群。\n\nHealth Research Policy and Systems 八月十三日，用兩屆論壇接受的全部摘要，去測全球共享研究議程的四十一個優先問題有沒有被真的做到。\n\nHealth Research Policy and Systems 八月十日，英國 Somerset 地方政府與社區部門六十四人的質性基線調查，盤點研究文化與能量的現況。\n\nHealth Research Policy and Systems 七月三十日，印尼一年期的多層次質性研究，共同發展在地化的研究轉政策框架。\n\nHealth Research Policy and Systems 七月二十二日，迦納的疫苗研究從一九七七年到二零二五年，從下游的試驗場走向上游的研究樞紐，疫情之後產出增加超過五倍。\n\nTechnology in Society 七月三十一日，七十九位跨性別與性別多樣成人的資料顯示，遊戲化身的自訂度愈高，賦權感與真實自我呈現愈強；受限則可能觸發性別不安。\n\nDigital Scholarship in the Humanities 七月二十二日，用統計方法重建羅馬帝國東部皇帝崇拜的擴散，論證它是在地協商的多中心現象，不是由上而下的強制。\n\n【今日可教的一課】\n\n今天有兩則原則，都很具體。\n\n第一則是：作者名單就是方法論的說明書。\n\n看到一篇論文用了一個在英語文獻裡罕見的框架，第一件事不是去查那個框架，而是去查作者名單裡有沒有這個框架的創建者。\n\n今天第二則報導就是最乾淨的例子。那篇論文用秩序倫理學來解釋三維列印的採用障礙，這個框架在英語管理期刊裡幾乎沒有人用。為什麼是它？\n\n因為第三作者 Ingo Pies 就是這套框架的創建者，他有四百二十篇著作，h 指數二十五。\n\n這件事的實務意義是：有創建者掛名，框架的選擇就不需要額外辯護，論文真正的貢獻在應用領域的新意。沒有創建者掛名，那麼「為什麼用這個框架」就是全篇最該被質問的一句話。\n\n對學生可以這樣說：讀跨傳統的論文時，先看作者是誰，再看方法是什麼。方法的正當性，有一半寫在作者名單上。\n\n第二則是：熵權法決定的權重不是理論，是資料的方差。\n\n今天第一則報導那篇，用熵權法整合文本新穎性、影響力與顛覆性三個維度。權重完全由這三個軸在一萬零八百七十五篇語料上的離散度決定。\n\n換一個語料，權重就換一組，所謂「可解釋的八個象限」也會跟著漂移。而這篇論文沒有報告權重本身的數值，也沒有檢查權重在子樣本上的穩定性。\n\n對學生可以這樣說：任何自稱客觀的賦權方法，都只是把主觀從研究者身上，轉移到樣本身上。用了客觀賦權，你就有責任報告權重的數值，以及它在不同子樣本上有多穩。\n\n這兩則原則在「論文寫作與批判思考手冊」裡目前都還沒有出現。第一則建議補進「讀文獻」那一章，第二則建議補進「測量與指標」那一章。要不要補，請您決定。\n\n【今日總結】\n\n今天兩則深度報導有一個共同的主題：兩篇論文都引用了一篇說「這件事有問題」的關鍵文獻，然後都沒有處理那個問題。\n\n第一則引了顛覆指數收斂效度的研究，卻只用一個版本的指標。第二則引了集體行動的邏輯，卻沒有區辨搭便車與其他的失靈機制。\n\n引了卻沒做，是審稿人最容易抓、也最難辯護的一種缺口。因為引用本身就是你知情的證據。\n\n反過來說，這也是最容易改進的地方。你自己的稿件裡，每一篇被引用的方法論文獻，都應該對應到你實際做過的某一件事。做不到的，就不要引。\n\n以上就是今天的每日學術新聞午班。晚上再會。\n"

     "gist": [
      "問題意識來自一個實務上刺眼的觀察：中國國家智慧製造示範計畫認證的工廠，自動化設備、連網程度、官方認可三者俱全，發明績效卻高度不均，有些甚至接近零。既有文獻的解釋工具是「採用」——採用了自動化就該有產出——但採用框架無法解釋為什麼採用程度相近的工廠會落在績效光譜的兩端。作者把問題重新界定為轉換問題：自動化到發明之間存在一段轉換過程，而轉換效率受能力約束。",
      "資料是 85 家上市公司，全部是中國國家智慧製造示範計畫的東道主體。條件變數取自二零二二會計年度，涵蓋技術、組織、環境三類（TOE 框架的標準三分），結果變數是二零二四年的發明專利密集度。兩年的落差是刻意留給專利從申請到公開的時間；但這個落差在文中被當成技術性安排而非理論主張，這一點後面會回來談。",

      "發現分三層。第一層是否定性的：基礎設施強度並未構成統計上可支持的天花板。這句話直接反駁了「設備堆得夠高，發明自然會來」的政策直覺。第二層是替代性的：真正限制可達發明上限的是人力資本與組織資源基礎——換句話說，天花板是人畫的，不是機器畫的。第三層是組態性的：高發明可透過多條以能力為中心的路徑達成，其中包括不需要進一步加深基礎設施的路徑；而近乎零的發明對應非對稱組態，最典型的是基礎設施沉重但人力資本支撐不足的樣態。",

     "design": "設計是典型的組態研究：小 N、多條件、非對稱因果、集合論而非變異論。TOE 框架提供條件分類，NCA 提供必要性，fsQCa 提供充分性組態。被引用最多的參考文獻精確地洩漏了這套設計的來源：Fiss（2011）的〈Building Better Causal Theories: A Fuzzy Set Approach to Typologies〉是組態研究在管理學的入門憑證，Ragin（2008）的《Redesigning Social Inquiry》是 fsQCA 的方法母本，Schneider 與 Wagemann（2012）的《Set-Theoretic Methods for the Social Sciences》則是操作標準的參照。三者同時出現，等於明講了「本文的因果語言是集合論的」。理論側則由 Cohen 與 Levinthal（1990）的吸收能力、Grant（1996）的知識基礎觀點、Teece（1986）的互補性資產撐起——這三篇合起來就是「能力天花板」的思想來源。工業 4.0 的實證錨點來自 Frank 等（2019）與 Dalenogare 等（2018），數位轉型的框架來自 Vial（2019）與 Verhoef 等（2019）。值得注意的缺席：NCA 的方法母本（Dul 的原始方法論文）並未出現在被引用最多的參考文獻中，這在一篇以 NCA 為主要否定性宣稱的論文裡是個訊號——後面會展開。",

      "<b>錨點文獻是 Cohen 與 Levinthal（1990）的吸收能力。</b>被引近三萬五千次的這篇提供了全文最核心的直覺：外部技術要轉成內部產出，中間隔著一層與既有知識存量成正比的吸收能力。本篇的「能力天花板」本質上是吸收能力的天花板版本——不是說能力影響轉換效率，而是說能力限定了轉換的上限。這個從「影響」到「上限」的改寫，就是它想要的理論增量。",

      "<b>互補性資產的構念來自 Teece（1986）。</b>〈Profiting from technological innovation〉的核心論點是：技術本身不創造利潤，互補性資產才決定誰獲利。本篇把它平移到發明層次——自動化基礎設施是技術，人力資本與組織資源是互補性資產，缺了後者前者無法轉換。這個平移是合理的，但也帶來一個問題：Teece 談的是價值攫取（誰賺到），本篇談的是產出生成（有沒有做出來），兩者的邏輯不完全對應，文中沒有處理這個落差。",
      "<b>資訊處理觀點來自 Tushman 與 Nadler（1978）。</b>這是被引用最多的參考文獻裡最老的一篇（一九七八年），提供的是「組織設計必須匹配資訊處理需求」的古典命題。它與「基礎設施能力錯配」的概念直接同源。引它是對的，但也顯示這篇的理論創新其實是把一個四十八年前的匹配命題，用集合論的語言重新表述。",
      "<b>缺席的傳統是專利計量本身。</b>被引用最多的參考文獻裡看不到任何專利指標方法的文獻——沒有專利品質、專利家族、引用加權、技術類別分佈的處理。結果變數叫「發明專利密集度」，但它是件數密集度還是品質加權的密集度，從參考文獻結構看不出有處理。這是一個實質的空缺，因為自動化最可能影響的正是專利的組成（製程專利增加、產品專利不變），而件數會把這個結構變化洗掉。",

   "podcast": "【每日學術新聞　二零二六年八月十三日　晚班】\n\n各位晚安，歡迎收聽每日學術新聞晚班。\n\n我們追蹤十九本期刊，包含科學計量、創新管理、技術政策與數位人文四個社群。今天晚班有兩則深度報導，加上二十一則今日快訊。\n\n先說明一件事。今天各刊的最新上線日期停在八月十一日，也就是說，沒有當日最新的文章。這在週間並不罕見，出版社的上線批次通常集中在週一到週三。\n\n今天的兩則深度報導，一則關於學術資料庫，一則關於智慧工廠。表面上毫無關聯，但它們問的其實是同一個問題：當你把資源投進一個系統，為什麼產出沒有跟著出來。第一則問的是，把更多期刊收進資料庫，為什麼南方國家的可見度反而更差。第二則問的是，把更多自動化設備裝進工廠，為什麼發明專利沒有變多。\n\n現在開始。\n\n第一則。〈二十一年的共存，兩個資料庫的偏差在往哪裡走〉\n\n這篇發表在 Scientometrics，上線日期是二零二六年六月三十日，作者是 Toluwase Asubiaro，一位任職於加拿大萊斯布里奇大學的研究者，同時掛名南非大學與奈及利亞伊巴丹大學。他是單一作者。\n\n研究對象是兩個資料庫：Web of Science 與 Scopus。這兩個資料庫是全球研究評鑑的事實基礎設施，決定了誰的研究被算數、誰的不被算數。\n\n資料規模是這樣的。Web of Science 的期刊名錄，取自 Clarivate 公司的 InCites 系統。Scopus 的期刊名錄，取自 Scimago 期刊排名。而全球期刊的母體基準，用的是 Ulrich 國際期刊指南。時間範圍是二零零四年到二零二四年，整整二十一年，逐年計算。\n\n方法有兩個關鍵動作。第一個動作是計算相對覆蓋率。什麼叫相對覆蓋率？就是資料庫裡某一類期刊的比例，除以這一類期刊在 Ulrich 裡的比例。大於一，代表這一類被過度收錄。小於一，代表這一類被收得不夠。這一步很重要，因為它把「Scopus 收得比 Web of Science 多」這種沒有意義的比較，換成了「相對於世界上有多少這種期刊，資料庫收了多少」。\n\n第二個動作是趨勢檢定。作者用了一個叫做 Mann–Kendall 的無母數趨勢檢定，在 R 這個統計軟體裡實作。這個檢定只回答一件事：這條線是顯著上升，還是顯著下降。它不回答上升了多少。作者刻意只宣稱方向，不宣稱幅度。\n\n結果分成兩層。\n\n第一層是學科。自然科學、工程與技術、醫學與健康科學，在兩個資料庫裡一貫被過度收錄。而且注意，這是在它們的全球占比穩定甚至下降的情況下發生的。相對地，農業與獸醫科學、社會科學、藝術與人文，一貫被收得不夠，而它們的覆蓋比例只是穩定或略有上升。翻譯成白話：學科偏差二十一年來幾乎沒有鬆動。\n\n第二層是區域，這一層才是新聞。撒哈拉以南非洲、中亞與東南亞，在 Ulrich 裡的期刊份額是上升的，可是在兩個資料庫裡卻變得更加代表不足。母體在長大，收錄卻沒跟上。東亞與東南亞、拉丁美洲與加勒比海，情況相反，它們在 Ulrich 的份額下降，卻在兩個資料庫裡擴張，代表不足因此縮小。北美在 Ulrich 的份額微降，可是它原本強烈的過度代表急劇下滑。歐洲在 Ulrich 的份額下降，但在兩個資料庫裡的份額與過度代表，穩定或者還略有上升。\n\n換句話說，二十一年來，北美的優勢在讓渡，歐洲的優勢在固化，而撒哈拉以南非洲的處境是惡化。\n\n作者的定位很清楚。他不是第一次做這個題目。二零二三年他比較過非洲期刊在 Web of Science、Scopus 與 Crossref 三個系統的收錄。二零二四年他做過區域覆蓋差距。這一篇是同一條研究線的第三站。他的學術指標不高，四十四篇著作、被引用四百九十七次、h 指數是九。但這條研究線讓編輯不必猜他是誰、在做什麼。\n\n第二則。〈為什麼更多自動化，不保證有發明〉\n\n這篇發表在 Journal of Manufacturing Technology Management，上線日期是二零二六年八月十一日，是本輪最新的深度報導。作者是兩位：第一作者 Fangming Chen，通訊作者 Jianguo Zheng，任職於上海的東華大學。\n\n研究對象是中國國家智慧製造示範計畫裡的工廠。這些工廠自動化設備齊全、設備連網、拿到官方的智慧製造認證，可是發明績效高度不均，有些甚至接近零。\n\n作者做的第一件事，是把問題改寫。過去文獻問的是「有沒有採用自動化」，作者改成問「自動化能不能轉換成發明」。這個改寫，就是全篇的貢獻宣稱。\n\n資料規模是八十五家上市公司，全部是示範計畫的東道主體。條件變數取自二零二二會計年度，分成技術、組織、環境三類。結果變數是二零二四年的發明專利密集度。中間隔了兩年，是留給專利從申請到公開的時間。\n\n方法用了兩個工具，兩個都不是迴歸。\n\n第一個叫必要條件分析，英文縮寫是 NCA。它畫的不是迴歸線，是天花板線。它問的是：當某個條件只有這麼高的時候，產出最多只能到多高。這是關於上限的問題，不是關於平均的問題。\n\n第二個叫模糊集質性比較分析，英文縮寫是 fsQCA。它問的是：哪些條件的組合足以帶來高產出，哪些組合對應近乎零的產出。它的關鍵特性是非對稱，也就是說，帶來成功的組合，它的反面不一定帶來失敗，所以兩邊要分開跑。\n\n結果分成三層。\n\n第一層是否定性的。基礎設施強度，並沒有形成統計上可支持的天花板。也就是說，設備堆得夠高，發明自然會來，這個政策直覺被資料反駁了。\n\n第二層是替代性的。真正限制發明上限的，是人力資本與組織資源基礎。用一句話說：天花板是人畫的，不是機器畫的。\n\n第三層是組態性的。高發明可以透過好幾條以能力為中心的路徑達成，其中包括不需要再加深基礎設施的路徑。而近乎零的發明，對應的是非對稱的組合，最典型的樣態是基礎設施沉重，但人力資本支撐不足。\n\n作者據此提出兩個機制概念：能力天花板，以及基礎設施能力錯配。並且提出一個分階段的閘門式投資排序規則：先確保人力資本與組織資源到位，再進行設備加深。\n\n這個建議對政策是有挑戰性的，因為多數智慧製造補貼的請款依據，正是設備投資金額。\n\n【專家回應　第一則　資料庫覆蓋的二十一年】\n\n先說這篇最聰明的地方。\n\n最聰明的一步，是把 Ulrich 引進來當分母。絕對數字的比較沒有評價意義。Scopus 收兩萬多本，Web of Science 收兩萬多本，這種數字告訴你的只是商業規模。除以母體之後，相對覆蓋率才變成可以跨學科、跨區域、跨年度比較的量。而且這一步同時處理了母體本身的變化，所以才可能得出「北美的過度代表急劇下滑」這種發現——因為北美在世界期刊裡的份額也在變。\n\n第二個聰明的地方是統計工具的克制。他只用 Mann–Kendall 趨勢檢定，只宣稱方向，不宣稱幅度。在只有二十一個時點的序列上，這是誠實的選擇。\n\n現在說最致命的缺口。\n\n這篇引用了 Seglen 一九九二年那篇〈科學的偏態〉。那篇的核心論點是，引用與產出的分布極度偏斜，所以平均值會誤導你。這個邏輯推到覆蓋研究上，結論應該是：每本期刊算一票，會誤導你。因為一本每年出十二篇文章的非洲期刊，跟一本每年出兩千篇的歐洲期刊，在他的計算裡各算一本。\n\n他引了這個邏輯，但沒有做這件事。這是最典型的「引了卻沒做」。\n\n而這個缺口不是技術瑕疵，它會改變結論。假設拉丁美洲的期刊收錄數上升，但被收的都是小期刊，那麼「代表不足在縮小」這句話就是假的——期刊數上升了，文章數的份額可能完全沒動。要驗證這件事，只需要把每本期刊的年產量接上去重算一次，成本很低，資訊量很大。\n\n第二個致命的地方是 Ulrich 本身。Ulrich 是一個商業目錄，它也有登錄門檻，也有商業取向，它對南方國家、非英語、非商業出版的期刊，同樣可能收得不夠。整篇的所有結論都建立在這個分母上，可是全文沒有對這個分母做任何穩健性檢驗。如果 Ulrich 的偏差方向跟兩個資料庫相同，那麼真實的代表不足會被系統性低估。\n\n次要問題有三個。\n\n第一，Mann–Kendall 對序列自相關敏感。覆蓋率這種年度序列幾乎必然自相關，這會誇大顯著性。應該做預白化處理，或者改用修正版的檢定。\n\n第二，區域分類太粗。撒哈拉以南非洲是一格，奈及利亞跟南非放在同一格裡，區域內部的異質性完全看不見。\n\n第三，區域效果跟語言效果沒有分開。二零零四到二零二四，也正好是學術出版集中化最劇烈的二十年。拉丁美洲覆蓋率上升，究竟是因為期刊變好了，還是因為大出版商把當地期刊買下來了？這篇答不出來。\n\n那麼，如果要重現並且改進這項研究，該怎麼做？\n\n第一步，不要把 Ulrich 寫死成唯一的分母。同時建三套母體：Ulrich、Crossref 的期刊層級聚合、以及開放取用期刊目錄加上南方區域索引平台的聯集。三套分母各跑一次完整流程，把結果並列。如果三套分母下區域趨勢的方向一致，你的結論就穩。如果不一致，那個不一致本身，就是比原論文更有價值的發現。\n\n第二步，把資料重建到期刊層級。每一本期刊建一筆紀錄，欄位包含國際標準期刊號、在各資料庫的首次出現年份、最後出現年份、出版國、出版商、主要語言、年出版量、學科。出版商跟語言用 Crossref 的後設資料補齊，年出版量用 OpenAlex 補齊。這一步把研究從占比比較，升級成可以跑迴歸的面板資料。\n\n第三步，改用存活分析。覆蓋率的變化有兩個完全不同的來源：新期刊被收進來的機率，跟已經被收的期刊被剔除的機率。用離散時間的存活模型分別估計這兩個風險。這樣你才回答得了，撒哈拉以南非洲的惡化，究竟是因為新刊進不去，還是因為舊刊被踢出來。原論文的占比比較，永遠答不了這個問題。\n\n第四步，用併購事件做因果識別。建一份大型出版商收購區域期刊的事件清單，可以從出版商的年報跟 Crossref 的會員變更紀錄重建。然後用交錯採用的雙重差分，估計被四大出版商收購對該刊收錄機率的影響。這是把區域效果跟所有權效果分開的唯一辦法。\n\n第五步，把趨勢檢定補成一整套。保留 Mann–Kendall，但做三件事：對每條序列做預白化處理自相關；用 Sen 斜率報告趨勢的幅度而不只是方向；用結構斷點檢定找出轉折的年份。三者合起來，你才能說出「北美的過度代表從哪一年開始下滑、每年下滑多少」——而這才是政策討論需要的形狀。\n\n第六步，做反例檢定。先用期刊產出的成長率，預測「應該有的」覆蓋率成長，再找出實際成長顯著低於預測的區域。如果撒哈拉以南非洲是唯一的離群者，你的結論成立。如果離群者散布在各洲，而且跟語言高度相關，那麼真正的機制是語言，不是區域，整篇的因果敘事就要改寫。\n\n【專家回應　第二則　智慧工廠的能力天花板】\n\n先說最聰明的地方。\n\n這篇最強的部分，是問題意識跟方法選擇之間的對應。它想主張「設備不是瓶頸」，而這種主張迴歸做不到。迴歸給你的是平均效果，說的是「設備多一單位，發明多多少」。可是「設備不是瓶頸」講的是上限，不是平均。要講上限，就必須用天花板邏輯，也就是必要條件分析。這個對應關係，很多論文做不到，這篇做到了。\n\n第二個聰明的地方，是它給機制取了名字。能力天花板、基礎設施能力錯配，這兩個詞是可以被後面的文獻引用的。在偏應用的期刊，這一點的價值比一個係數高得多。\n\n現在說最致命的缺口，而且這次的缺口跟第一則是同一種病。\n\n全篇最重的一句話是：基礎設施沒有形成統計上可支持的天花板。這是一個否定性的宣稱，說某個東西不存在。\n\n問題是，必要條件分析要支撐否定性宣稱，有嚴格的要求。你必須報告效果量，必須報告精確度，必須報告瓶頸表，還必須說明你用的是哪一種天花板線。而且最重要的，你必須說明在八十五個觀察值下，你能偵測到的最小效果量是多少。\n\n沒有這一段，「真的沒有天花板」跟「樣本不足以看見天花板」，這兩件事完全無法區分。\n\n更值得注意的是，在這篇被引用最多的參考文獻裡，看不到必要條件分析的創建者 Jan Dul 的方法論文。看得到的是模糊集質性比較分析那一系——Fiss、Ragin、Schneider 與 Wagemann，三位都在。也就是說，作者的方法家譜偏向質性比較分析那一邊，而必要條件分析那一邊的規範，可能沒有被完整執行。\n\n這就是我們昨天講過的原則的另一個版本：方法論的引用會洩漏你的研究設計。反過來說，方法論引用的缺席，也會洩漏你可能沒做的事。\n\n次要問題有四個。\n\n第一，兩年的時間落差是方便，不是設計。二零二二年的條件對二零二四年的產出，這個安排合理，但文中把它當成技術細節。它其實是一個理論主張——能力到發明的轉換需要兩年。既然是主張，就該有替代落差的檢定。\n\n第二，樣本經過三重篩選：上市、入選示範計畫、擔任東道主體。這個母體的能力分布必然偏高。所以「人力資本構成天花板」這個發現，可能只在能力已經很高的區間成立。可是實務建議卻是對所有製造企業說的。\n\n第三，反向因果沒有處理。人力資本高的公司發明多，還是發明多的公司吸引人力資本？條件取自二零二二、結果取自二零二四，確實提供了時序，但公司的人力資本在二零二二年之前，就已經被過去的發明績效影響過了。\n\n第四，也是中國情境特有的問題：發明專利跟實用新型的區分。中國的專利體系裡，實用新型的技術門檻低得多，而且受補貼驅動極強。如果結果變數沒有嚴格區分這兩者，那你測到的可能是政策績效，不是技術能力。\n\n那麼，如果要重現並且改進這項研究，該怎麼做？\n\n第一步，建對照組。除了示範計畫的東道主體，另外找一批沒有入選、但在規模、產業、地區、研發強度上可以配對的上市公司。用傾向分數配對或者粗化精確配對建成對。沒有這一組，你無法排除近零發明的組合其實是入選門檻造成的——示範計畫挑的，可能本來就是設備好但研發弱的公司。\n\n第二步，把結果變數拆成三個並且各報一次。發明專利件數、發明專利密集度、以及品質加權的發明產出。密集度的分母要明講，建議用員工數跟研發支出各跑一次，因為用研發支出當分母測到的是效率，用員工數測到的是人均產出，兩者在天花板的討論裡不可互換。另外把實用新型單獨跑一次當安慰劑檢定——如果自動化對實用新型的效果比對發明專利更強，那你測到的是補貼回應。\n\n第三步，把必要條件分析做完整。兩種天花板線都跑並比較；每個條件都報效果量跟它的顯著性；附上瓶頸表；做離群值敏感度分析，逐一剔除最上緣的個案，看必要性會不會消失。這一步特別重要，因為天花板線對離群值極度敏感，單一個案就可以改變整個必要性的結論。\n\n第四步，用政策批次做因果識別。國家智慧製造示範計畫是分批認定的，這個分批本身就是時間變異。用交錯採用的雙重差分估計入選的動態效果，並且檢查前趨勢。這不是要取代組態分析，而是要提供一個對照結果。如果兩種取徑指向同一結論，說服力會強得多。\n\n第五步，把時間落差當參數掃描。從零年掃到四年，每個落差重跑一次，畫出必要性效果量隨落差變化的曲線。如果結論只在兩年成立，那就是挑出來的。如果在一到三年都成立，兩年就是穩健的選擇。\n\n第六步，做校準敏感度跟矛盾組合檢查。模糊集質性比較分析的結論由校準決定，所以把三個校準錨點各上下移動一個標準差，重跑真值表，只報告在所有設定下都存活的組合。同時明確檢查有沒有矛盾組合，並且報告每一條組合背後有幾個個案。組態研究最常被抓到的錯，就是某條路徑只有兩三個個案，卻被寫成一種型態。\n\n第七步，主動去找反例。作者的機制主張是，設備沉重加上人力資本不足，等於近零發明。最有力的檢驗，是去找設備在前四分之一、人力資本在後四分之一、但發明產出仍然在前三分之一的公司。如果找不到，機制成立。如果找到幾家，就逐一做小型案例訪談，問它們靠什麼繞過天花板。這些反例會比任何一張組態表更有理論價值。\n\n【今日快訊】\n\n以下是本輪二十一篇中等摘要，依主題分群。\n\n先講醫療與研究政策這一群，有三篇。歐洲創新管理期刊有一篇義大利的行動研究，追蹤大學開發的病人回報資料平台如何被醫院接手，並長成兩個互補平台；質性為主體，雙重差分只是附掛的佐證。健康研究政策與體系期刊有兩篇：一篇是世界衛生組織全球知識轉譯研究議程的成果，從一百二十個研究領域收斂到十九個優先項，用的是證據綜整加德爾菲；另一篇提出證據光譜取向，把證據放在「默會到科學」跟「全球到在地」兩條軸上，最有價值的部分是它把二分法失敗的過程完整寫出來。\n\n接著是創新生態系與育成這一群，有兩篇。歐洲創新管理期刊那篇提出生態系媒合的前置評估工具，五個原則、十個國家、七十五個生態系，但只有兩位評分者。工程與技術管理期刊那篇特別值得做育成研究的人看：一千三百二十六家歐洲太空新創、負二項迴歸，結論是育成機構累積的機構經驗，比同梯次特徵更能預測就業成長。它示範了怎麼把育成機構本身的異質性變成可估計的變數，而不是把育成當成一個有沒有的二元處理。\n\n再來是自動化、機器人與經濟結構這一群，有兩篇。社會中的技術期刊那篇用三十二個 OECD 國家、十二年的平衡追蹤資料跟系統廣義動差估計，把外人直接投資拆成五個部門，最反直覺的發現是機器人拉動的服務業投資，量級上超過製造業。技術預測與社會變遷期刊那篇用系統動力學研究烏干達難民的現金援助，把「尊嚴」這個平常只能質性描述的面向做成量化指標。\n\n科學計量這一群，除了深度報導那篇之外，還有兩篇。科學計量學期刊有一篇用資料包絡分析算三十個國家十年的創新效率，提出「可持續創新效率」這個新概念，最刺眼的數字是整體創新效率一律低於零點二五，而中低所得國家的傳統效率反而最高。另一篇追蹤二十二個國家、兩千六百四十二位國際奧林匹亞參賽者的職涯，結論很乾淨：國際流動性看國家，主修選擇跟發表表現看學科。\n\n管理方法這一群，有四篇。工程與技術管理期刊那篇用偏最小平方結構方程加必要條件分析，兩百四十五份問卷，結論是外向開放式創新是創新績效較強的預測因子。同一本期刊另一篇把雙元學習拆成平衡跟綜效兩個維度，四百六十三家中國製造業上市公司，平衡是倒 U 型，綜效是單調正向，但知識存量會把綜效的好處吃掉。技術分析與策略管理期刊有兩篇：一篇用兩百四十七位土耳其跨國企業員工檢驗生成式人工智慧採用，最值得注意的是績效期望跟態度之間不顯著，這打斷了統一接受與使用理論的核心中介；另一篇比較法國一層制跟二層制董事會，一百零四家公司、九百五十三筆觀察，二層制的研發投資顯著較低，但治理結構本身是自選的。\n\n創新方法與工具這一群，有兩篇。Technovation 那篇用行動設計研究，三個案例、五輪迭代，長出二十八條設計原則——原則的數量本身就是它最大的效度問題。工程與技術管理期刊那篇用推特上的網絡指標衡量新創生態系的韌性，把開放性、多樣性、一致性、彈性四個系統性質操作化成網絡度量。\n\n政策與城市這一群，有兩篇。工程與技術管理期刊那篇研究聯合國教科文組織創意城市網絡的入選數，用三種計數模型並列估計，最有意思的悖論是創新領域的高制度品質，反而不必然對應更多入選。技術分析與策略管理期刊那篇研究新疆的數位農業，開場數字很有說服力：中國產業數位化占網路經濟八成以上，但數位農業滲透率只有百分之九點七。\n\n最後是數位人文與人工智慧實驗這一群，有三篇。數位人文期刊有兩篇：一篇提出「詮釋式計算」框架，在史密森尼學會與國會圖書館的民權運動口述歷史典藏上做原型，把後設資料跟介面設計當成詮釋行為；另一篇用一百九十二個荷蘭 LGBT 網站的超連結網絡，分析同志社群跟跨性別社群的關係，發現跨性別叢集內聚而且封閉。社會中的技術期刊那篇特別值得看設計：用大型語言模型生成四種風格的敘事，再做一個四百二十八人的控制實驗，結果是整合連結型敘事有效，而理論上應該有效的情節型敘事，反而抑制了情境覺察。\n\n【今日可教的一課】\n\n今天的原則只有一句話：當你說某個東西不存在的時候，你必須先證明你有能力看見它。\n\n支撐這句話的是第二則那篇。它用必要條件分析得出一個否定性的結論——基礎設施沒有形成統計上可支持的天花板。這是全文最重的一句話，也是整個貢獻宣稱的基礎。可是在八十五個觀察值下，它沒有報告效果量，沒有報告瓶頸表，也沒有說明它能偵測到的最小效果是多少。於是「真的沒有天花板」跟「樣本看不見天花板」，這兩件事在讀者眼裡完全一樣。\n\n對學生可以這樣說：肯定性的宣稱跟否定性的宣稱，證據責任不對稱。你說「我找到了 X」，只要你的證據夠強，別人就得接受。可是你說「X 不存在」，你必須額外證明一件事——如果 X 真的存在，你的設計看得見它嗎？這就是檢定力。沒有檢定力的否定性宣稱，不是發現，只是沒看到。\n\n同一個原則的另一個版本，在第一則裡也出現了。作者說學科偏差二十一年來沒有鬆動。這也是一個否定性宣稱。可是 Mann–Kendall 在二十一個時點上的檢定力有限，而且序列自相關會進一步扭曲它。所以「沒有趨勢」跟「檢定不出趨勢」，同樣需要被分開。\n\n這一則原則，建議補進論文寫作手冊的「批判與審稿」章節，跟先前那則「引了卻沒做，比沒引更糟」放在一起。它們處理的是同一類問題：作者的宣稱強度，超過了他的證據能承擔的重量。\n\n【今日總結】\n\n今天兩則深度報導的共同主題，是投入與產出之間那段被忽略的轉換過程。\n\n第一則說的是，把更多期刊收進資料庫，不等於南方國家更被看見——因為被收的可能都是小刊。第二則說的是，把更多設備裝進工廠，不等於發明會變多——因為轉換受能力限制。\n\n兩篇也共享同一個弱點：它們都做了否定性的宣稱，卻都沒有交代自己看得見多少。\n\n一句話收束今天：資源不是產能，通道才是。\n\n以上是每日學術新聞晚班。明天早上再會。\n"

     "gist": [
      "這篇要處理的是一個所有做文本計量的人每天都在迴避的問題:<b>主題模型的選擇本身就是一個未被檢驗的研究設計決策。</b>過去十五年,LDA 幾乎壟斷了科學計量學的主題辨識工作;近五年 BERTopic 與 Top2Vec 這類以語境嵌入為基礎的方法快速取代它,理由通常只有一句「嵌入比詞袋好」。作者群直接把這句話當成待檢驗的假設:如果換一個模型,主題會不會變、變多少、哪一種變化是使用者承擔得起的。",

   "podcast": "【每日學術新聞　二零二六年八月十二日　午班】\n\n各位好,這裡是每日學術新聞午班。\n\n今天這一節,我們從十九本期刊的近期論文裡挑出三則深入報導,另外還有二十篇新論文的快速摘要。\n\n三則深入報導的共同線索是「測量」。第一則問的是,你選的工具會不會改變你看到的結果。第二則問的是,把一篇論文拆成四段來看,會不會看見加總時看不見的東西。第三則問的是,一個所謂的新知識,到底是這個領域自己長出來的,還是從別的領域搬過來的。\n\n三篇都在講同一件事。我們以為自己在測量世界,其實常常只是在測量自己的工具。\n\n那我們開始。\n\n第一則。〈換一個主題模型,你看到的會是另一個語料〉\n\n這篇論文八月三日刊登在 Scientometrics 期刊。作者有四位,第一作者是法國洛林資訊研究實驗室的 Jean-Charles Lamirel,資深作者是加拿大魁北克大學蒙特婁分校的科學哲學家 Christophe Malaterre。\n\n先說背景。過去十五年,做文本分析的研究者要從一大堆文章裡找出主題,幾乎都用同一種方法,叫做潛在狄利克雷配置。它把每一篇文章看成幾個主題的混合,再把每個主題看成一群詞的分布。這是所謂的詞袋模型,它只看哪些詞出現、出現幾次,不看詞的順序,也不看上下文。\n\n最近五年情況變了。以語言模型的向量表示為基礎的新方法出現了,最有名的兩個叫做 BERTopic 和 Top2Vec。它們先把每篇文章變成一個高維度的向量,再對這些向量做分群。採用的速度非常快,理由通常只有一句話,就是向量比詞袋好。\n\n這篇論文把這句話當成待檢驗的假設。\n\n資料是一萬六千九百一十七篇科學哲學領域的研究論文全文。這個語料的選擇是刻意的。科學哲學的詞彙抽象、主題邊界模糊,沒有現成的權威分類可以拿來當標準答案。這是主題模型最容易露出破綻的地方。\n\n作者做了兩件事。\n\n第一件事是擴充他們自己開發的方法。這個方法原本結合了一種叫做增長型神經氣體的分群技術,加上一種叫做特徵極大化的詞彙篩選方式。他們做出三個新版本:一個加上重新分類的步驟,用來修補形狀不良的群;一個把語言模型的向量接進來;還有一個在向量上再做一次降維。\n\n第二件事,也是更重要的一件事,是建立一條統一的評估管線,把八種方法放在同一個語料、同一組指標上比較。八種方法包括潛在狄利克雷配置、非負矩陣分解、他們自己的三個版本、Top2Vec、BERTopic,還有一個分層版本的 BERTopic。\n\n評估的指標有五個。主題的一致性,就是一個主題裡的詞讀起來像不像一回事。主題的多樣性,就是不同主題之間的代表詞有沒有大量重複。召回率,就是有多少文章真的被分到某個實質主題,而不是被丟進雜訊堆裡。還有文件在各主題之間的分布形狀,以及主題的可解讀性。\n\n結果是沒有贏家。\n\nTop2Vec 的一致性和多樣性都很高,但召回率和可解讀性都低。換句話說,它把語料切得很漂亮,代價是丟掉了大量文章。BERTopic 的一致性略勝潛在狄利克雷配置,召回率卻沒有勝。文件分布最規則的是潛在狄利克雷配置,以及作者自己的兩個向量版本。可解讀性最高的是作者的向量版本和 BERTopic。整體最平衡的是作者的向量版本,但沒有任何一個模型全面壓過其他模型。\n\n作者在摘要的最後一句話,語氣很輕,但殺傷力最大。他們說,主題的內容和規模在不同方法之間差異相當大,每一種方法呈現的其實是這個語料的不同視角。\n\n第二則。〈把一篇論文拆成四段,跨領域性才開始說話〉\n\n這篇八月六日刊登在 Scientometrics 期刊,作者群來自南京工業大學與南京信息工程大學,第一作者是 Hongcheng Wei。\n\n背景是這樣。科學計量學二十年來一直在測量一件事,叫做跨領域性。做法是把一篇論文的參考文獻攤開,看它們分屬哪些學科,然後算三個東西:涉及幾個學科,分布平不平均,學科之間差異有多大。這三個成分再合成一個總分。\n\n問題是,一篇論文的引用不是均勻散布的。引言裡引的是問題背景,方法裡引的是工具來源,結果裡引的是比對的數據,討論裡引的是意義的延伸。把四節加總成一個數字,等於把訊號抹平了。\n\n這篇論文的動作很簡單,但沒有人做過。他們把引言、方法、結果、討論四節分開,各算一次跨領域性。\n\n研究對象是生物資訊學的論文。選這個領域有理由。生物資訊學本身就是生物學和計算科學的交界產物,跨領域的變異夠大,而且論文有清楚的四段結構,可以切。\n\n依變項有兩個,方向剛好相反。一個叫做事前新穎性,用語意相似度計算,在論文發表的當下就可以算出來。另一個叫做事後顛覆性,用一個叫做顛覆性指數的東西計算,要等好幾年,看後來的人怎麼引用它。如果後續文獻引了這篇卻不引它的參考文獻,表示它取代了既有脈絡,顛覆性就高。\n\n分析用的是梯度提升樹模型,再搭配一種叫做夏普利值解釋法的工具,把每一個特徵對預測結果的貢獻拆出來。\n\n結果有三塊。\n\n第一,模型對事前新穎性的分類表現,比對事後顛覆性好。作者的解讀是,顛覆性是落後指標,受到指數本身計算機制等外部因素的干擾。\n\n第二,也是最有意思的一點。事前新穎性主要和引言那一節的學科差異度有關,而且關係是倒 U 型的。也就是說,中等程度的差異度對應最高的新穎性。太集中不行,太發散也不行。\n\n第三,事後顛覆性最重要的特徵是學科的涉及廣度,但這個關聯隨著廣度上升而減弱。引言和結果兩節的均衡度較高時,論文比較可能被歸類為顛覆性的。\n\n作者的結論很節制。全篇用的是關聯,沒有一處寫因果。\n\n第三則。〈八成五的新知識,是從別的領域搬過來的〉\n\n這篇八月五日刊登在 Journal of Informetrics 期刊,作者是 Shan Huang、Jin Mao、Kun Lu 與 Gang Li。\n\n他們問的是一個過去被忽略的區分。當我們說一篇論文用了新知識,這個新知識到底是這個領域自己第一次產生的,還是從別的領域進口的?\n\n過去談新穎性,只問這個組合有沒有出現過,不問它第一次出現在哪裡。\n\n資料規模很大。他們用超過三千萬篇生物醫學論文當作背景語料,用自動辨識出來的生醫實體和實體組合當作知識的代理,再以阿茲海默症研究為實證個案,依照原始來源是不是這個焦點領域,把新知識分成原生的和進口的兩類。\n\n三個發現。\n\n第一,進口佔絕對多數。百分之八十五點八二的新穎實體,以及百分之五十五點八四的新穎組合,都是從其他領域來的。\n\n第二,不論來源為何,新穎實體的比例越高,論文的影響力反而越低。而新穎組合的比例和影響力之間呈倒 U 型關係,但知識的來源會改變這個關係的強度。\n\n第三,原生的知識和領域內部的影響力關聯較強;進口的知識和領域外部的影響力關聯較強。\n\n【專家回應　第一則　〈換一個主題模型,你看到的會是另一個語料〉】\n\n這篇論文最聰明的地方,是把召回率放進主題模型的評估表。\n\n我解釋一下為什麼這一招重要。以向量為基礎的主題模型,底層用的是一種密度分群法。這種方法有一個設計特性:密度不足的地方,它不強行分群,而是把那些文章標記成雜訊。在異常偵測裡這是優點。在主題模型裡這是陷阱。\n\n因為被標記成雜訊的文章,通常就被靜靜地丟掉了。留下來的都是好切的文章。於是一致性這個指標自然就高。這不是模型比較厲害,這是題目比較簡單。\n\n作者用召回率把這個代價顯性化。一句話就把整個向量優越論打回原形。這裡有一個可以直接學走的原則:當一個指標容易被作弊,就去找出它作弊時必然付出的代價,然後把那個代價也做成指標。\n\n那麼最致命的缺口在哪裡?\n\n在被引用最多的參考文獻裡,有一篇是動態主題模型,那是專門為了追蹤主題隨時間漂移而設計的方法。可是這篇論文的分析完全沒有時間維度。\n\n科學哲學這個語料橫跨數十年。主題的漂移本身就是最有價值的訊號。引用了動態主題模型卻只做靜態切片,等於把審稿人最想問的問題,自己寫在參考文獻清單裡。\n\n還有第二個引了卻沒做。參考文獻裡有兩篇談大型語言模型風險的重要論文,可是這場八方比較裡,沒有任何一個大型語言模型參賽。二零二六年做主題模型的基準比較而完全不納入語言模型,這在時間上已經站不住腳。\n\n次要的問題有三個。\n\n一,可解讀性怎麼測的,摘要沒說。是誰判讀、幾個人判讀、判讀者之間一致嗎?如果是作者自評,那麼作者自家的方法在可解讀性上勝出,就構成評估者的利益衝突。這不是誠信問題,這是設計問題。自家方法參賽又當裁判,必須用盲測隔開。\n\n二,隨機性沒有交代。潛在狄利克雷配置對隨機種子敏感。BERTopic 對降維和分群的兩個參數極度敏感。如果八個模型只各跑一次,那麼所有的名次差異,都可能落在單一模型自己的變異範圍之內。\n\n三,只用了一個語料。要下「詞袋模型仍然有效」這種普遍結論,一個語料不夠。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,不要只用一個語料。取三個難度不同的:一個像本篇這樣詞彙抽象的人文語料,一個中等難度的社會科學摘要集,還有一個有外部標準答案的語料,比方說有人工主題標註的生醫文獻。第三個最關鍵,因為它讓你可以算真正的外部效度,而不只是內部一致性。\n\n第二步,把隨機性當成主要的變異來源,而不是干擾。每個模型至少跑十個隨機種子,對兩個關鍵參數做網格搜尋。輸出的不是一個數字,是一個分布。報告的是箱型圖,不是長條圖。如果兩個模型的中位數差異落在同一個模型自己的四分位距之內,那就直說這兩個模型無法區分。這一句話,比任何名次都有價值。\n\n第三步,可解讀性一定要用人來測,而且要盲測。做法是這樣:每個主題取前五個高權重詞,再從別的主題隨機插入一個詞,請標註者指出哪一個是入侵者。答對率就是可解讀性。每個模型抽三十個主題,每個主題三位標註者,標註者不能知道主題來自哪個模型,也不能是作者本人。八個模型乘三十個主題乘三個人,九百次判斷,一天做得完。這一步可以把全篇最脆弱的一格,補成最強的一格。\n\n第四步,把召回率再往下拆一層,問被丟掉的是誰。用文章長度、詞彙豐富度、參考文獻數量、是否跨領域,去預測一篇文章會不會被歸為雜訊。如果短文章和跨領域的文章被系統性地丟掉,那麼所有用這類模型做的跨領域研究,都存在選擇偏誤。這個發現本身就是一篇獨立的論文。\n\n第五步,補上時間維度,把「引了卻沒做」變成你自己的貢獻。把語料按五年切片,每一片各跑八個模型,再追蹤主題的誕生、分裂、合併與消失。核心問題變成:不同模型看到的主題演化,是不是同一個故事?如果一個模型說某個主題在二零一零年分裂,另一個模型說它二零一四年才出現,那麼所有用主題模型做趨勢偵測的研究,都需要重新審視。\n\n第六步,把大型語言模型加進來當第九個選手。用一個開放權重的模型做兩件事:直接生成主題標籤,以及當可解讀性的評審,再和人工標註對齊。如果語言模型在可解讀性上大勝,卻在成本和可重製性上大敗,那麼「詞袋仍然有效」這個結論反而得到更強的支撐。兩種結果都值得寫。不做才是問題。\n\n【專家回應　第二則　〈把一篇論文拆成四段,跨領域性才開始說話〉】\n\n這篇最聰明的地方,是把分析單位切到節。\n\n這是一個成本極低、回報極高的動作。資料還是原來那些全文和引用,但問題從「這篇有多跨領域」變成「這篇在哪裡跨領域」。引言的跨領域是視野,方法的跨領域是工具借用,結果的跨領域是證據整合,討論的跨領域是意義延伸。四者的理論意涵完全不同。把它們加總掉,是這個領域二十年來的集體浪費。\n\n這一招可以直接搬到任何以參考文獻為基礎的指標上。自我引用、國際合作、期刊聲望,全都可以問一句:在哪一節?\n\n那麼最致命的缺口在哪裡?\n\n在被引用最多的參考文獻裡,有一篇二零一九年的 Nature 論文,標題是大團隊發展、小團隊顛覆。那篇用同一個顛覆性指數,在六千五百萬筆資料上證明了團隊規模與顛覆性呈系統性的負相關。\n\n這篇論文引了它。可是摘要裡看不到任何團隊層次的控制變項。\n\n這就是最嚴重的那種缺口。既然顛覆性指數已知會隨團隊規模系統性變化,而且你自己引了那篇證明它的論文,那麼不控制團隊規模,你排出來的特徵重要性,就無法排除一個很簡單的替代解釋:分節的跨領域性,只是作者人數的代理。因為作者多的論文,學科來源本來就多。\n\n還有第二個缺口。參考文獻裡有兩篇談工作群體多樣性與團隊創新的經典,同樣指向團隊變項,同樣沒有進入模型。\n\n次要問題有三個。\n\n一,倒 U 型的發現是全篇最有價值的實質結果,但它也最容易被質疑成模型的假象。樹模型的解釋曲線在資料稀疏的區間,本來就容易呈現非單調的形狀。要讓倒 U 站得住,得證明兩端的樣本量足夠,用二次項迴歸也能重現,而且通過專門的 U 型檢定。\n\n二,論文說這對創新的早期偵測有用。可是偵測是預測任務,需要時間外的樣本驗證。用早期資料訓練,預測後期論文。摘要裡看起來是同期的交叉驗證,那只能說明關聯存在,不能支撐偵測的宣稱。\n\n三,外部效度的邊界比論文說的窄兩層。第一層是領域:生物資訊學天生跨領域,結論不能外推到純學科。第二層是資料:分節引用需要全文,而全文可得的多半是開放取用的論文,開放取用又和經費、國別、期刊聲望相關。這是一個典型的選樣偏誤,而且方向可能和依變項相關。資源充足的團隊,既更可能開放取用,也更可能做出高顛覆性的工作。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,把選樣偏誤攤開。抓一份有全文的清單,再抓一份同期同刊但沒有全文的清單,比較兩者在被引數、團隊規模、國別上的分布,把它寫成表一。任何用開放取用全文做的研究,都應該先交代這件事。\n\n第二步,把跨領域性算兩遍。第一遍照本篇的做法,用參考文獻的學科分類算。第二遍改用文本,用每一節的內容向量去對照學科的語意中心。兩遍的相關係數本身就是一個發現。如果只有零點三,那麼跨領域性這個構念,在引用和文本兩種測量下根本不是同一件事。\n\n第三步,依變項也要算兩遍。新穎性除了語意相似度,補上以期刊配對為基礎的經典指標。顛覆性除了原本的指數,補上兩個變體和一個純被引分位數。四個依變項各跑一次,把結論寫成一張穩健性矩陣。\n\n第四步,先把作者人數和參考文獻總數放進控制集,重跑一次。看特徵重要性的排序有沒有改變。如果排序崩塌,那就是最大的漏洞被證實了。這一步的成本極低,診斷價值極高,應該當成第一件事做。\n\n第五步,如果要往因果走,得找一個外生的衝擊。可以考慮兩種。一種是某個資料庫在特定年份開放,使得某類跨領域組合突然變便宜,用政策評估的雙重差分法比較受影響與未受影響的研究群。另一種是期刊格式改版,例如某些期刊某年開始限制引言長度,這會外生地改變引言的引用行為。兩者都不完美,但比什麼都不做強,而且審稿人會看見你意識到了問題。\n\n第六步,做一個反例。如果分節的跨領域性真的反映知識整合,那麼在一個天生不跨領域的學科裡,倒 U 型應該消失或變平。跑一次純學科的對照組。如果那裡也出現一模一樣的倒 U,那你抓到的可能不是知識整合,而是某種普遍的寫作慣例,或是指標本身的機械性質。反例做得好,論文的說服力會跳一級。\n\n【專家回應　第三則　〈八成五的新知識,是從別的領域搬過來的〉】\n\n這篇最聰明的地方,是把新穎性的內部異質性攤開。\n\n過去大家算新穎性,得到一個數字,然後拿去跑迴歸。這篇問了一個更前面的問題:這個新東西是誰家的?一旦分成原生和進口兩類,原本混在一起的關係就分岔了。原生的知識連到領域內部的影響力,進口的知識連到領域外部的影響力。這個對照非常乾淨。\n\n還有一個容易被忽略的觀察。新穎實體的比例越高,影響力越低;新穎組合的比例則是倒 U 型。這其實和二零一三年那篇經典的結論一致:最高影響力的論文,是以傳統為主體,再加上少量非典型的組合。這篇只是換了一個資料層級,重新得到了同一個結構。跨資料層級的重現,價值不比新發現低。\n\n那麼最致命的缺口在哪裡?\n\n實體辨識的品質。整篇研究建立在自動辨識出來的生醫實體上。自動辨識會產生假陽性,也就是把不是實體的東西認成實體。而假陽性最高的地方,恰恰是罕見的字串。\n\n問題就在這裡。罕見等於新穎。也就是說,辨識誤差和依變項是同方向相關的。你以為你測到的是新穎知識,有一部分其實是辨識錯誤。這不是小瑕疵,這是效度的地基問題。\n\n次要問題有兩個。\n\n一,只做了阿茲海默症一個焦點領域。八成五這個數字,在一個高度依賴外部技術輸入的疾病領域裡,可能天生就偏高。要說「進口佔多數」是普遍現象,至少要三到五個對照領域。\n\n二,原生與進口的判定依賴「第一次出現在哪個領域」,而這個判定又依賴領域邊界的劃定。領域邊界怎麼畫,結論就跟著變。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,先做辨識品質的稽核。抽一千個被判定為新穎的實體,人工檢查有多少是真的實體、多少是辨識錯誤。把假陽性率報出來,並且分別報告常見與罕見實體的假陽性率。這一步不做,後面全部懸空。\n\n第二步,把焦點領域從一個換成五個。挑選時刻意涵蓋不同的技術依賴程度,例如阿茲海默症、心血管、精神醫學、傳染病、腫瘤。看八成五這個比例的變異範圍。\n\n第三步,把領域邊界的劃法換三種。用期刊分類、用主題分類、用引用社群偵測,各算一次原生與進口的比例。如果三種畫法給出的結論一致,那才叫穩健。\n\n第四步,把時間差放進來。一個實體從別的領域進口到這個領域,中間經過幾年?這個延遲本身就是一個有價值的變項,而且可以用來檢驗知識擴散的速度是否在加快。\n\n第五步,加一個反例檢驗。如果進口知識真的連到外部影響力,那麼在一個非常封閉的領域裡,這個關聯應該消失。找一個引用高度內向的領域做對照。\n\n【今日快訊】\n\n除了三則深入報導,今天另有二十篇論文的中等摘要,我依主題分四群唸過。\n\n第一群是科學計量與研究評鑑。Scientometrics 有一篇分析兩萬多名作者與六萬多名被致謝者的性別差異,發現女性更常被致謝而非列名,但控制學術地位之後,高被引的女性反而比高被引的男性更可能成為共同作者,顯示地位動力學比性別本身更關鍵。同一本期刊還有一篇提出引用功能的排序框架,把「為什麼引這一篇」從單標籤分類改寫成成對比較,在計算語言學的標準資料集上,前三名準確率達到百分之八十六點六七。另有一篇用大型語言模型產生弱監督標籤,再微調小模型來預測審稿的分項評分。還有一篇追蹤秘魯、哥倫比亞、委內瑞拉二十三年的科學流動,主張這三個國家適用的是人才流失與人才獲得,不是主流論述裡的人才循環。以及一篇用韓國六萬三千多個國家研發計畫、五百九十三個行動者建構的研發能力網絡,發現大學與企業之間存在能力組成的錯配。最後是一篇用專利結構資料、專利文本與企業財務三種模態聯合學習,直接預測技術貨幣估值的研究,平均絕對百分比誤差約兩成四。\n\n第二群是創新與研發的財務面。Research Policy 有一篇處理熊彼得的老矛盾:理論說創新反景氣循環,資料說順景氣循環。作者用資金成本的門檻率解釋,並用州級研發稅額抵減的錯期變動做因果識別,發現高風險溢酬期間專利數量下降但技術影響力上升。Journal of Product Innovation Management 有一篇比較金融危機期間創立的科技新創與承平期的配對對照組,核准專利少了約四成七,突破性發明卻多了兩倍一二。同一本期刊另有一篇後設分析,綜合七十一項研究、一千零八十九個效果量,發現新產品發表的平均累積異常報酬是零點七個百分點,而外部產生的公告比企業自行發布的高出二點六個百分點。Technovation 則有一篇用九百一十九家企業、一千七百九十四次分割、四十一萬多件專利,論證企業分割平均傷害技術績效,除非它剛好切掉了知識的複雜性。\n\n第三群是人工智慧與組織。Technovation 有一篇用計算模擬比較三種訓練策略,發現把專家回饋遞迴餵回訓練循環的模型可以跨情境移植,把人與訓練脫鉤的模型會提早收斂在狹窄的解空間。同一本期刊另有一篇分析文化創意產業一百二十六個職業、五百九十三項任務,用生成式模型做合成標註,把創意拆成編碼化、內隱、新創三種規則,並指出內隱知識是人工智慧自主性的邊界。還有一篇用荷蘭一家顧問公司的完整社會網絡,發現居中者只有在自認對他人有權力時,結構優勢才會轉成創新。Technological Forecasting and Social Change 則有一篇系統性回顧加概念框架,主張協作式前瞻的成效取決於群體同質與異質的刻意配置,並批評文獻長期把多樣性當成單一構念。\n\n第四群是政策、企業與健康治理。European Journal of Innovation Management 有一篇用寬頻與智慧製造兩項政策的疊加做準自然實驗,發現政策協同優於單一政策,而且先寬頻後智慧製造的順序更有效。同一本期刊另有一篇用三百零四份問卷,發現主管的完美主義透過挑戰性評估提升員工創新、又透過阻礙性評估壓抑它。Technology Analysis and Strategic Management 有一篇用中國上市公司十四年的面板,發現數位轉型同時提升綠色創新的數量與品質,技術驅動型強於應用驅動型。Technovation 有一篇用三家中國整合型國有企業的多案例歸納,拆解正當性與自主性之間的張力。最後是 Health Research Policy and Systems 的一篇質性基線調查,在英格蘭西南部的索美塞特郡訪問了四十六位地方政府員工與十八位社福組織成員,發現兩個部門都說研究重要,但多數人把研究等同於資料蒐集,而不是嚴謹的研究設計。\n\n【今日可教的一課】\n\n今天的原則是這一句:同一批資料,換一個主題模型,主題的內容與規模會大幅改變。所以任何以主題模型當作前處理步驟的後續宣稱,都必須附上「換一個模型也成立」的穩健性檢查。\n\n支撐這句話的具體事實,就是第一則那篇論文。四位作者在同一批一萬六千九百一十七篇科學哲學論文上跑了八個模型,得到的結論是沒有任何一個模型全面勝出,而且不同模型產生的主題內容與規模差異相當大。\n\n這句話可以怎麼對學生說?\n\n你可以這樣講:主題模型不是望遠鏡,它是濾鏡。望遠鏡讓你看得更遠,濾鏡讓你看見特定波長的東西。你換一片濾鏡,天空的顏色就變了。天空沒變,是你的儀器變了。所以當你在論文裡寫「我們用某某模型辨識出五個主題」,你其實是在說「在這一片濾鏡底下,我們看見五個主題」。那麼負責任的做法就只有一個:再換一片濾鏡看一次,然後告訴讀者,換了之後你還看得見同樣的東西嗎。\n\n具體到操作,最省力的做法是在附錄放一張表:同一批文本,兩個模型,主題數與每個主題的前十個詞並排,再加一句話說明主要結論在兩種設定下是否一致。這張表的成本大約半天,擋掉的可能是一整輪的大修。\n\n還有一則附帶的原則,來自第二則那篇論文:用一個已知有機械性偏誤的指標當依變項,而你自己又引了指出那個偏誤的論文,卻沒有在分析中處理它,審稿人的第一份意見就會從那裡開始。引了卻沒做,永遠比沒引更糟。\n\n【今日總結】\n\n今天三篇的共同主題是:我們以為在測量對象,其實常常在測量工具。\n\n第一篇說,換一個主題模型,語料就換了一張臉。第二篇說,把論文拆成四段,跨領域性才開始說話,但如果不控制團隊規模,你說的可能是別人的話。第三篇說,所謂的新知識有八成五是從別的地方搬來的,而搬運的痕跡,決定了它會在哪裡發揮影響。\n\n三篇合起來給的是同一個提醒:在報告任何以工具產生的數字之前,先換一次工具,看看數字還在不在。\n\n以上就是今天午班的每日學術新聞。感謝收聽,我們晚上再會。"

   "podcast": "【每日學術新聞　二零二六年八月十一日　午班】\n\n午安,這裡是每日學術新聞午班節目。我們追蹤科學計量學與創新管理領域的十九本核心期刊,為您整理最新論文。今天的節目有三則主要新聞,一段涵蓋二十多篇新論文的今日快訊,以及一分鐘的可教的一課。今天的三則主題剛好圍繞著同一件事,就是學術出版體系本身。誰在造假,誰先被引用,誰又在沉睡多年之後才被喚醒。我們開始。\n\n第一則。一萬篇論文工廠撤稿的全景地圖。\n\nScientometrics 於七月二十四日刊出一篇開放取用的研究,題目是追蹤被撤稿的論文工廠文章。作者是香港教育大學的 Michelle Cheng 與 Yang Xinhua,以及紐約市立大學研究生中心的 Ryan Allen。所謂論文工廠,指的是有組織地代寫、偽造並且販售論文掛名的商業運作。這個灰色產業過去幾年一直是研究誠信領域最燙手的題目,但大家對它的規模認知,多半來自零星的個案研究與媒體報導。這篇研究做的事情很直接。用 Retraction Watch 撤稿資料庫,把所有因為論文工廠被撤稿的文章一次撈出來,做成第一張全景式的計量地圖。\n\n數字相當驚人。從資料庫建立以來到二零二四年,共辨識出一萬零四百零九篇被撤稿的論文工廠論文,其中二零二三年出現爆炸性的尖峰。文章類型以研究論文為大宗,但值得注意的是,連會議摘要與會議論文也被查出經過論文工廠,並且在二零二二年出現高峰。會議管道的誠信治理一向比期刊鬆散,這個角落過去很少被報告。\n\n地理分布的集中度更是頭條等級。論文工廠論文遍布全球,但來自中國的有九千一百三十七篇,佔全部的百分之八十七點八,遠遠拋開其他國家。研究也從這批論文中辨識出超過九萬七千組跨國的共同作者配對,暗示這不是單一國家的封閉現象,而是有跨境的掛名交易網絡。學科分布上,商業與科技、商業與生命科學、健康科學最多,涵蓋電腦科學與癌症研究這些關鍵領域。\n\n最有故事性的發現在時間切片的關鍵詞分析。二零一一到二零一六年,論文工廠論文的高頻關鍵詞以生物醫學為主,像是細胞與癌症。到了二零二一到二零二四年,重心整個翻轉到電腦科學。作者的詮釋是,這個產業跟著需求與查緝壓力轉移了陣地。\n\n第二則。掛過預印本的論文,第一次被引用快了兩個多月。\n\n同樣來自 Scientometrics,七月二十四日刊出的一篇研究問了一個乾淨的問題。掛過預印本的期刊論文,是否更快獲得第一次引用。這篇的設計是它最大的本錢。作者建立了一個配對樣本,把有預印本與沒有預印本的文章,控制在同一本期刊、同一年、同一卷、甚至同一期裡面比較,讓兩組文章在出版脈絡上盡可能可比。然後用存活分析估計首次引用的時間優勢,再用迴歸換算成天數。\n\n結果的數字很明確。有預印本的文章,獲得第一次引用的風險比高出百分之三十五點二。白話說就是,在任何一個時間點上,它拿到第一次引用的機會高出三分之一以上。在觀察期內至少被引用一次的文章當中,有預印本的文章,首次引用時間平均短了大約六十九天,也就是快了兩個多月。作者把機制歸給兩件事,早期能見度,以及預印本平台提供的額外傳播通道。\n\n第三則。哲學經典的集體睡美人效應。\n\n還是 Scientometrics,七月二十四日的一篇研究,把科學計量學的睡美人概念搬進了哲學史。所謂睡美人,指的是一篇著作出版後沉寂多年,才突然被大量引用。過去這個概念多半用在科學論文上。這篇研究收集了一六零零年到一九五三年之間出版的哲學經典書籍的引用資料,檢視引用的時間間隔分布,發現了一個雙峰結構。也就是說,引用不是平滑地衰減,而是有兩個高峰。作者引入半衰期的概念,把這個雙峰分布分解成兩個單峰分布的疊加。一個對應即時的認可,另一個對應延遲多年的甦醒。因為這個延遲不是個別著作的特例,而是哲學經典作為一個群體的結構性模式,作者把它命名為集體睡美人效應。黑格爾說過,哲學就是哲學史。這篇研究等於用計量方法給這句話補了一個註腳。延遲認可,在哲學裡不是例外,是常態。\n\n【專家回應　第一則　論文工廠全景地圖】\n\n先說最聰明的地方。這篇選對了資料庫,而且誠實地做了全量處理。Retraction Watch 是這個題目唯一夠格的公開資料源,一萬多篇的全量分析,加上時間、類型、國別、關鍵詞四個切面,讓它成為後續所有論文工廠研究繞不開的描述基準。會議摘要的尖峰,更是前人沒有報告過的角落。\n\n但是最致命的缺口,就藏在這些漂亮數字的背後。撤稿資料庫記錄的,是被抓到而且被處理的論文。所以這篇研究量到的,是查緝,不是生產。二零二三年的撤稿尖峰,更可能反映的是出版商的集中清理行動,譬如那兩年知名出版集團的特刊大掃除,而不是論文工廠那一年的產量暴增。同樣的道理,中國佔百分之八十七點八這個數字,沒有除以各國的論文產出基數,也沒有處理查緝資源集中打擊特定地區的注意力偏誤。這個數字是真實的,但它的意義被壓扁了。佔比說的是絕對量,只有換算成率,才能說傾向。\n\n再來是一個典型的引了卻沒做。這篇引用了柏林自由大學 Anna Abalkina 的研究。她對俄羅斯論文工廠的分析,示範了從出版與合作的異常模式去偵測還沒被抓到的工廠論文。本篇既然辨識出九萬七千組共同作者配對,順理成章的下一步就是把配對建成網絡,分析重複結構與掛名輪換。結果研究停在配對的計數。等於把最有價值的資料切面,只拿來當一個大數字。\n\n次要的問題還有兩個。生醫轉向電腦科學的關鍵詞位移,可以是工廠轉移陣地,也可以只是電腦科學的問題論文最近才被大規模清理,描述性分析無法在兩個解釋之間裁決。還有,資料庫的論文工廠標記是誰打的,依什麼準則,信度如何,全文的地基其實是別人打的。\n\n那麼,如果要重現並且改進這項研究,該怎麼做。第一步,從 Crossref 下載開放的 Retraction Watch 全量資料,鎖定論文工廠標記,記下快照日期,跟原文的一萬零四百零九篇對帳,建立可公開重製的底表。第二步,做分母正規化。用 OpenAlex 抓每個國家每年每個學科的總產出,把佔比換算成每萬篇產出的工廠撤稿率,這一步會直接改變全文最搶眼數字的意義。第三步,把查緝強度從限制變成變數。蒐集出版商大規模清理事件的時間表,做事件研究,檢驗撤稿尖峰是不是集中在清理窗口前後。第四步,把九萬七千組配對建成加權網絡,跑社群偵測與異常評分,對照 Abalkina 的異常特徵清單,檢驗工廠論文的網絡簽名能不能與正常合作區分開來。這是從描述升級為偵測工具的關鍵一步。第五步,做撤稿時滯的存活分析,看哪類工廠論文活得最久,活在哪裡。最後一步,抽兩百筆標記做雙人獨立重判,報告編碼者間一致性。誠信研究的可信度,尤其依賴自己的透明。\n\n【專家回應　第二則　預印本與首次引用】\n\n這篇的聰明處在配對設計。同期刊同卷同期的配對,把期刊聲望、出版時間、領域熱度這些最粗的混淆一次控制掉,比多數同題研究乾淨得多。存活分析配上天數換算,效果量的表達也照顧到了不同讀者。\n\n但它控制不了最關鍵的那個混淆,就是誰選擇掛預印本。願意把稿子提早公開的作者,往往也更積極地自我推銷,更會經營學術社群媒體,更快回覆同行的詢問。預印本的效果,跟作者行為的效果,在這個設計裡依然纏在一起。另外,首引時間短了六十九天這個數字,是在至少被引用一次的子樣本上算的,這個條件本身就會帶進選擇偏誤。\n\n如果要改進,第一步是找工具變數或政策衝擊,譬如某些期刊或資助機構在特定時點改變預印本政策,用政策前後的變化來識別因果。第二步,把作者的歷史行為特徵放進模型,譬如過去的預印本使用率與社群活躍度,至少把自我選擇的方向估出來。第三步,把至少被引一次的條件拿掉,改用考慮設限資料的模型直接處理沒被引用的文章。做完這三步,這篇的兩個數字才能從相關升級為因果。\n\n【專家回應　第三則　集體睡美人效應】\n\n概念上這是一次漂亮的升級。睡美人研究過去停在單篇著作的異例,這篇把它變成一個文類層級的集體分布現象,用雙峰分布與半衰期分解給了它可操作的數學形式。對人文計量來說,這是方法論的實質延伸。\n\n最大的疑問在資料。一六零零年到一九五三年的書籍引用,是從哪個來源建構的。早期文獻的引用行為與現代期刊完全不同,涵蓋偏誤可能很大。摘要對此語焉不詳,進全文第一件事就是查資料建構那一節。第二個疑問是,雙峰結構有沒有可能是資料來源拼接的人造物。譬如引用索引對不同年代文獻的覆蓋率不同,就可能製造出假的第二峰。\n\n改進的路線,第一步是用至少兩個獨立的引用來源交叉驗證雙峰結構,譬如把不同資料庫的引用分開畫,看第二峰是否穩定出現。第二步,對每一本書做敏感度分析,排除單一超級暢銷書拉動整體分布的可能。第三步,把哲學與另一個人文學科對照,譬如歷史學或文學理論,檢驗集體睡美人是哲學獨有,還是人文文類的共同結構。若是後者,理論意涵會完全不同。\n\n【今日快訊】\n\n接下來用幾分鐘,快速報告本輪其他二十多篇新論文,依主題分群。\n\n先看人工智慧與企業這一群。Technology in Society 有一篇用兩萬六千七百一十六個公司年觀測值的研究發現,生成式人工智慧讓中國上市公司的專利變多、變快、變便宜,但語意新穎度與影響力沒有跟上,量增而質平。同刊另一篇用經濟合作暨發展組織七國一千八百三十一名員工的調查顯示,員工對人工智慧治理可信度的感知,與工作經驗和三種滿意度都正向相關。還有一篇三波問卷追蹤三百一十六名員工,發現與人工智慧協作的經驗能養出轉型的自我效能,但倫理焦慮會在路上打折。Technology Analysis and Strategic Management 的一篇歐盟研究則發現,公部門採用人工智慧跟著錢走,採用區塊鏈跟著制度走,兩種技術的擴散邏輯根本不同。\n\n第二群是平台與生態系。Technological Forecasting and Social Change 一篇紮根理論研究提出模糊分層與模糊雙向評估兩個治理機制,回答平台如何同時標準化又回應互補者的異質需求。European Journal of Innovation Management 有一篇概念文章,給創新生態系提出新的過程性定義,把它理解為朝共享價值主張運作的組織化過程。Technovation 一篇比利時研究訪談二十五家中小企業,發現經理人把政策生態系當自助餐,選擇性地取用,而不是政策想像中的忠誠會員。\n\n第三群是循環經濟,這輪特別熱鬧。Journal of Manufacturing Technology Management 一篇設計科學研究把再利用邏輯寫進產品組態系統。Technology in Society 兩篇,一篇用人工智慧平台幫工業共生找配對,一篇用混合模擬算出價值鏈資訊透明化能讓再製造量增加百分之五。\n\n第四群是性別與科學社會學。Technovation 一篇用一百零一個國家七萬一千八百八十八個新創的資料發現,控制關鍵條件後,女性從事創新創業的傾向與男性無異,金融市場成熟度是關鍵調節。Scientometrics 一篇由研究中心傳播部門自己做的研究顯示,新聞稿與論文的線上關注度相關。同刊另一篇用二模網絡加文本分群,把義大利統計與管理兩個學門共著網絡裡的每一位作者歸入主題社群。\n\n最後一群比較雜。Journal of Responsible Innovation 一篇用共被引與關鍵詞共現給負責任創新領域做了結構性體檢,發現原則到方法的落差。另一篇檢視中國的生命健康資料治理。Digital Scholarship in the Humanities 一篇顯示專用小工具在韻腳辨識上勝過大型語言模型,另一篇把非洲的技術擬人化理解為關係性存有論而不是認知偏誤。Health Research Policy and Systems 一篇示範怎麼系統性評選組織脈絡的測量工具。Technology in Society 還有虛擬主播說服力的三個實驗,手勢只幫到男性主播形象。以上是今日快訊。\n\n【今日可教的一課】\n\n今天的原則是,用撤稿資料研究不端,量到的是查緝,不是生產。支撐它的事實來自第一則新聞。論文工廠撤稿有百分之八十七點八集中在中國,尖峰出現在二零二三年。這兩個頭條數字,都可能主要反映出版商清理行動與查緝注意力的分布,而不是論文工廠產量的分布。對學生可以這樣說。你觀察到的案例分布,是行為分布乘上偵測分布的結果。警察多的路口抓到的違規多,不代表那個路口的人特別不守規矩。所以拿到任何一個依查緝產生的資料庫,第一個問題永遠是,偵測機制長什麼樣子,它偏向誰。把偵測偏誤當成核心發現去正面處理,而不是限制段落裡的一句話,你的描述統計才有資格變成結論。\n\n【今日總結】\n\n今天三則新聞其實是同一個故事的三面。學術出版體系如何分配注意力。論文工廠偷注意力,預印本提早爭取注意力,哲學經典等待注意力。而三篇研究共同的方法課題,都是資料的生成機制。撤稿庫量到查緝,配對樣本躲不開自我選擇,古籍引用受制於資料來源的覆蓋。資料從哪裡來,結論就到哪裡為止。午班到這裡,晚上八點晚班再會。"

   "podcast": "【每日學術新聞　二零二六年八月九日　晚班】\n\n各位聽眾晚安。這裡是每日學術新聞晚班節目。我們每天追蹤十五本科學計量學與創新管理領域的期刊,從最新出版的論文裡挑出三則,先報導內容,再請專家分析。今天的三則,全部是昨天、也就是八月八日剛剛上線的新論文,一則也不是舊聞。兩則來自 Scientometrics,一則來自 Technological Forecasting and Social Change。\n\n第一則。〈參考文獻的重複,正在悄悄壓低所有人的引用指標〉。\n\n這篇論文八月八日發表在 Scientometrics 期刊,標題翻譯過來是:一套用於書目計量分析的多階段參考文獻比對演算法,包含設計、實作與評估。作者是義大利拿坡里費德里克二世大學的 Massimo Aria、Luca D'Aniello 與 Maria Spano。\n\n他們處理的問題,是整個書目計量學最底層、卻最少被檢查的假設。我們計算一個學者的 h 指數、計算一本期刊的影響力,前提都是資料庫裡同一筆被引用的文獻只出現一次。但實情不是這樣。同一篇被引用的論文,可能因為期刊縮寫的寫法不同、作者姓名格式不同、標點不同、後設資料的完整程度不同,而在資料庫裡分裂成好幾個不同的紀錄。引用連結因此斷開,指標被系統性地壓低。\n\n作者提出的解法,是一條不需要訓練資料的多階段比對管線,總共七個階段。第一階段是格式偵測與字串正規化,把各種引用格式解析開來,統一姓名、標題與頁碼的寫法。第二階段是期刊名稱正規化,把縮寫名與全名都對應到同一個標準短名,依據的是國際標準組織第四號標準的期刊標題字詞縮寫表。第三階段是精確比對,先用數位物件識別碼,再用正規化後的字串。第四階段叫做封鎖,用第一作者的姓氏加上出版年份,把海量的紀錄先分成小組,只在組內做昂貴的兩兩比較。第五階段是區塊內的模糊比對,用一種特別適合人名的字串相似度指標,搭配由下而上的階層分群,把近似重複的紀錄聚成一群。第六階段把同一群紀錄裡互補的欄位合併起來。第七階段選出資訊量最大的那一筆,作為這一群的代表。\n\n評估分成兩層。第一層是合成基準:研究者自己造出一千零六十四篇來源文獻,施加十七種受控的擾動情境,因為正確答案是自己設定的,所以精確率、召回率與 F1 分數都可以精確計算。結果是,十七種情境裡有十五種,三項指標都在零點九五以上;表現最差的兩種情境,F1 分數也還有零點七八以上。\n\n第二層是真實資料。他們用兩組來自 Scopus 資料庫的實際資料驗證,合併變體之後,唯一被引用文獻的數量下降了百分之四點六到百分之十一點一,而以集中度為基礎的書目計量指標則同步上升。換句話說,資料清理不是中性的動作,它會改變你算出來的集中度結論。\n\n作者群的定位很清楚。這條管線已經內建在一個被廣泛採用的開源統計軟體套件裡。摘要沒有點名是哪一個,但通訊作者本人就是知名書目計量套件 bibliometrix 的作者,而這篇論文被引用次數第二高的參考文獻,正是 bibliometrix 的原始論文。這篇論文引用了三十筆參考文獻。\n\n第二則。〈在哥倫比亞,搬家的研究者沒有升得比較快〉。\n\n這篇同樣在八月八日發表於 Scientometrics。標題是一句問句:我該留下,還是該離開?副標題列出了國內地理流動、性別、年齡、機構研究輪廓與勞動市場,如何影響哥倫比亞科學人力的職涯表現。作者有四位:哥倫比亞伊巴格大學的 Jesús María Godoy Bejarano、義大利 Mercatorum 大學的 Giovanni Abramo、羅馬第二大學的 Ciriaco Andrea D'Angelo,以及哥倫比亞羅薩里奧大學的 Julián David Cortés-Sánchez,最後這位是通訊作者。\n\n這篇的問題意識,建立在一個文獻空白上。學術流動一直是科學政策的核心議題,但過去的研究幾乎都在談國際流動或跨國移民,對中等所得國家內部的流動幾乎沒有著墨。而國內流動的成本結構、制度誘因,和國際流動完全不同。\n\n資料來自哥倫比亞科學技術創新部的公開行政資料,涵蓋二零一三年到二零二一年之間的六次評鑑徵集,總共四萬零四百八十五筆研究者與評鑑的觀察值。被解釋的變數是研究者的等級,分成初級、副級與資深三個層次;主要的解釋變數是一個城際搬遷的二元指標,再加上一組落後一期的個人、制度與脈絡共變量。\n\n模型是有序邏輯迴歸。這裡有一個值得注意的技術轉折:作者檢定了比例勝算假設,結果被拒絕,因此他們改採不受限的設定,允許同一個變數在不同門檻上有不同的效果。這一步的實質意義是,從初級升到副級,和從副級升到資深,是兩個不一樣的機制,不能用同一組係數描述。\n\n發現分成三層。第一,城際流動非常罕見,只影響了百分之二點七的觀察值,而且集中在職涯早期的研究者。第二,流動並沒有加速晉升;相反地,它和等級的不穩定相關,對初級與副級研究者尤其明顯。第三,機構層面學術資本的集中程度,是晉升的強力相關項,這和累積優勢的預期一致。\n\n最後還有一個方向性的轉折:等級不穩定主要出現在搬往較小城市的情形;搬往較大都市中心的研究者,沒有出現可以相比的懲罰。這篇論文引用了三十五筆參考文獻。\n\n第三則。〈把數位專案說成威脅還是機會,效果要看聽的人想得多遠〉。\n\n這篇八月八日發表在 Technological Forecasting and Social Change,標題是:塑造對數位創新專案的承諾,威脅與機會框架和解釋水準的交互作用。作者有四位:Julian Bauer、任教於法國格勒諾布爾管理學院的 Fiona Schweitzer、Tobias Röth,以及任職於奧地利科技研究院與格拉茲大學的 Karl-Heinz Leitner。\n\n這裡必須先做一個說明。這篇論文目前在 OpenAlex 資料庫裡沒有摘要,而且不是開放取用。因此接下來的內容,是根據標題、作者群、以及一百一十七筆參考文獻的結構所做的推論,不是論文自己說的話。樣本數、操作方式與統計結果,我們一概不知道,也不會在這裡編造。\n\n能確定的是問題意識:數位創新專案的承諾,如何被塑造?以及,把專案講成威脅、還是講成機會,這兩種說法的效果,會不會被聽的人的心理距離所改變?\n\n這個提問有很實在的痛點。數位創新專案的特徵是回報遙遠、不確定性高、需要跨部門的資源承諾。因此管理者會不會持續投入,往往取決於他們怎麼詮釋這個專案,而不是專案的客觀參數。而把它說成不做就會被淘汰,或者說成做了能開創新局,是組織裡最常見、也最廉價的干預手段。\n\n從參考文獻可以看到兩個理論引擎。第一個是框架效應與威脅僵化。Tversky 與 Kahneman 一九八一年的經典研究說明,把同一個問題描述成獲得或損失,會反轉人的風險偏好。而 Staw、Sandelands 與 Dutton 同樣在一九八一年提出的威脅僵化效應則指出,組織面臨威脅時會出現資訊處理的收縮與控制的集中,對創新是負面的。請注意,這兩個理論的預測方向是相反的。\n\n第二個引擎是解釋水準理論。Trope 與 Liberman 指出,心理距離愈遠,人們愈用抽象的方式思考,關注的是為什麼、以及這件事值不值得做;距離愈近,愈用具體的方式思考,關注的是怎麼做、以及做不做得到。\n\n把這兩個引擎放在一起,可以推論本文的核心命題是一個交互作用:同一個框架,在不同的解釋水準下,會產生不同程度的承諾。這篇論文引用了一百一十七筆參考文獻,數量相當可觀。\n\n【專家回應　第一則　〈參考文獻比對演算法〉】\n\n這篇論文最聰明的地方,是把一個看不見的偏誤變成了一個可以測量的量。資料很髒,這句話人人會說,但幾乎沒有人給得出誤差率。作者用受控擾動自己造出正確答案,於是可以說出十五個情境 F1 超過零點九五這樣的話。這一步的價值不在演算法本身,而在於他建立了一個靶場,別人可以拿這個靶場來打自己的方法。方法論論文取得長期引用,靠的往往就是這件事。\n\n但最致命的缺口,在於引用了卻沒有做。在被引用最多的參考文獻裡,有兩篇跨資料庫的比較研究:一篇比較了 Google Scholar、Scopus 與 Web of Science,另一篇是萊頓大學團隊橫跨五個資料源的大規模比較。引用這兩篇,等於承認不同資料庫的引用格式問題不一樣。既然如此,最自然的推論就是,這套演算法在不同資料庫上的表現會不同。可是真實資料的驗證,只有兩組 Scopus 資料集。跨資料庫的外部效度,就是宣稱和證據之間最明顯的落差。\n\n還有第二個引用了卻沒做的地方。參考文獻裡有一九六九年那篇記錄連結的理論奠基之作,那個框架的精髓在於,每一個配對都會得到一個機率,你可以據此推導誤差率的上界,還可以留下一個交給人工判斷的灰色地帶。但本文的管線是決定論式的,只有相似度門檻和分群,沒有機率,也沒有待判區。結果就是,下游的使用者無法回答一個很自然的問題:你算出來的這個 h 指數,不確定範圍有多寬?\n\n次要的問題有三個。第一,百分之四點六到百分之十一點一的合併率,沒有真值可以校準,我們不知道這些合併裡有多少是誤合。第二,合併之後集中度指標上升,這在數學上幾乎是必然的,把分散的引用歸併到同一個節點,集中度本來就會上升,所以這不算發現。第三,論文沒有報告門檻與分群連結準則的敏感度分析,而這兩個參數對結果的影響,往往比相似度指標的選擇還大。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,換戰場。同樣一批論文,分別從 Crossref 與 OpenAlex 取得參考文獻清單,跑同一條管線,比較合併率的差異。如果三個來源的合併率差距明顯,原文的外部效度宣稱就必須收斂。\n\n第二步,把合併正不正確變成可以標註的量。從真實資料的合併結果裡,依相似度分成五層,每層抽一百組,由兩位標註者獨立判斷是不是真的同一筆文獻,然後計算標註者之間的一致性係數,以及每一層的假陽性率。這一步是全篇最大的缺口,補上它,說服力會完全不同。\n\n第三步,做一個機率式的對照組。既然引用了記錄連結的理論,就真的實作一個機率式連結器,輸出每個配對的後驗機率,和現在的決定論式管線正面比較。如果決定論式的做法在準確度上不輸、速度又快很多,那才是站得住腳的貢獻。\n\n第四步,處理集中度上升的方向性問題。對同一批資料做三種處理:正確合併、隨機合併但合併次數相同、以及完全不合併,然後比較三者的集中度指標。如果正確合併和隨機合併的位移沒有差別,那就說明位移來自合併的次數,而不是合併的品質。這個替代解釋原文沒有排除。\n\n第五步,對三個維度做網格掃描:相似度門檻、分群的連結準則、封鎖的鍵值。輸出一張熱圖,標示原文的設定落在哪裡。如果最佳區域很窄,實用性要打折;如果很寬,那反而是強而有力的辯護。\n\n第六步,也是價值最高的一步:量測清理對科學地圖的下游效應。取一個既有的共被引分析,分別在清理前後建立網路,比較兩次分群的一致性。如果一致性明顯偏低,那就等於證明了未經清理的科學地圖是不可靠的。這個宣稱,比集中度指標上升強得多。\n\n【專家回應　第二則　〈哥倫比亞研究者的國內流動〉】\n\n這篇最聰明的地方是選址。它一次換掉了三個邊界條件:從國際換成國內、從高所得國家換成中等所得國家、從菁英樣本換成全體註冊研究者。而且用的是全國性的行政資料,不是抽樣調查。四萬多筆觀察值加上六個時點,在拉丁美洲的科學計量研究裡是罕見的規模。\n\n技術上最值得稱讚的,是檢定了比例勝算假設,發現被拒絕之後,誠實地改用不受限的設定。多數作者會忽略這個檢定結果,照樣報一組漂亮的係數。承認門檻異質,代價是係數數量倍增、解釋變得吃力,但這是誠實的代價。\n\n然而最致命的缺口,同樣是引用了卻沒有做。參考文獻裡有兩篇網路科學的經典,是關於科學合作網路結構的。引用它們,通常意味著作者心裡想的機制是:搬家會切斷合作關係,合作網路的斷裂才是懲罰的來源。可是摘要裡看不到任何網路變數。於是流動造成不穩定,這個結論的機制仍然是個黑盒子:究竟是合作斷裂?是資源損失?還是評鑑規則對新進成員不利?這三種解釋在目前的設計下無法區分。\n\n更根本的問題是因果識別。流動率只有百分之二點七,處理組非常小,而且高度自我選擇。有序邏輯迴歸加上落後共變量,無法排除一個非常自然的反向解釋:會搬家的人,本來就處在職涯不穩定的狀態,例如合約到期、沒有續聘,搬家是結果而不是原因。作者的措辭很謹慎,一直用相關、關聯這類字眼,但讀者和政策制定者不會那麼謹慎。\n\n次要的問題有三個。第一,不穩定這個結果變數混合了降級、退出、暫停三種完全不同的事件,應該用競爭風險或多狀態模型分開處理。第二,既然引用了城市尺度律,城市規模就不該只用較大或較小的二分法,而應該當成連續變數,甚至用相對於規模預期的殘差來衡量地方科研生態的強度。第三,標題承諾了性別、年齡、機構輪廓與勞動市場四組因素,但摘要的發現裡幾乎只剩下流動與機構集中度,標題與交付之間有落差。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,把重複的橫斷面接成研究者層級的面板。以個人為單位建立長格式資料,標記每個人的進入、退出、等級軌跡與機構軌跡,並且明確記錄誰在哪一輪消失了。沒有這一步,後面的固定效果與事件研究都做不了。\n\n第二步,把流動從一個二元指標拆成多個維度:移動的距離、目的地城市規模的對數、以及機構研究性質的改變。同時要盡量區分主動流動與被動流動,例如用合約到期、機構降級、機構關閉作為代理。\n\n第三步,改用能吸收個人異質性的模型。首選是個體固定效果,把不隨時間改變的能力與雄心吸收掉。如果等級變動太少導致識別力不足,就退而求其次做事件研究:以搬家那一年為零點,估計前後各三期的等級變化,檢查搬家之前的趨勢是不是平的。搬家前的趨勢,就是反向因果最直接的檢驗。\n\n第四步,做配對,再找外生衝擊。先用傾向分數或粗化精確配對,在搬家前的產出軌跡、年齡、性別、機構性質上把流動者與非流動者配起來。再去找機構關閉、系所裁撤這類被迫遷移的事件當作準實驗。兩層結果一致,關聯才能升級成效果。\n\n第五步,做四組穩健性檢定:排除首都波哥大之後重估;依職涯階段分層;依學科大類分層;把結果變數換成論文數與被引分位數。如果搬往小城市有懲罰這個結論,在排除波哥大之後就消失了,那真正的發現是首都的集聚優勢,整篇的框架必須改寫。\n\n第六步,主動去找流動有利的次群體。理論上應該存在:從教學型機構搬到研究密集機構的人、搬家同時伴隨升遷聘任的人。如果找到了,整篇的敘事就從流動沒用,變成流動的報酬取決於目的地的資源密度。後者理論上更有力。\n\n第七步,把合著網路變數接進來。計算搬家前後兩年的合作者留存率、新合作者數量、以及網路中心性的變化,當作中介變數放進模型。如果中介效果顯著,不穩定就有了機制解釋,而不只是一個統計關聯。\n\n【專家回應　第三則　〈威脅框架、機會框架與解釋水準〉】\n\n再次提醒,這一則的分析是建立在參考文獻結構上的推論,不是論文的自述。\n\n這篇最聰明的地方,是找到了兩個成熟理論的矛盾點。框架理論預測,損失框架會提高風險承擔;威脅僵化理論預測,威脅會降低探索與創新。兩個預測方向相反,長期並存,卻很少有人正面處理。用解釋水準當作調節變數去調和它們,這是一個結構完整的理論貢獻設計:不是加一個新變數,而是解釋一個既有的矛盾。這種設計在創新管理與組織行為的期刊都吃得開。\n\n但最致命的缺口,在於結果變數與操弄效度。承諾這個詞可以指意圖,可以指資源配置,也可以指面對壞消息時的持續投入。如果測的是自陳的意圖,那它離真實的資源決策非常遠。而解釋水準的操弄在管理情境裡特別脆弱:心理學常用的操弄是時間距離,可是把下週改成明年,同時改變了折現、不確定性與可歸責性,也就是說,一次動到了三個構念。沒有操弄檢核,交互作用的解釋權就會被質疑。\n\n還有一個引用了卻沒有做的地方,而且相當關鍵。這篇的結果變數是承諾,可是在被引用最多的參考文獻裡,只看到 Staw 的威脅僵化那一篇,看不到他更著名的承諾升級研究。承諾升級講的是,決策者會對已經失敗的路線持續加碼,原因是自我辯護與沉沒成本。在創新專案的脈絡裡,承諾究竟是美德還是病理,這是繞不開的問題。同樣看不到的,是真實選項與階段性投資的文獻,而那正是實務上處理遠期不確定專案的主流框架。\n\n次要的問題有兩個。第一,一百一十七筆參考文獻對一篇實驗導向的論文而言偏多,通常意味著理論鋪陳很長,風險是導論承諾了太多構念,而實證只檢驗其中一小塊。第二,交互作用的偵測需要的樣本量,遠大於主效果,如果沒有事前的效力分析,顯著的交互作用很可能是偽陽性。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,先取得正文。這篇不是開放取用,而且資料庫裡沒有摘要。在看到樣本、操弄與測量之前,不應該把任何關於它的敘述當成事實。如果作者已經做了操弄檢核與預先註冊,以下的多數建議就從修正變成延伸。\n\n第二步,把承諾從態度改成行為。設計一個資源配置任務,給受試者固定的虛擬預算和幾個可投入的專案階段,測量他配置給這個數位專案的金額,以及在收到中期壞消息之後的追加或撤資金額。金額是連續的、可比較的,而且和真實決策同構,遠優於七點量表上的意圖題。\n\n第三步,做一個二乘二乘二的預先註冊實驗。框架分成威脅與機會,解釋水準分成高與低,再加上第三個因子:回饋是正向還是負向。第三個因子的作用,是把承諾升級納進來。只有加入負面回饋,才能區分承諾是初始熱情,還是升級病理。\n\n第四步,做嚴格的操弄檢核。解釋水準操弄之後,立刻測抽象程度;框架操弄之後,測感知的得失方向與情緒喚起。關鍵是要證明:框架沒有改變抽象程度,解釋水準沒有改變感知風險。如果兩個操弄互相污染,交互作用就無法歸因於理論機制。另外要加一組中性框架當基線,才能判斷效果是威脅推動的,還是機會推動的。\n\n第五步,處理效力與樣本。事前做效力分析決定樣本量,交互作用假設下每一格至少要一百五十人,而且要在論文裡報告計算過程。同時跑學生樣本與具有預算決策權的管理者樣本,把外部效度直接變成一個實證問題,而不是限制節裡的一句道歉。\n\n第六步,主動設計會讓預測反轉的條件。例如高度時間壓力、公開承諾、以及更換決策者。如果威脅框架的效果在更換決策者之後消失了,那機制就是自我辯護,而不是風險偏好。這會實質改寫理論貢獻。\n\n第七步,把單次承諾改成三期的序列決策,每一期揭露一部分不確定性,受試者可以加碼、維持或撤資。分析的重點就從水準值移到軌跡的形狀。這樣可以同時回答兩個問題:框架影響的是起始的承諾,還是後續的調整速度?解釋水準影響的是值不值得做的判斷,還是對壞消息的反應?\n\n【今日總結】\n\n今天三則新聞,表面上一則談演算法、一則談職涯、一則談心理框架,但它們共享同一個主題:<b>我們用來下判斷的那個東西,本身有多可靠?</b>\n\n第一則說,你算出來的引用指標,取決於資料清理的品質,而清理從來不是中性的。第二則說,你觀察到的流動與晉升的關聯,取決於你有沒有處理選擇效應,而處理與否會改變政策結論。第三則說,管理者對專案的承諾,取決於這件事被怎麼講,而怎麼講是可以被操弄的。\n\n三篇論文各自都有一個引用了卻沒做的缺口:第一篇引了跨資料庫比較,卻只在單一資料庫驗證;第二篇引了合作網路,卻沒有測量網路;第三篇引了承諾的組織理論,卻可能只測了態度。這不是偶然。<b>參考文獻是作者對自己的承諾,而審稿最有效的一招,就是檢查這些承諾有沒有被兌現。</b>\n\n今天的每日學術新聞晚班就到這裡。明天早上,我們再會。"

   "podcast": "【每日學術新聞　二零二六年八月九日　午班】\n\n歡迎收聽每日學術新聞午班。今天為您帶來三則研究報導,以及三段專家回應。其中兩篇是前天才上線的新論文,分屬三本不同期刊。\n\n【第一則　自動化、組織創新,與薪資的互補效果】\n\n第一則來自《技術預測與社會變遷》,上線日期是八月七日。作者是愛沙尼亞塔爾圖大學的普斯托瓦洛娃與瓦赫特。\n\n這裡要先聲明一件事。開放學術資料庫尚未提供這篇的摘要,所以以下的說明是依據標題、主題分類、作者機構,以及三十八筆參考文獻的結構推斷,不代表原文的陳述。\n\n研究問題是:自動化與組織創新這兩件事同時發生時,對員工薪資的影響是相加的,還是互補的?而社會技能在其中扮演什麼角色?\n\n從參考文獻可以清楚看出理論骨架。米爾格羅姆與羅伯茨一九九五年談製造業中策略、結構與組織變革互補性的那篇,是互補性這個概念的正統來源。它的核心主張是:兩種做法同時採用的效果,大於各自單獨採用的加總。\n\n自動化那一端,錨在艾塞默魯與雷斯特雷波二零一九年的〈自動化與新任務〉,以及他們二零二一年的〈人口結構與自動化〉。社會技能那一端,錨在戴明二零一七年的〈勞動市場中社會技能日益重要〉。\n\n三塊拼在一起,推測的假設是:自動化本身可能壓低某些薪資,但當它與組織創新互補、而且員工具備社會技能時,效果會翻轉。\n\n作者群來自愛沙尼亞。這一點很關鍵。愛沙尼亞有完整的雇主與受僱者連結行政資料,是歐洲少數能把個人層級薪資與企業層級創新變數對接的國家之一。\n\n【第二則　競合組合的組態,以及大學與供應商的配對條件】\n\n第二則來自《Technovation》,日期是八月五日。作者群橫跨阿姆斯特丹自由大學、蒙彼利埃商學院與馬斯垂克大學。\n\n問題意識很具體。企業會同時與多種夥伴結盟,包括競爭對手。這種包含競爭者的聯盟組合,稱為競合組合。競爭者能提供互補又相容的資源,但也可能與其他夥伴產生衝突。那麼,在哪些夥伴類型的組合下,產品創新才會發生?\n\n資料是九百二十一家荷蘭企業,期間從二零一零年到二零一六年。方法採用明確集質性比較分析。\n\n第一個發現:與競爭者結盟,必須搭配與客戶的聯盟,才會促成產品創新。單獨的競合關係不夠,需要客戶端提供需求資訊來引導。\n\n第二個發現更有意思,是一個組態條件。當組合中存在與大學的連結時,供應商也必須同時在場,新產品才會被推出。換句話說,大學提供的知識,需要供應商的製造能力才能落地。\n\n第三個發現是邊界條件:導向產品創新的競合組態,會隨焦點企業的規模與產業動態而變化。\n\n【第三則　把評審權交給社群的衛教素材共同評估】\n\n第三則來自《健康研究政策與體系》,同樣是八月七日上線,開放取用。研究場域在坦尚尼亞。\n\n這篇切在一個少被處理的縫隙。公眾參與健康傳播設計的重要性已被廣泛承認,但關於社群,特別是身心障礙者,如何在低資源環境中主動擔任評審與驗證創意衛教素材的角色,所知甚少。\n\n做法是舉辦全國性競賽,邀請在地藝術家製作短篇動畫與語音廣播劇,用來傳達關鍵的眼睛健康訊息。創作端直接交給在地。\n\n評審環節是核心。十四位評審與十七位工作坊參與者,依十項準則評估投稿作品,之後對前三名進行驗證,檢視訊息的包容性、可理解性與有效性。\n\n結果分兩層。素材層面,建議包括加上字幕、手語與更清楚的視覺呈現;參與者也建議作品應更貼近坦尚尼亞的生活現實。過程層面,參與式的評審營造了包容感與擁有感,評審表示感到有自信、被重視、且自在。\n\n六位作者中有四位來自坦尚尼亞,包含三位在地非政府組織的實務工作者。\n\n【專家回應　第一則　互補性的檢定標準】\n\n先講這篇最值得注意的地方,而它藏在方法論的引用裡。\n\n這篇同時引用了三篇東西:粗化精確配對的原始文獻、它的統計軟體實作,以及金恩與尼爾森二零一九年那篇〈為什麼傾向分數不該用於配對〉。\n\n這個組合不是隨手引用,是立場宣示。作者刻意拒絕了傾向分數配對,選擇粗化精確配對。這是一個有立場的方法選擇,不是預設值。\n\n那個爭論你應該知道。金恩他們證明,當傾向分數配對持續刪除觀測值以求平衡時,超過某一點之後,再刪反而會增加不平衡。原因是傾向分數把多維共變數壓縮成一維,丟失了維度資訊。這被稱為傾向分數悖論。\n\n但選擇粗化精確配對也有代價。粗化的切點是研究者選的,而且維度一多就會有大量樣本失去配對而被丟棄。既然作者刻意選了這條路,審稿人一定會要求看粗化方案的敏感度分析。\n\n第二個問題更根本。互補性的檢定標準,比一般的交互作用嚴格得多。\n\n超模性的正式檢定要求的不只是交互項顯著,而是要在整個變數空間上滿足遞增差異的條件。管理學論文常把交互項為正直接說成互補,這是常見的過度延伸。而這篇引了米爾格羅姆與羅伯茨,就會被用那個標準檢視。\n\n還有一個技術問題,是跨層級設計的群集結構。薪資是個人層級的結果,但自動化與組織創新是企業層級的處理。同一企業內的員工誤差項必然相關。忽略這一點,標準誤會被低估、顯著性會被高估。這是跨層級研究最常見、也最容易被抓的缺陷。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,先把互補性的檢定標準講清楚,再談結果。在方法章節明確說明你檢定的是哪一種:是回歸中的交互項為正,還是超模性的遞增差異條件,或是績效函數的二階交叉偏導。若只能做第一種,就用交互效果而不是互補性的措辭。\n\n第二步,把粗化方案做成敏感度分析。對每個連續共變數設定粗、中、細三種方案,交叉組合後重跑主要模型,把係數的分佈畫成一張圖,同時報告每種方案下的不平衡度量與樣本損失比例。\n\n第三步,社會技能改用任務基礎的指標。戴明用的是職業任務資料,不是自陳問卷。若愛沙尼亞的職業編碼可以對映到國際標準職業分類,這個轉換的成本並不高,而好處是能與英美文獻直接比較。\n\n第四步,處理群集結構。最低標準是企業層級的群集穩健標準誤;若企業數少於五十,改用 wild cluster bootstrap;更好的做法是多層次模型。\n\n第五步,找一個外生衝擊來強化識別。粗化精確配對處理的是可觀測的選擇偏誤,但自動化採用本身是策略選擇,受未觀測的管理品質影響。可用的變異包括機器人價格的國際變動,或用雷斯特雷波式的暴露測度——產業自動化率乘以企業初始產業結構——構造工具變數。\n\n第六步,把三向交互的檢定力誠實報告出來。自動化乘以組織創新乘以社會技能,若真的做到三階交互,樣本需求會非常大,結果通常也不穩定。事前做檢定力模擬,若不足就誠實改用分組比較,並說明這是描述性的。\n\n【專家回應　第二則　為什麼是明確集】\n\n這篇最有價值的發現,不是主效果,而是那個組態條件:有大學連結時,供應商也必須在場。\n\n這個發現說明了知識來源與實現能力必須配對。比起「多元合作有益」這種已知結論,它具體、反直覺,而且有明確的實務含意。這正是組態方法應該產出的東西。\n\n但全文最需要辯護的方法決定,是選擇明確集而不是模糊集。\n\n明確集把「有沒有這類夥伴」二元化,丟掉了強度資訊。與競爭者有一個聯盟,和有十個聯盟,在明確集裡是同一件事。而這篇引了菲斯的模糊集研究,卻選了明確集,就必須說明為什麼。是因為調查資料本來就是二元的?還是因為校準錨點難以建立?這個理由不寫清楚,審稿人會直接問。\n\n第二個問題是研究者自由度。質性比較分析的一致性門檻設零點八還是零點七五,會直接改變哪些組態被保留。組態研究若沒有報告門檻的敏感度分析,穩健性就無法評估。\n\n第三個問題是時間結構被壓平了。資料涵蓋七年,但這個方法本質上是橫斷的組態比較。聯盟組合會隨時間演化,而產品創新有滯後性。把七年壓成單一觀測,就無法區分「這個組態導致創新」與「創新成功的企業後來建立了這個組態」。\n\n這也連到反向因果的問題。有創新能力的企業,更容易吸引到大學與競爭者作為夥伴。\n\n那麼要怎麼重做?\n\n第一,改用模糊集,或正面辯護明確集的選擇。若原始調查有合作強度或夥伴數量,就用它們建立隸屬分數,並報告三個校準錨點的理論依據。若真的只有二元題項,就用一段說明校準所需的資訊不存在。兩種都可以,沒說明才是問題。\n\n第二,把一致性門檻與邏輯餘項處理做成敏感度矩陣。橫軸放三種一致性門檻,縱軸放保守解、中間解、簡約解三種餘項策略,九個格子各報告一次結果。穩定出現的組態才是可以主張的發現。\n\n第三,分析結果的缺席,不只分析結果的存在。依因果非對稱性原則,另外跑一次沒有產品創新的組態分析。這一半經常更有實務價值。而且若缺席分析剛好是存在分析的反面,那反而暗示關係其實是對稱的,用這個方法的正當性就要重新檢討。\n\n第四,把七年的時間結構用起來。用前期的聯盟組態預測後期的產品創新,建立時間上的先後,至少排除最明顯的反向因果。\n\n第五,正面處理反向因果。最低成本的做法是限制樣本為觀察期初尚無該類聯盟的企業,看新建立的組態是否預測後續創新。\n\n第六,報告有限多樣性的實際嚴重程度。明確列出條件數、邏輯組合總數、實際觀察到的組合數,以及每個保留組態的案例數。若某個組態只由三、五家企業支撐,就必須明說。\n\n第七,補一次跨國複製。荷蘭社群創新調查的姊妹資料在歐洲多國都有,變數定義高度一致。用德國或比利時的資料重跑,檢驗那個大學加供應商的組態是否穩定。\n\n【專家回應　第三則　參與的深度怎麼檢驗】\n\n這篇最有價值的,是把評審權真正交了出去,而不只是諮詢。\n\n多數宣稱做了公眾參與的研究,實際上只做到徵詢意見。這篇讓社群依十項準則評分並決定名次,是參與階梯上明顯更高的位置。這個設計差異值得被看見。\n\n但有幾個地方會被抓。\n\n第一,樣本規模讓有效性的宣稱撐不住。十四位評審與十七位工作坊參與者,足以支撐過程層面的質性發現,不足以支撐訊息有效性的評估。摘要同時提到理解度與有效性,而後者需要的是受眾端的前後測,不是評審端的判斷。\n\n第二,評審的選取方式決定了包容性宣稱的份量,而摘要沒有交代。十四位評審是怎麼招募的?身心障礙類別如何分布?若是透過既有的非政府組織網絡招募,就會有選擇偏誤——最邊緣的群體,通常也最不容易被既有網絡觸及。\n\n第三,過程性成果偏向自陳,而且有明顯的社會期許壓力。參與者說感到自信、被重視、自在,但這些是在研究團隊在場的情境下說出來的。參與式研究特別容易受到這種壓力,因為關係本身就是介入的一部分。\n\n第四,也是最核心的一問:共同生產的宣稱,應該用權力來檢驗,而不是用感受。真正的問題是——社群的評分是否曾經推翻研究團隊的偏好?若十項準則是團隊訂的、最終決策權仍在團隊手上,那參與的深度就有限。\n\n那麼要怎麼重做?\n\n第一步,把有效性的宣稱與證據對齊。兩條路:限縮措辭,把有效性改成可接受度,這不需要新資料;或補上受眾端的前後測,測量眼睛健康知識、就醫意圖或實際篩檢率的變化。建議先做第一條,把第二條寫成明確的後續研究設計。\n\n第二步,完整報告評審的選取過程,並評估代表性。招募管道、障礙類別分布、性別、城鄉分布,以及有多少人來自既有網絡。再比較評審群的組成與坦尚尼亞視障人口的已知分布,若有系統性落差,誠實報告。\n\n第三步,加入獨立的匿名回饋管道。委託與研究團隊無關的第三方,在活動結束兩到四週後訪談,並刻意詢問負面經驗——哪些環節讓你覺得意見沒被聽見。若這類資料與現場回饋一致,說服力會強得多;若不一致,那個落差本身就是重要發現。\n\n第四步,用權力轉移來檢驗共同生產。設計可驗證的指標:十項準則中有幾項是社群提出的?社群評分是否曾推翻團隊的偏好排序?最終決策權在誰手上?用明克勒的參與階梯自我定位,即使答案是合作而非社群主導,誠實定位也比籠統宣稱更有說服力。\n\n第五步,依 GRIPP2 逐項報告,特別是「參與如何改變了研究」那一項。若答案只是素材加了字幕,那參與就在諮詢層;若參與改變了研究問題或評估標準,那才是共同生產。這一項的答案,決定了論文的貢獻高度。\n\n第六步,把可轉移性從宣稱變成分析。明確列出這個模式運作所需的條件:是否需要既有的在地非政府組織網絡?依賴什麼識字率或媒體近用水準?藝術家社群的規模?把這些寫成一張必要前提對照表,讀者才能判斷自己的情境是否適用。\n\n【今日總結】\n\n今天這三篇,共同的主題是「宣稱要與證據對齊」。\n\n第一篇引了互補性的正統文獻,就得用互補性的檢定標準,而不是交互項顯著就好。第二篇選了明確集,就得說明為什麼丟掉強度資訊是合理的。第三篇說了有效性,但手上的證據只支撐可接受度。\n\n三個落差,三種修法,而且沒有一種需要新的資料——全部都是措辭與設計選擇的問題。\n\n以上是今天午班的每日學術新聞,晚上再會。"
