<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="每日學術新聞 — 科學計量學與創新管理期刊追蹤">
<meta name="theme-color" content="#b8541c">
<meta name="robots" content="noindex, nofollow">

<title>每日學術新聞 · OpenAlex</title>
<style>
:root{ color-scheme: light;
  --bg:#ffffff; --panel:#f7f7f5; --line:#e6e4df; --ink:#1f1e1c; --muted:#6f6c66;
  --accent:#b8541c; --accent-soft:#fdf1e8; --green:#2f6f4f; --green-soft:#eaf3ee;
  --blue:#2c4f7c; --blue-soft:#eef2f8; --plum:#6b3a63; --plum-soft:#f5eef4;
  --teal:#1f5f5b; --teal-soft:#eaf3f2; --gold:#8a6412; --gold-soft:#fbf5e6;
  --rose:#9b3b52; --rose-soft:#fbeef1; --slate:#33455c; --slate-soft:#f0f3f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.68 -apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.stat b{display:block;font-size:21px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 20px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=search]{flex:1;min-width:170px;padding:7px 11px;border:1px solid var(--line);
  border-radius:8px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}

.runhead{display:flex;align-items:baseline;gap:9px;margin:28px 0 12px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.runhead h2{font-size:15px;margin:0;font-weight:650}
.runhead .when{font-size:12px;color:var(--muted)}

.card{border:1px solid var(--line);border-radius:12px;padding:17px 19px;margin-bottom:14px;background:#fff}
.card.fresh{border-color:#e8c3a6;background:linear-gradient(180deg,var(--accent-soft),#fff 70px)}
.meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel);
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.j{background:#eef1f6;border-color:#dde2eb;color:#3c4a63;font-weight:600}
.tag.new{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tag.oa{background:var(--green-soft);border-color:#cfe2d6;color:var(--green)}
.card h3{font-size:16px;margin:0 0 7px;line-height:1.44;font-weight:640}
.card h3 a{color:inherit;text-decoration:none;border-bottom:1px solid #d9d6d0}
.card h3 a:hover{border-color:var(--accent);color:var(--accent)}
.au{font-size:12.5px;color:var(--muted);margin-bottom:12px}

.sec{margin-top:14px}
.sec > h4{font-size:12px;margin:0 0 6px;letter-spacing:.06em;font-weight:700;
  text-transform:uppercase;display:flex;align-items:center;gap:7px}
.sec > h4::after{content:"";flex:1;height:1px;background:var(--line)}
.sec p{margin:0 0 8px;font-size:14px}
.sec p:last-child{margin-bottom:0}
.sec.gist > h4{color:var(--ink)}
.sec.design > h4{color:var(--blue)}
.sec.design .box{background:var(--blue-soft);border-radius:9px;padding:11px 13px;font-size:13.5px}
.sec.crit > h4{color:var(--plum)}
.sec.crit .box{background:var(--plum-soft);border-radius:9px;padding:11px 13px;font-size:13.5px}
.sec.crit ul{margin:0;padding-left:19px}
.sec.crit li{margin-bottom:6px}
.sec.crit li:last-child{margin-bottom:0}
.sec.crit li b{color:var(--plum)}

.sec.lin > h4{color:var(--teal)}
.sec.lin .box{background:var(--teal-soft);border-radius:9px;padding:11px 13px;font-size:13.5px}
.sec.lin ul{margin:0;padding-left:19px}
.sec.lin li{margin-bottom:7px}
.sec.lin li:last-child{margin-bottom:0}
.sec.lin li b{color:var(--teal)}

.sec.fig > h4{color:var(--rose)}
.figs{display:grid;gap:9px}
.fig{border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:0 9px 9px 0;
  padding:11px 13px;background:#fffdfd}
.fig .fh{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-bottom:3px}
.fig .fn{font-size:14.5px;font-weight:680}
.fig .fr{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--rose-soft);
  color:var(--rose);border:1px solid #ecd3d8;white-space:nowrap}
.fig .fr.own{background:var(--accent);border-color:var(--accent);color:#fff}
.fig .fr.ext{background:var(--panel);border-color:var(--line);color:var(--muted)}
.fig .fi{font-size:11.5px;color:var(--muted);margin-bottom:7px;font-variant-numeric:tabular-nums}
.fig p{margin:0 0 6px;font-size:13.3px}
.fig p:last-child{margin-bottom:0}
.fig p.mu{background:var(--panel);border-radius:7px;padding:8px 10px}
.fig p b{color:var(--rose)}

.sec.can > h4{color:var(--slate)}
dl.can{margin:0;display:grid;gap:8px}
dl.can div{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--slate-soft)}
dl.can dt{font-size:13.5px;font-weight:680;color:var(--slate);margin-bottom:2px}
dl.can dd{margin:0;font-size:13.3px}

details.idx{margin:0 0 18px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
details.idx summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:620;list-style:none}
details.idx summary::-webkit-details-marker{display:none}
details.idx summary::before{content:"▸ ";color:var(--rose)}
details.idx[open] summary::before{content:"▾ "}
.idxbody{padding:0 14px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px}
.idxi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.3px}
.idxi b{display:block;font-size:13px;font-weight:660}
.idxi span{color:var(--muted);font-size:11px}

.sec.acc > h4{color:var(--gold)}
.sec.acc .box{background:var(--gold-soft);border-radius:9px;padding:11px 13px;font-size:13.5px;
  border:1px solid #eadfc2}
.sec.acc ul{margin:0;padding-left:19px}
.sec.acc li{margin-bottom:7px}
.sec.acc li:last-child{margin-bottom:0}
.sec.acc li b{color:var(--gold)}
.sec.redo > h4{color:var(--accent)}
ol.redo{margin:0;padding:0;list-style:none;counter-reset:r}
ol.redo li{counter-increment:r;position:relative;padding:0 0 12px 34px;font-size:13.8px}
ol.redo li:last-child{padding-bottom:0}
ol.redo li::before{content:counter(r);position:absolute;left:0;top:1px;width:23px;height:23px;
  border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
ol.redo li strong{display:block;font-weight:670;margin-bottom:1px}
.fit{margin-top:12px;font-size:13px;background:var(--panel);border-left:2.5px solid var(--ink);
  padding:9px 12px;border-radius:0 7px 7px 0;color:#3d3a35}
.fit b{font-weight:670}

details.pod{margin-top:16px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
details.pod summary{cursor:pointer;padding:11px 15px;font-size:13.5px;font-weight:620;list-style:none}
details.pod summary::-webkit-details-marker{display:none}
details.pod summary::before{content:"▸ ";color:var(--accent)}
details.pod[open] summary::before{content:"▾ "}
details.pod.full{margin-top:14px;background:var(--slate-soft);border-color:#dde3ec}
details.pod.full summary{color:var(--slate)}
details.pod.full summary::before{color:var(--slate)}
details.pod.full .script p.hd{background:#e6ecf4;color:var(--slate)}
.podbody{padding:0 15px 14px}
.script{font-size:13px;line-height:1.75;background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:12px 13px;max-height:420px;overflow:auto}
.script p{margin:0 0 7px;padding:3px 6px;border-radius:5px;transition:background .15s;cursor:pointer}
.script p:hover{background:#f4f2ee}
.script p.now{background:#fdf1e8;box-shadow:inset 2px 0 0 var(--accent)}
.player label.fw{gap:4px;cursor:pointer;user-select:none}
.player label.fw input{accent-color:var(--accent);margin:0}
.script p.done{color:#9b968e}
.script p .sp{display:inline-block;min-width:17px;font-weight:700;color:var(--accent)}
.script p.b .sp{color:var(--blue)}
.script p.hd{font-weight:680;color:var(--ink);background:var(--panel);text-align:center}

.player{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.pbtn{padding:6px 14px;font:inherit;font-size:13px;font-weight:620;cursor:pointer;
  background:var(--accent);color:#fff;border:0;border-radius:7px;white-space:nowrap}
.pbtn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:6px 11px}
.pbtn:disabled{opacity:.45;cursor:default}
.player label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.player input[type=range]{width:82px;accent-color:var(--accent)}
.player select{font-size:11.5px;padding:4px 6px;max-width:150px}
.pstat{font-size:11.5px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.pwarn{font-size:12px;color:#9b3b52;background:var(--rose-soft);border-radius:7px;padding:8px 11px;margin-bottom:10px}
button.copy{margin-top:9px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer;
  background:var(--ink);color:#fff;border:0;border-radius:7px}
button.copy:active{opacity:.7}
.srcs{font-size:12px;color:var(--muted);margin-top:9px;word-break:break-all}
.srcs a{color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.75}
@media(max-width:600px){.player{gap:6px}.pbtn{padding:9px 15px;font-size:14px}.player select{max-width:120px}.script{max-height:60vh}.minibar{bottom:8px;font-size:11.5px}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 13px 50px}}

.briefs{display:grid;gap:9px;margin-bottom:14px}
.bf{border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:0 9px 9px 0;
  padding:11px 13px;background:#fff}
.bf h4{margin:0 0 4px;font-size:14.2px;font-weight:645;line-height:1.45}
.bf h4 a{color:inherit;text-decoration:none;border-bottom:1px solid #d9d6d0}
.bf h4 a:hover{color:var(--accent);border-color:var(--accent)}
.bf .m{font-size:11px;color:var(--muted);margin-bottom:6px}
.bf p{margin:0 0 5px;font-size:13.1px}
.bf p:last-child{margin-bottom:0}
.bf .tc{background:var(--green-soft);border-radius:6px;padding:6px 9px;font-size:12.6px;margin-top:6px}
.bf .tc b{color:var(--green)}
details.idxall{margin:0 0 18px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
details.idxall summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:620;list-style:none}
details.idxall summary::-webkit-details-marker{display:none}
details.idxall summary::before{content:"▸ ";color:var(--slate)}
details.idxall[open] summary::before{content:"▾ "}
.idxlist{padding:0 14px 12px;max-height:60vh;overflow:auto}
.idxrow{display:flex;gap:9px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.6px}
.idxrow:last-child{border-bottom:0}
.idxrow .d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11px}
.idxrow .jn{color:#3c4a63;white-space:nowrap;font-size:11px;min-width:96px}
.idxrow a{color:inherit;text-decoration:none}
.idxrow a:hover{color:var(--accent)}

.blkplay{position:absolute;top:8px;right:8px;z-index:2;width:26px;height:26px;padding:0;
  font-size:11px;line-height:1;cursor:pointer;border:1px solid var(--line);border-radius:50%;
  background:#fff;color:var(--accent);opacity:.5;transition:opacity .15s}
.blkplay:hover{opacity:1;background:var(--accent-soft)}
.sec > .blkplay{top:-2px}
.minibar{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:14px;
  display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;
  border-radius:99px;padding:7px 9px 7px 16px;font-size:12.5px;z-index:99;
  box-shadow:0 4px 18px rgba(0,0,0,.22);transition:transform .22s;max-width:92vw}
.minibar.on{transform:translateX(-50%) translateY(0)}
.minibar .mt{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minibar .mn{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums;min-width:52px}
.minibar .pbtn{padding:4px 10px;font-size:12px;background:rgba(255,255,255,.16);color:#fff;border:0}
.minibar .pbtn:hover{background:rgba(255,255,255,.28)}

.tldr{border:2px solid var(--accent);border-radius:12px;padding:14px 16px;margin:0 0 12px;
  background:linear-gradient(180deg,var(--accent-soft),#fff 80px);position:relative}
.tldr h3{margin:0 0 9px;font-size:15px;font-weight:700;color:var(--accent)}
.tldr dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 11px;font-size:13.4px}
.tldr dt{font-weight:700;color:var(--accent);white-space:nowrap}
.tldr dd{margin:0}
.tldr .act{margin-top:10px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;font-size:13.2px}
.tldr .act b{color:#f0b98a}
details.deep{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:12px}
details.deep > summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:620;list-style:none;color:var(--slate)}
details.deep > summary::-webkit-details-marker{display:none}
details.deep > summary::before{content:"▸ ";color:var(--slate)}
details.deep[open] > summary::before{content:"▾ "}
.deepbody{padding:0 14px 12px}
</style>
</head>

</div>

     "title": "Dissecting the gender divide: authorship and acknowledgment in scientific publications",
     "journal": "Scientometrics",
     "date": "2026-08-08",
     "authors": "Keigo Kusumegi（Cornell University）、Daniel E. Acuña（University of Colorado Boulder）、Yukie Sano（University of Tsukuba，通訊作者）",
     "doi": "https://doi.org/10.1007/s11192-026-05712-z",
     "oa": true,
     "fresh": false,
     "refs": 0,

      "scientometrics and bibliometrics research"
     ],
     "gist": [
      "這篇要處理的是科學計量學裡一個老問題的新切面：女性在科學生產中的貢獻，是被寫進作者列，還是被推到誌謝欄。過去對性別差距的研究幾乎都集中在作者身分本身——女性第一作者比例、女性通訊作者比例、女性論文的被引用差距。但作者身分是一道門檻，門檻之外還有一整片灰色地帶：誌謝。誌謝是學術界唯一制度化承認「有貢獻但不夠格掛名」的位置，因此它同時是慷慨的表現，也可能是排除的痕跡。作者群把問題設定成：同樣的貢獻，男性拿到作者身分、女性拿到誌謝，這種替代關係是否系統性存在。",
      "資料規模是這篇最硬的本錢。他們分析了超過兩萬名作者與六萬名被誌謝的個人，橫跨九個學科的開放取用期刊。用開放取用期刊是有理由的——只有全文可取得，誌謝段落才能被機器解析。兩萬對六萬這個比例本身就值得注意：被誌謝的人數是作者人數的三倍，代表誌謝欄裡藏著一個規模遠大於作者列的隱形勞動群體，而過去的性別研究幾乎完全沒有進到這個群體裡面。",
      "發現分成兩層。第一層是主效果：女性確實更常出現在誌謝欄而非作者列，而且這個落差在「investigation」與「analysis」這兩類角色上最明顯。這兩個詞直接對應 CRediT 貢獻者角色分類法的用語，也就是說作者群不是憑印象分類，而是把誌謝文字對映到一套既有的貢獻類型架構上。investigation 是執行實驗、收集資料，analysis 是資料處理與統計——這兩件事恰好是最耗時、最不容易被論述為「智識領導」的工作。",
      "第二層是這篇真正的方法論企圖：他們擔心性別效果其實是地位效果的偽裝，於是把樣本切成「高被引學者配低被引學者」的合作對，在這種配對裡看誰拿到作者身分。結果是地位壓過性別——高被引的一方無論男女都更容易掛名。但接著出現一個違反直覺的發現：在這些高被引配對裡，女性反而比男性更容易成為共同作者。作者群把這解讀成權力動態與「感知到的成功」共同決定了功勞分配，而不是單純的性別歧視。",
      "貢獻宣稱因此不是「女性受到不公平對待」這種已被說過很多次的結論，而是「功勞分配的第一層決定因素是地位，性別的作用要在控制地位之後才看得清楚，而且方向可能翻轉」。他們把訴求對象明確指向學者、期刊編輯與資助機構——這是 Scientometrics 這類期刊很吃的收尾方式：把描述性發現接到可操作的制度槓桿上。"
     ],
     "design": "從摘要可還原的設計是：全文層級的誌謝段落擷取＋姓名的性別推論＋作者與被誌謝者的配對比較，再加上一層以被引用次數為分層變數的子樣本分析。九個學科、開放取用期刊，這個選樣本身就是一個取捨——換來全文可及性，代價是樣本偏向 PLOS、BMC、Frontiers 這類大型 OA 出版社，學科分布不會是科學整體的縮影。<b>需要註明的是，OpenAlex 目前沒有收錄這篇的參考文獻（referenced_works_count 為零），所以本文的方法論線索無法從引用結構回推，以下對工具選擇的判斷全部是根據摘要文字與該領域慣例的推論，不是從參考文獻讀出來的事實。</b>性別推論幾乎確定是用姓名對性別的機率字典（Genderize、Gender-API 或 Santamaría 與 Mihaljević 的基準比較），這一步的誤差率在東亞與南亞姓名上特別高，而九學科樣本裡東亞作者比例不會低。",
     "lineage": [
      "<b>主脈絡是誌謝研究，不是性別研究。</b>這篇真正的母體文獻是 Cronin 從一九九零年代開始建立的誌謝計量學傳統——他主張誌謝是「次級的功勞市場」，記錄了正式作者制度容納不下的貢獻。把性別接到這條線上，等於是說：要看見性別不平等，你得先承認學術功勞不是只有一種貨幣。",
      "<b>錨點文獻應該是 Paul-Hus 與 Larivière 一四到一九年間關於誌謝與貢獻者角色的系列研究。</b>他們建立了把誌謝文字對映到功能類別的可行性，也做過大規模的 CRediT 角色性別分布分析。這篇的「investigation 與 analysis 上落差最大」在措辭上幾乎是直接沿用那條線的分類語彙。",
      "<b>設計母本是 CRediT 貢獻者角色分類法。</b>把誌謝內容歸到 investigation、analysis 這些桶子裡，就是在借用 CRediT 的十四個角色作為編碼框架。這個選擇有代價：CRediT 是為作者設計的，硬套到誌謝文字上時，「funding acquisition」「supervision」這些角色的對映會相當勉強。",
      "<b>地位分層的構念來自 Merton 的馬太效應與其後的累積優勢文獻。</b>用「高被引配低被引」切合作對，等於是把馬太效應當成混淆變數而不是研究對象。這個轉換很聰明，但也意味著他們接受了「被引用次數＝地位」這個相當粗糙的操作化。",
      "<b>缺席的是勞動社會學那一支。</b>誌謝欄裡的女性做 investigation 與 analysis，這在 Shapin 的「隱形技術人員」、以及後來 Barley 與 Bechky 對實驗室技師的民族誌裡已經被講了三十年。那條傳統會問的是「這些人是誰、雇用關係是什麼、有沒有薪水」，而純計量的做法答不了。",
      "<b>另一個缺席是作者身分規範研究。</b>ICMJE 的四項作者標準、以及「幽靈作者／禮貌作者」文獻，直接處理的就是「誰該掛名」的規範問題。這篇報告了掛名與誌謝的分布，卻沒有把分布接回規範——也就是說，它證明了差異存在，但沒有說這個差異是否違反了任何一套明文標準。",
      "<b>參考文獻在 OpenAlex 中為零筆，所以上述全部是根據摘要與領域慣例的推斷，不是從引用清單讀出的事實。</b>這件事本身值得記住：新上線的 Springer 論文常有數週到數月的參考文獻延遲，做 preflight 檢查時不能只看 OpenAlex 的 referenced_works。"
     ],
     "critique": [
      "<b>最聰明的地方是把地位當成競爭性解釋，而不是留給審稿人去問。</b>大多數性別計量研究到「女性比較常被誌謝」就收手，這篇往前走了一步：如果誌謝與掛名的差別其實是資深與資淺的差別，性別只是共變，那結論就要改寫。用高被引與低被引的配對來拆這一層，是這篇能上 Scientometrics 的關鍵動作。",
      "<b>但工具配不上這個企圖。</b>被引用次數是地位的代理變數裡最粗的一種——它混合了年資、學科規模、期刊選擇與自我引用。真正要拆「地位 vs 性別」，需要的是學術年齡、職位階級（博後、助理教授、正教授）、以及經費主持人身分。用被引用次數當地位，等於用一個本身有性別偏誤的變數去控制性別偏誤。",
      "<b>「高被引配對裡女性比男性更容易掛名」這個翻轉需要更謹慎的處理。</b>這極可能是選擇效應：能爬到高被引位置的女性，是通過了更嚴格篩選的一群人，她們的合作行為本來就不代表女性整體。摘要沒有交代是否做過任何選擇修正，這會是審稿人最容易抓的一點——如果作者在正文裡把這個結果講成「女性其實沒有吃虧」，那是過度延伸。",
      "<b>外部效度邊界很窄，但摘要沒有標出來。</b>只有開放取用期刊、只有九個學科、只有有誌謝段落且格式可解析的論文。誌謝的書寫慣例在學科之間差異巨大——高能物理幾乎沒有個人誌謝，臨床醫學的誌謝欄可能有幾十人。把九個學科混在一起算比例，等於默認誌謝的意義跨學科可比，這個假設站不住。",
      "<b>性別推論的誤差沒有被當成一階問題。</b>姓名推論在東亞姓名上的不可判定率可以到三成以上，而且不可判定不是隨機發生的——它與國別、與研究主題、可能也與資淺程度相關。如果被誌謝者裡不可判定的比例高於作者，那所有比例的比較都會偏。這一點在 Scientometrics 的審稿裡近年被抓得越來越緊。",
      "<b>審稿人一定會問的是因果方向。</b>是因為女性貢獻的類型（執行與分析）本來就比較不容易換到作者身分，還是同樣的貢獻類型下女性被降級？這兩件事的政策意涵完全相反：前者要改的是「什麼算作者貢獻」的規範，後者要改的是決策者的偏誤。摘要沒有分開，正文如果也沒分開，這篇的貢獻就只停在描述層。",
      "<b>還有一個實務層的漏洞：誌謝是被誌謝者不能否認的。</b>作者身分需要當事人同意，誌謝不需要。所以「更常被誌謝」這件事有一部分可能反映的是作者群單方面的書寫慣例，而不是任何協商結果。這在方法上不可觀察，但至少該寫進限制。"
     ],
     "accept": [
      "<b>規模是敲門磚。</b>兩萬作者、六萬被誌謝者、九個學科，這在誌謝計量研究裡屬於上限級的樣本。Scientometrics 對描述性研究相當寬容，但寬容的前提是資料規模要能撐起「首次大規模證據」這個宣稱，而摘要裡「large-scale empirical evidence across multiple disciplines remains limited」這一句就是在替自己補這個位置。",

   "podcast": "【每日學術新聞　二零二六年八月十日　午班】\n\n各位聽眾午安。這裡是每日學術新聞午班。我們追蹤十九本科學計量學、創新與科技管理的期刊，把今天新上線的論文整理出來，用學者的角度講清楚。今天的節目有三則深度報導，加上一段快訊，最後是一則可以拿去教學生的原則。\n\n今天的存量池是一千九百二十五篇，也就是從今年一月一日到現在，這十九本期刊總共上線了一千九百二十五篇正式論文。我們今天新增了兩百四十筆全索引，寫了二十三篇中等摘要，並且挑出三篇做完整拆解。三篇之中，有一篇是昨天，也就是八月九日才上線的，是目前最新的一篇。\n\n現在進入第一則。\n\n第一則。誌謝欄裡的女性，作者列裡的男性，但真正決定誰掛名的可能不是性別。\n\n這篇論文八月八日上線於 Scientometrics，標題翻成中文是「拆解性別鴻溝：科學出版中的作者身分與誌謝」。第一作者是康乃爾大學資訊科學系的 Keigo Kusumegi，第二作者是科羅拉多大學波德分校的 Daniel Acuña，通訊作者是筑波大學的 Yukie Sano。這是一篇開放取用論文，採創用授權，任何人都可以直接下載全文。\n\n研究對象是科學論文裡的功勞分配。過去談性別不平等，幾乎都在看作者列——女性第一作者的比例、女性通訊作者的比例、女性論文的被引用差距。但作者列是一道門檻，門檻之外還有一整片灰色地帶，那就是誌謝欄。誌謝是學術界唯一制度化承認「有貢獻但不夠格掛名」的位置。它同時是慷慨的表現，也可能是排除的痕跡。\n\n資料規模是這篇最硬的本錢。他們分析了超過兩萬名作者，以及六萬名被誌謝的個人，橫跨九個學科的開放取用期刊。請注意這個比例。被誌謝的人數，是作者人數的三倍。也就是說，誌謝欄裡藏著一個規模遠大於作者列的隱形勞動群體，而過去的性別研究幾乎完全沒有進到這個群體裡面。他們之所以選開放取用期刊，是因為只有全文可以取得，誌謝段落才能被機器解析。\n\n方法上，他們把誌謝文字對映到一套既有的貢獻類型架構，也就是所謂的貢獻者角色分類法。這套分類法原本是設計給作者用的，把貢獻拆成概念發想、資料收集、正式分析、撰寫等十四個角色。他們把誌謝內容也放進這個框架裡分類。\n\n結果分成兩層。第一層是主效果。女性確實更常出現在誌謝欄而不是作者列，而且這個落差在「資料收集」與「資料分析」這兩類角色上最明顯。這兩件事恰好是最耗時、最不容易被論述成智識領導的工作。\n\n第二層才是這篇真正的方法論企圖。作者群擔心，性別效果其實是地位效果的偽裝。於是他們把樣本切成「高被引學者配低被引學者」的合作對，看在這種配對裡誰拿到作者身分。結果是地位壓過性別。高被引的一方，無論男女，都更容易掛名。但接著出現一個違反直覺的發現：在這些高被引的配對裡，女性反而比男性更容易成為共同作者。\n\n作者群把這個結果解讀成，權力動態與「感知到的成功」共同決定了功勞分配，而不是單純的性別歧視。他們把訴求對象明確指向學者、期刊編輯與資助機構。\n\n要說明一件事。這篇論文在 OpenAlex 裡的參考文獻筆數目前是零，也就是說參考文獻還沒被收錄。所以我們待會兒對它文獻脈絡的判斷，全部是根據摘要文字與領域慣例的推論，不是從引用清單讀出來的事實。這一點我們會誠實標明。\n\n第二則。協作式前瞻的組成問題，一篇沒有資料的論文，和它自己引了卻沒做的那一步。\n\n這篇同樣是八月八日上線，發表在 Technological Forecasting and Social Change，標題翻成中文是「群體組成在協作式前瞻中的角色」。第一作者與通訊作者是林茲約翰克卜勒大學與維也納經濟大學的 Melanie Wiener，第二作者是奧胡斯大學與布達佩斯考文紐斯大學的 Harry Boer，最後作者是林茲約翰克卜勒大學的 Regina Gattringer。同樣是開放取用，創用授權。\n\n協作式前瞻，指的是兩個以上的組織一起做未來探索，產出通常是共享的情境集、技術路線圖，或議題清單。這件事近年被當成應對高度不確定環境的萬靈丹。作者要問的是：它承諾的好處，到底在什麼條件下才會兌現。而他們把條件鎖定在一個具體的變數上，就是群體組成。誰坐在那張桌子旁，決定了這個群體能不能挑戰從過去經驗繼承下來的主導心智模型。\n\n這裡要誠實講清楚：這篇沒有經驗資料。它是一篇文獻回顧加概念框架，產出的是命題，不是估計值。參考文獻總共一百四十九筆。\n\n回顧的結論有兩點。第一，協作前瞻的文獻在「群體組成如何影響集體認知」這件事上，理論發展相當有限。第二，多數研究把多樣性當成一個均質的構念在處理，好像多元就是一件事。\n\n概念貢獻則是主張：刻意配置跨屬性的同質性與異質性，會產生不同的認知動態，而這些動態對集體認知同時有促進與抑制的效果。也就是說，多樣性不是越多越好，而是要看你在哪個屬性上多樣。最後他們提出一個遞迴命題：認知動態塑造前瞻流程，而前瞻流程本身又反過來持續重構群體的集體認知。\n\n這篇的參考文獻結構把方法洩漏得很清楚。被引用次數最高的十四筆裡，有一筆是 Torraco 二零零五年的「如何寫整合式文獻回顧」，被引用超過三千兩百次。整合式回顧和系統性回顧是兩件不同的事，標準也不同。而摘要用的字是系統性文獻回顧。這個落差我們待會兒會回來談。\n\n理論骨架則來自三條線。第一條是 Harrison 與 Klein 二零零五年的多樣性類型學，第二條是 van Knippenberg 等人二零零四年的類別化與精緻化模型，第三條是 Tripsas 與 Gavetti 二零零零年的認知慣性研究，也就是那個著名的寶麗來案例。\n\n第三則。政府研發補助到底促進還是抑制破壞式創新。這是今天最新的一篇，八月九日上線。\n\n發表在 Technology in Society，標題翻成中文是「政府研發補助促進還是抑制早期新創的破壞式創新？專有化機制的調節角色」。第一作者是伯明罕大學與南非大學的 Samuel Adomako，最後作者是胡志明市經濟大學的 Nguyen Phong Nguyen。開放取用。\n\n這裡必須先講一個限制。這篇論文在 OpenAlex 裡沒有摘要，欄位是空的。所以我們接下來說的一切，全部來自標題結構、主題標籤，以及七十五筆參考文獻的組成，而不是作者自己的敘述。凡是涉及樣本量、係數與統計結果的部分，我們一律不報告數字，因為報了就是編造。\n\n從標題可以讀出完整的骨架。因變數是早期階段新創的破壞式創新，自變數是政府研發補助，調節變數是專有化機制，也就是企業能不能守住創新成果。標題用的是「促進還是抑制」這種二選一的疑問句，這在管理學論文裡通常預告一個有條件或非線性的答案。純粹正向或負向的結論，不會用這種標題。\n\n參考文獻的組成把方法設計洩漏得非常徹底。被引用最多的三筆，第一是 Hu 與 Bentler 一九九九年的模型適配指標門檻，被引用超過十萬次；第二是 Podsakoff 等人二零零三年的共同方法偏誤，被引用將近八萬次；第三是 Fornell 與 Larcker 一九八一年的收斂效度與區辨效度，被引用將近七萬次。這三筆同時出現，幾乎確定意味著：這是一份問卷調查資料，用潛在變數模型分析，而且作者知道審稿人會問共同方法偏誤——他們還額外引了 Podsakoff 等人二零一一年的第二篇方法偏誤論文。\n\n更值得注意的是兩筆內生性處理的引用。一筆是 Heckman 一九七九年的樣本選擇偏誤，另一筆是 Emily Oster 二零一六年的不可觀測選擇與係數穩定性。這個組合在問卷型的管理研究裡並不常見，代表作者刻意要回應「拿到補助的新創本來就跟別人不一樣」這個最致命的質疑。Heckman 處理的是誰進入樣本，Oster 處理的是不可觀測變數會不會推翻係數，兩者一起用，是相當認真的做法。\n\n理論骨架則來自四條線：Teece 一九八六年的專有化條件，對應調節變數；Christensen 與 Bower 一九九六年的破壞式創新，對應因變數；Cohen 與 Levinthal 一九九零年與 Zahra 與 George 二零零二年的吸收能力；以及 Nelson 一九五九年的基礎研究市場失靈，對應政府補助的正當性論證。這是一個非常標準、非常安全的理論組合。每一塊都是教科書級文獻，沒有一塊是冒險的。\n\n以上是今天的三則報導。接下來是專家回應。\n\n【專家回應　第一則　誌謝、性別與地位】\n\n先說這篇最聰明的地方。大多數性別計量研究，寫到「女性比較常被誌謝」就收手了。這篇往前走了一步：它問，如果誌謝與掛名的差別，其實是資深與資淺的差別，性別只是共變，那結論就要整個改寫。用高被引與低被引的配對來拆這一層，是這篇能上 Scientometrics 的關鍵動作。這個動作值得學，因為它示範了一件事——把最強的競爭性解釋，自己先拿出來打，比等審稿人來打好得多。\n\n但接下來要說最致命的缺口。工具配不上這個企圖。他們用被引用次數當地位的代理變數，而被引用次數是地位的代理變數裡最粗的一種。它混合了年資、學科規模、期刊選擇，還有自我引用。更麻煩的是，被引用次數本身就受性別影響——女性學者的被引用差距是已經被反覆證實的現象。所以這等於是用一把本身有性別偏誤的尺，去量性別偏誤。你控制不乾淨。\n\n第二個問題是那個翻轉的發現。「高被引配對裡，女性反而比男性更容易掛名」，這極可能是選擇效應。能爬到高被引位置的女性，是通過了更嚴格篩選的一群人，她們的合作行為本來就不代表女性整體。摘要沒有交代是否做過任何選擇修正。如果作者在正文裡把這個結果講成「女性其實沒有吃虧」，那是過度延伸，而且這種句子一旦被媒體轉述，傷害不小。\n\n還有兩個次要問題。一是性別推論的誤差沒有被當成一階問題。姓名推論在東亞姓名上的不可判定率可以到三成以上，而且不可判定不是隨機發生的，它與國別、學科，可能也與資淺程度相關。二是外部效度邊界很窄但沒有標出來。誌謝的書寫慣例在學科之間差異巨大。高能物理幾乎沒有個人誌謝，臨床醫學的誌謝欄可能有幾十個人。把九個學科混在一起算比例，等於默認誌謝的意義跨學科可比，這個假設站不住。\n\n那麼，如果要重現並且改進這項研究，該怎麼做？\n\n第一步，重建資料的時候，把樣本框當成一個一階決策，而不是技術細節。從 OpenAlex 或 Crossref 取得目標學科的開放取用論文清單，用 Europe PMC 與各出版社的文本探勘介面抓全文，直接讀誌謝區塊，不要從可攜式文件格式解析。關鍵是明確記錄兩層損失率：有誌謝區塊的比例，和誌謝區塊可解析的比例，而且要依學科分別報告。如果某個學科的可解析率只有四成，那個學科的比例就不該進總體比較。這張損失率表本身就是一個可發表的發現。\n\n第二步，性別變數用三重來源交叉，而且把不可判定率當成結果來報告，不是當成雜訊。同時跑三套姓名性別字典，三者一致才標記性別。然後做一件原研究沒做的事：檢驗不可判定率是否與國別、學科、資淺程度相關。如果相關，就用不可判定的樣本做界限分析——把全部不可判定者先假設為女性、再假設為男性，看主結論會不會翻轉。這個做法成本很低，但說服力很高。\n\n第三步，地位變數不要用被引用次數。改用三個東西合成：學術年齡，也就是從第一篇論文到本篇的年數；擔任通訊作者的次數；以及是否為經費主持人，這個可以從誌謝欄的補助語句反推。被引用次數留著當穩健性檢查，不要當主變數。這一步直接對應原研究最大的落差。如果合成指標讓性別效果消失，那原文的結論就要改寫；如果沒消失，你的結論比原文強得多。\n\n第四步，把貢獻角色編碼的信度做出來。隨機抽兩千條誌謝語句，兩位人工編碼者獨立標註，計算一致度係數。一致度低於零點七的類別直接合併或刪除，不要硬留。然後才用人工標註訓練分類器，並在保留集上報告每個類別的精確率與召回率。原研究最可能被攻擊的就是這一層——它報告了類別之間的差異，卻沒有證明類別本身是可靠的。\n\n第五步，因果識別用學科內的規範變動當外生衝擊。貢獻者角色分類法在不同期刊的導入時間不一樣，這給了一個交錯式的差異中之差異設計。比較同一個學科內、導入前後，女性從誌謝欄移動到作者列的比例變化。如果貢獻聲明制度化真的改變了功勞分配，這個設計看得到；如果看不到，那就說明制度改革無效，這本身就是一個很強的結論。\n\n第六步，處理那個翻轉發現的選擇效應。用兩階段選擇模型或係數穩定性界限，明確處理「能成為高被引學者的女性是被篩選過的」這件事。第一階段模型化成為高被引學者的機率，第二階段才估掛名機率。如果修正之後翻轉消失，你就推翻了原文最吸睛的發現。這是高風險高報酬的動作，但值得做。\n\n最後，找反例學科。刻意納入誌謝慣例最極端的兩個學科：高能物理，和臨床醫學。如果主效果在這兩個極端裡都成立，外部效度就穩了；如果不成立，你就找到了邊界條件，而邊界條件往往比主效果更值得寫。原研究把九個學科混算，等於放棄了這個最有價值的分析。\n\n【專家回應　第二則　群體組成與協作式前瞻】\n\n這篇最聰明的地方，是抓到了一個真實存在的缺口。前瞻文獻確實長期停在「要找不同背景的人來」這種粗糙建議，沒有人問過：在哪個屬性上要異質，在哪個屬性上要同質。把 Harrison 與 Klein 的多樣性三型分類搬進來，是一個乾淨而且正確的診斷。\n\n但最致命的缺口就在這裡，而且它正是那句老話——引了卻沒做。他們引了 Harrison 與 Klein 的三型分類，引了 Joshi 與 Roh 的脈絡調節後設分析，手上有一百四十九筆文獻，結果只產出一個概念框架。這是說不過去的。他們的診斷是「文獻沒把多樣性拆開」，那最低限度的貢獻，應該是把回顧到的每一篇研究，依照分離型、多樣型、差距型重新編碼一次，做出一張分布表。這件事成本不高，資料就在手上，架構也是現成的，卻沒有做。\n\n第二個致命的地方是缺席。這篇談的是協作式前瞻，而協作式前瞻的本質就是集體預測。但在被引用最多的十四筆參考文獻裡，看不到 Scott Page 的任何作品。Page 的多樣性預測定理，用形式化的方法證明了：群體的預測誤差，等於個體預測誤差的平均值，減去個體之間的預測分歧度。這是「多樣性有用」這個主張目前最強的數學論證，也正是這篇最需要的東西。一篇專門談群體組成如何影響集體預測的論文，沒有碰這個定理，是最值得追問的空白。\n\n次要的問題有三個。一是方法用詞與方法引用不一致。摘要說系統性文獻回顧，最重的方法論來源卻是整合式回顧的指引，而且前十四筆重量級引用裡沒有任何一套系統性回顧的規程。整合式回顧是正當的方法，它不是系統性回顧。這個問題可以在改寫時用一句話修掉，但不修，方法學審稿人第一眼就會抓。\n\n二是遞迴命題無法被證偽。認知動態塑造流程、流程又重構認知，這在概念上很優雅，但如果沒有時間解析度的測量設計，這個命題在任何橫斷面研究裡都不可檢驗。提出遞迴關係的論文，有義務同時說明它可以怎麼被測。\n\n三是內生性在概念層就存在。誰被邀請進協作前瞻，本身就是既有心智模型的產物。如果主導聯盟只會邀請認知相近的夥伴，那群體組成不是自變數，而是結果。這篇把組成當成可設計的決策變數，等於假設了一個並不存在的中立設計者。\n\n那麼，如果要重現並且改進這項研究，該怎麼做？\n\n第一步，把回顧本身結構化。拿原文的一百四十九筆參考文獻當起點，補到兩百五十筆左右，然後對每一篇做四欄編碼：多樣性屬性、多樣性型態、前瞻情境、以及有沒有實證資料。兩位編碼者獨立做，報告一致度。做出來的分布表可以立刻回答「文獻到底缺什麼」，而且是可驗證的答案，不是宣稱。\n\n第二步，群體組成不要用單一指數。功能背景多樣性用一種指數，組織隸屬多樣性用另一種，認知多樣性用工作坊前的因果圖繪製計算節點與連結的重疊率，地位差距用組織規模與職級的不均度。四個變數分別進模型，不要合成。統計上因為個人巢套在群體裡，要用多層次模型。\n\n第三步，把遞迴命題變成可測的縱時設計。在同一批協作前瞻專案裡，於三個時點重複測量參與者的心智模型與群體共享認知：啟動前、中期、結束後。用交叉延遲追蹤模型估計「組成到認知」與「認知到流程」的雙向路徑。原文提出遞迴關係卻沒給測量方案，這一步直接補上，而且這是這個題目最可能發表在頂級期刊的做法。\n\n第四步，因果識別用隨機化的組成配置。與一個實際運作的前瞻平台合作，在報名者裡隨機分配到不同的組成條件。這是田野實驗，成本高但可行，因為工作坊的分組本來就是主辦方的權限。結果變數用產出情境的新穎度，請外部專家盲評，再加上語意距離算出的多樣度。\n\n第五步，直接對接多樣性預測定理，補上原文最大的缺席。在工作坊裡嵌入一組有客觀答案的短期預測題，例如未來十二個月的技術採用率或專利申請量。同時記錄每一位參與者的個別預測，和群體的共識預測。然後直接計算三個量：群體誤差、平均個體誤差、分歧度，檢驗那個恆等式是否成立，以及分歧度是不是由你操作的組成變數驅動。這一步把一篇概念論文變成有形式基礎的實證論文。\n\n第六步，處理權力不對稱這個被忽略的調節。在每個群體裡測量參與者對「誰的意見比較有分量」的感知，計算集中度，當成調節變數重跑主分析。如果多樣性的好處只在權力分散的群體裡出現，那就找到了一個實務上極重要的邊界條件，而且它直接挑戰「只要找對人來就好」這個原文隱含的假設。\n\n【專家回應　第三則　補助、專有化與破壞式創新】\n\n先說最聰明的地方。這篇同時用了 Heckman 與 Oster 兩種內生性工具。問卷型的管理研究處理內生性，標準做法通常只有一招，多半是滯後變數。這篇用了兩種邏輯不同的工具：一種處理可觀測的選擇進入，一種處理不可觀測的混淆。特別是係數穩定性界限，在管理學期刊裡仍然少見。用了就等於對審稿人說：我知道你在擔心什麼。這一手大概率是這篇能過的關鍵。\n\n但最致命的缺口是因變數的測量。破壞式創新，用自陳量表測，在概念上就是矛盾的。破壞性是市場結構的事後性質——低階市場切入、初期性能較差、既有領導者被迫退出。這些東西創業者自己不會知道，而且會系統性高估自己的破壞性。如果因變數與自變數都來自同一份問卷、同一位受訪者，那共同方法偏誤的兩篇引用也救不了根本問題。\n\n第二個致命的地方，同樣是引了卻沒做。他們引了 Powell 等人一九九六年關於生技產業網絡學習的研究，那篇的核心主張是創新的軌跡發生在組織間網絡而不是單一組織內部。要接這條線，就得測合作關係。但橫斷面問卷做不到。所以這個引用大概只是理論鋪陳。審稿人如果認真，會問：既然你認為網絡重要，為什麼模型裡沒有網絡變數。同樣的問題也發生在 Fleming 與 Sorenson 那筆引用上——那篇建立了客觀的技術重組不確定性測量，而這篇極可能用自陳量表測同一個構念。\n\n還有一個更大的缺席。這篇問的是「政府補助有沒有效」，而這個問題有一整支二十年的計量評估傳統，代表人物是魯汶大學與曼海姆歐洲經濟研究中心的 Dirk Czarnitzki。那條線用傾向分數配對、條件差異中之差異、斷點設計，累積了非常豐富的結論。但在被引用最多的十六筆參考文獻裡，看不到這條線的任何代表作。一篇評估補助的論文，不對話補助評估的計量傳統，這是最值得追問的缺席。\n\n次要的問題還有三個。一是工具配不上資料：係數穩定性界限需要一個可信的「加入控制變數前後係數如何移動」的序列，而單一橫斷面問卷的可觀測控制變數本來就少，診斷力有限。二是反向因果沒有被處理：已經在做破壞式創新的新創，更可能去申請補助，也更可能申請成功，而樣本選擇模型處理不了這種同時性。三是調節變數的測量爭議：專有化在文獻裡至少有三種操作化——正式智財、非正式手段、互補資產，三者作用完全不同，而早期新創幾乎沒有互補資產，合成量表的變異主要來自前兩者。\n\n那麼，如果要重現並且改進這項研究，該怎麼做？\n\n第一步，換資料來源。這是最關鍵也最貴的一步。不要用問卷測補助。改用補助機關的官方申請與核定名冊，把受補助企業與未受補助的申請者串起來。這一步立刻把「是否受補助」從自陳變成行政事實，而且創造出最有價值的比較組——申請但沒拿到的人。他們的申請意願已經被控制住了。\n\n第二步，因變數改成可以外部驗證的破壞性指標。可行的路有三條：用技術重組不確定性，也就是專利分類組合的過往共現頻率；用顛覆指數，衡量一項創新是鞏固還是顛覆既有的引用結構；或者用市場軌跡資料，也就是初始定價相對於主流產品的折價幅度，加上首批客戶是不是既有市場的非消費者。第三條最貼近原始定義，但資料最難拿。建議至少做前兩條，互相檢證。\n\n第三步，把專有化拆成三塊，不要合成單一量表。正式智財用專利與商標的實際申請紀錄，非正式手段用產業層級的專有化有效性調查對映到樣本，互補資產用製造設備投資、通路合約數與品牌註冊。三者分別進交互項。如果三者的調節方向不同——而這很可能發生，非正式手段最強、互補資產在新創身上根本沒有變異——那個結果本身就是一篇論文。\n\n第四步，因果識別用斷點或錯開導入。多數補助方案有明確的評分門檻，這給了一個尖銳的斷點設計：比較評分剛好在門檻上下的申請者。如果沒有評分資料，就找補助方案在地理或產業上的錯開導入時間，做交錯式的差異中之差異。要注意的是，在處理效果異質的情況下，傳統的雙向固定效果估計量是有偏的，要用近年發展的穩健估計量。\n\n第五步，把係數穩定性界限用在對的地方。保留這個分析，但要先有足夠的可觀測控制變數序列才有診斷力。回報數值的時候明確寫清楚：這是敏感度分析，不是因果識別。這一點非常重要，因為這個工具最常見的誤用，就是把它當成因果宣稱的許可證。\n\n第六步，處理反向因果與政治連結。加入補助前一期的創新產出當預測變數，檢驗是不是已經在做破壞式創新的新創更容易拿到補助。同時測量政治連結——創辦人有沒有公部門經歷、企業有沒有國有股東。在新興市場的脈絡下，這往往才是補助分配的真正機制。如果政治連結解釋了大部分的補助分配，那選擇方程沒有它就是設定錯誤。\n\n【今日快訊】\n\n以下是今天另外二十三篇的快速報導，依主題分群。\n\n先說科學計量與研究評鑑這一群。Scientometrics 有一篇把大型語言模型當成分面向的審稿人，不給總分而是分別對新穎性、正確性、清晰度評分；要注意的是人類審稿人之間的一致度長期只有零點三上下，效標的信度就是模型效能的天花板。同一本期刊還有一篇引文功能排序框架，用成對比較把引用依功能重要性排序，設計上承認了人類在絕對評分不可靠、在相對比較才可靠這件事。另一篇把跨領域性的測量單位從整篇論文降到章節層級，用可解釋機器學習檢驗它與新穎性、顛覆性的關係——最有意思的直覺是，方法章節的跨領域可能才是真正驅動顛覆性的來源，而引言的跨領域往往只是修辭。還有一篇比較八種主題模型，詞袋派對上嵌入派，這類基準測試論文的可信度全在有沒有對自己不偏好的方法也做充分調參。Journal of Informetrics 有一篇把新穎性拆成源生的與輸入的兩種來源，重新檢驗它與學術影響力的關係——把一個既有指標拆成兩個有理論意義的子類，往往比發明第三個指標更有價值。Scientometrics 還有一篇分析秘魯、哥倫比亞、委內瑞拉三個南美邊陲國家的科學流動，主張對這些國家而言「人才外流」比「人才循環」更貼切，因為循環這個詞預設了雙向流動的對稱性。另外還有一篇用南韓國家科技資訊系統的六萬三千三百零五件計畫、五百九十三個行動者、二百二十二個科技領域的資料，建構了一個能力導向的行動者空間，發現大學與企業之間存在能力組成的錯配，而跨類型的連結主要由研究組合的相似度而不是機構類別決定。\n\n接著是創新與創業這一群。Journal of Product Innovation Management 有一篇後設分析，綜合七十一篇研究、一千零八十九個效果量，量化新產品發布事件對股價的影響。平均累積異常報酬是百分之零點七，但異質性極大。最強的調節變數是消息來源：由獨立第三方發布的產品消息，累積異常報酬比公司自己發布高出二點六個百分點。實務結論很鋒利——公司自己發的新聞稿在市場上不值錢，第三方確認才值錢。同一本期刊另一篇比較金融危機期間成立與穩定期成立的科技新創，結果是危機期成立的新創專利數少了約百分之四十七，但突破性發明多了百分之二百一十二；營運職位佔比下降百分之十七點四，發布產品數減少百分之二十四點八。要注意的是配對只能平衡可觀測特徵，平衡不了「為什麼這些人選擇在這個時點進場」。Research Policy 有一篇處理熊彼得理論與實證的衝突：創造性破壞預測創新是反景氣循環的，實證卻顯示順循環。作者提出門檻報酬率理論，並用州層級研發稅額抵減的交錯變動做因果識別，結論是景氣差時創新的量下降但質上升——這是調和型論文的教科書寫法。\n\nTechnovation 今天有五篇。一篇把「訓練人工智慧」本身當成設計決策來研究，用計算模擬比較三種訓練策略，結果是把專家回饋跨週期回收再用的策略產生可移植的模型，把人類專業脫鉤的策略則過早收斂到狹窄的解空間。一篇研究創新失敗與商業信用的非線性關係，提醒各位二次項顯著不等於有轉折點，要做正式的形狀檢定。一篇是歸納式多重個案，看三家中國整合型國有企業如何回應正當性與自主性的張力，發現目標設定階段用總量投射、資源配置階段用平行協調兩種策略；但三個個案都是成功案例，缺少反例就無法排除事後合理化。一篇檢驗仲介位置什麼時候才轉成創新，答案是要看個人對自己權力的感知——結構優勢不會自動變成行動，中間有一個心理啟動條件。還有一篇分析文化創意產業一百二十六種職業、五百九十三項任務的人機創造力邊界，混合類佔百分之八十六點三，替代類只有百分之二點七；但它用大型語言模型產生合成標註，而摘要沒有交代與人工標註的一致度驗證。同一本期刊另有一篇公司分割研究，樣本是四個高科技產業的九百一十九家企業、一千七百九十四件分割案、四十一萬四千一百二十八件專利，最值得學的是它報告了調節效果的有效區間而不只是交互項係數。\n\n最後是政策與數位轉型這一群。European Journal of Innovation Management 有一篇用寬頻中國與智慧製造兩項政策當準自然實驗，做差異中之差異加雙重機器學習，發現政策順序有影響——先寬頻、後智慧製造比反過來更有效。同一本期刊另有一篇談主管完美主義對員工創新的雙刃效果，三百零四份中國問卷，兩條序列中介路徑並存；但單一時點單一來源的資料撐不起四個構念的因果鏈。Technology Analysis and Strategic Management 有一篇用中國上市公司二零一零到二零二三年的資料看數位轉型與綠色創新，發現技術驅動型的效果強於應用驅動型；要留意的是用年報詞頻建構的數位轉型指數，測到的可能是敘事而不是行為。Technology in Society 有一篇研究南韓內容產業的智財流通、平台依賴與政策協奏，這個題目的關鍵在於有沒有訪談到創作者端而不只是平台與主管機關端；另一篇研究生成式人工智慧對永續消費的影響，標榜互補分析取向，但要提醒的是，對同一份資料跑兩種演算法並不叫三角驗證。Technological Forecasting and Social Change 則有一篇沉浸式技術的書目計量回顧，這類論文的可信度全在檢索式與聚類參數的透明度。\n\n【今日可教的一課】\n\n今天要講的原則是：參考文獻會洩漏你的研究設計，也會洩漏你沒做的事。\n\n先講前半句。今天第三則那篇論文，摘要在資料庫裡是空的，我們原本什麼都不知道。但它的參考文獻同時出現了三筆東西：模型適配指標的門檻、共同方法偏誤的兩篇、以及收斂效度與區辨效度的判準。這三筆一起出現，等於作者親口告訴你：我的資料是問卷，我用潛在變數模型，而且我知道你會問共同方法偏誤。你不必看摘要，光看引用就能重建整個方法設計。\n\n再講後半句，這才是真正該教的。今天第二則那篇論文，引了 Harrison 與 Klein 的多樣性三型分類，也引了 Joshi 與 Roh 的脈絡調節後設分析。這兩筆引用等於在說：我知道多樣性要拆開來看，我也知道怎麼做後設分析。可是他們手上有一百四十九筆文獻，卻只產出一個概念框架，沒有把那一百四十九篇依三型分類編碼一次。這就是「引了卻沒做」。而引了卻沒做，比根本沒引更糟——因為沒引，你可以說你不知道；引了，你就是知道而選擇不做。審稿人只要看到那筆引用，就會問你為什麼不做，而你沒有好答案。\n\n要對學生怎麼說呢？可以這樣說：你的參考文獻清單，是一份你自己簽名的承諾書。你引了一個方法，就等於承認你知道它存在，也承認它與你的問題相關。如果你不打算做，那就不要引；如果你要引，那就準備好回答「為什麼你沒做」。寫完初稿之後，回頭把每一筆重要引用列出來，在旁邊寫一句：這篇在我的論文裡承擔什麼工作。凡是寫不出工作的，要嘛刪掉，要嘛就去把那件事做掉。\n\n我們建議把這一則補進論文寫作手冊的「文獻定位」那一章，跟既有的「引了卻沒做，比沒引更糟」放在一起，因為今天這兩篇剛好給了它一個正反面的完整範例：一篇示範了引用如何洩漏你做了什麼，一篇示範了引用如何洩漏你沒做什麼。\n\n【今日總結】\n\n今天三篇論文，表面上分別談性別、談群體組成、談政府補助，但它們有一個共同的主題：每一篇都引進了一個對的框架，然後在操作化那一步鬆掉了。第一篇引進了地位這個競爭性解釋，卻用被引用次數這把有偏的尺去量。第二篇引進了多樣性的三型分類，卻沒有拿它去編碼手上的文獻。第三篇引進了專有化這個調節概念，卻可能把三種完全不同的機制合成一個量表。框架是對的，工具跟不上。\n\n如果今天只帶走一句話，那就是：想清楚一個構念，和量準一個構念，是兩件需要分開投入的工作，而後者往往才是決定一篇論文天花板的地方。\n\n午班到此結束。晚上八點，我們晚班再會。"

   "podcast": "【每日學術新聞　二零二六年八月九日　晚班】\n\n各位聽眾晚安。這裡是每日學術新聞晚班節目。我們每天追蹤十五本科學計量學與創新管理領域的期刊,從最新出版的論文裡挑出三則,先報導內容,再請專家分析。今天的三則,全部是昨天、也就是八月八日剛剛上線的新論文,一則也不是舊聞。兩則來自 Scientometrics,一則來自 Technological Forecasting and Social Change。\n\n第一則。〈參考文獻的重複,正在悄悄壓低所有人的引用指標〉。\n\n這篇論文八月八日發表在 Scientometrics 期刊,標題翻譯過來是:一套用於書目計量分析的多階段參考文獻比對演算法,包含設計、實作與評估。作者是義大利拿坡里費德里克二世大學的 Massimo Aria、Luca D'Aniello 與 Maria Spano。\n\n他們處理的問題,是整個書目計量學最底層、卻最少被檢查的假設。我們計算一個學者的 h 指數、計算一本期刊的影響力,前提都是資料庫裡同一筆被引用的文獻只出現一次。但實情不是這樣。同一篇被引用的論文,可能因為期刊縮寫的寫法不同、作者姓名格式不同、標點不同、後設資料的完整程度不同,而在資料庫裡分裂成好幾個不同的紀錄。引用連結因此斷開,指標被系統性地壓低。\n\n作者提出的解法,是一條不需要訓練資料的多階段比對管線,總共七個階段。第一階段是格式偵測與字串正規化,把各種引用格式解析開來,統一姓名、標題與頁碼的寫法。第二階段是期刊名稱正規化,把縮寫名與全名都對應到同一個標準短名,依據的是國際標準組織第四號標準的期刊標題字詞縮寫表。第三階段是精確比對,先用數位物件識別碼,再用正規化後的字串。第四階段叫做封鎖,用第一作者的姓氏加上出版年份,把海量的紀錄先分成小組,只在組內做昂貴的兩兩比較。第五階段是區塊內的模糊比對,用一種特別適合人名的字串相似度指標,搭配由下而上的階層分群,把近似重複的紀錄聚成一群。第六階段把同一群紀錄裡互補的欄位合併起來。第七階段選出資訊量最大的那一筆,作為這一群的代表。\n\n評估分成兩層。第一層是合成基準:研究者自己造出一千零六十四篇來源文獻,施加十七種受控的擾動情境,因為正確答案是自己設定的,所以精確率、召回率與 F1 分數都可以精確計算。結果是,十七種情境裡有十五種,三項指標都在零點九五以上;表現最差的兩種情境,F1 分數也還有零點七八以上。\n\n第二層是真實資料。他們用兩組來自 Scopus 資料庫的實際資料驗證,合併變體之後,唯一被引用文獻的數量下降了百分之四點六到百分之十一點一,而以集中度為基礎的書目計量指標則同步上升。換句話說,資料清理不是中性的動作,它會改變你算出來的集中度結論。\n\n作者群的定位很清楚。這條管線已經內建在一個被廣泛採用的開源統計軟體套件裡。摘要沒有點名是哪一個,但通訊作者本人就是知名書目計量套件 bibliometrix 的作者,而這篇論文被引用次數第二高的參考文獻,正是 bibliometrix 的原始論文。這篇論文引用了三十筆參考文獻。\n\n第二則。〈在哥倫比亞,搬家的研究者沒有升得比較快〉。\n\n這篇同樣在八月八日發表於 Scientometrics。標題是一句問句:我該留下,還是該離開?副標題列出了國內地理流動、性別、年齡、機構研究輪廓與勞動市場,如何影響哥倫比亞科學人力的職涯表現。作者有四位:哥倫比亞伊巴格大學的 Jesús María Godoy Bejarano、義大利 Mercatorum 大學的 Giovanni Abramo、羅馬第二大學的 Ciriaco Andrea D'Angelo,以及哥倫比亞羅薩里奧大學的 Julián David Cortés-Sánchez,最後這位是通訊作者。\n\n這篇的問題意識,建立在一個文獻空白上。學術流動一直是科學政策的核心議題,但過去的研究幾乎都在談國際流動或跨國移民,對中等所得國家內部的流動幾乎沒有著墨。而國內流動的成本結構、制度誘因,和國際流動完全不同。\n\n資料來自哥倫比亞科學技術創新部的公開行政資料,涵蓋二零一三年到二零二一年之間的六次評鑑徵集,總共四萬零四百八十五筆研究者與評鑑的觀察值。被解釋的變數是研究者的等級,分成初級、副級與資深三個層次;主要的解釋變數是一個城際搬遷的二元指標,再加上一組落後一期的個人、制度與脈絡共變量。\n\n模型是有序邏輯迴歸。這裡有一個值得注意的技術轉折:作者檢定了比例勝算假設,結果被拒絕,因此他們改採不受限的設定,允許同一個變數在不同門檻上有不同的效果。這一步的實質意義是,從初級升到副級,和從副級升到資深,是兩個不一樣的機制,不能用同一組係數描述。\n\n發現分成三層。第一,城際流動非常罕見,只影響了百分之二點七的觀察值,而且集中在職涯早期的研究者。第二,流動並沒有加速晉升;相反地,它和等級的不穩定相關,對初級與副級研究者尤其明顯。第三,機構層面學術資本的集中程度,是晉升的強力相關項,這和累積優勢的預期一致。\n\n最後還有一個方向性的轉折:等級不穩定主要出現在搬往較小城市的情形;搬往較大都市中心的研究者,沒有出現可以相比的懲罰。這篇論文引用了三十五筆參考文獻。\n\n第三則。〈把數位專案說成威脅還是機會,效果要看聽的人想得多遠〉。\n\n這篇八月八日發表在 Technological Forecasting and Social Change,標題是:塑造對數位創新專案的承諾,威脅與機會框架和解釋水準的交互作用。作者有四位:Julian Bauer、任教於法國格勒諾布爾管理學院的 Fiona Schweitzer、Tobias Röth,以及任職於奧地利科技研究院與格拉茲大學的 Karl-Heinz Leitner。\n\n這裡必須先做一個說明。這篇論文目前在 OpenAlex 資料庫裡沒有摘要,而且不是開放取用。因此接下來的內容,是根據標題、作者群、以及一百一十七筆參考文獻的結構所做的推論,不是論文自己說的話。樣本數、操作方式與統計結果,我們一概不知道,也不會在這裡編造。\n\n能確定的是問題意識:數位創新專案的承諾,如何被塑造?以及,把專案講成威脅、還是講成機會,這兩種說法的效果,會不會被聽的人的心理距離所改變?\n\n這個提問有很實在的痛點。數位創新專案的特徵是回報遙遠、不確定性高、需要跨部門的資源承諾。因此管理者會不會持續投入,往往取決於他們怎麼詮釋這個專案,而不是專案的客觀參數。而把它說成不做就會被淘汰,或者說成做了能開創新局,是組織裡最常見、也最廉價的干預手段。\n\n從參考文獻可以看到兩個理論引擎。第一個是框架效應與威脅僵化。Tversky 與 Kahneman 一九八一年的經典研究說明,把同一個問題描述成獲得或損失,會反轉人的風險偏好。而 Staw、Sandelands 與 Dutton 同樣在一九八一年提出的威脅僵化效應則指出,組織面臨威脅時會出現資訊處理的收縮與控制的集中,對創新是負面的。請注意,這兩個理論的預測方向是相反的。\n\n第二個引擎是解釋水準理論。Trope 與 Liberman 指出,心理距離愈遠,人們愈用抽象的方式思考,關注的是為什麼、以及這件事值不值得做;距離愈近,愈用具體的方式思考,關注的是怎麼做、以及做不做得到。\n\n把這兩個引擎放在一起,可以推論本文的核心命題是一個交互作用:同一個框架,在不同的解釋水準下,會產生不同程度的承諾。這篇論文引用了一百一十七筆參考文獻,數量相當可觀。\n\n【專家回應　第一則　〈參考文獻比對演算法〉】\n\n這篇論文最聰明的地方,是把一個看不見的偏誤變成了一個可以測量的量。資料很髒,這句話人人會說,但幾乎沒有人給得出誤差率。作者用受控擾動自己造出正確答案,於是可以說出十五個情境 F1 超過零點九五這樣的話。這一步的價值不在演算法本身,而在於他建立了一個靶場,別人可以拿這個靶場來打自己的方法。方法論論文取得長期引用,靠的往往就是這件事。\n\n但最致命的缺口,在於引用了卻沒有做。在被引用最多的參考文獻裡,有兩篇跨資料庫的比較研究:一篇比較了 Google Scholar、Scopus 與 Web of Science,另一篇是萊頓大學團隊橫跨五個資料源的大規模比較。引用這兩篇,等於承認不同資料庫的引用格式問題不一樣。既然如此,最自然的推論就是,這套演算法在不同資料庫上的表現會不同。可是真實資料的驗證,只有兩組 Scopus 資料集。跨資料庫的外部效度,就是宣稱和證據之間最明顯的落差。\n\n還有第二個引用了卻沒做的地方。參考文獻裡有一九六九年那篇記錄連結的理論奠基之作,那個框架的精髓在於,每一個配對都會得到一個機率,你可以據此推導誤差率的上界,還可以留下一個交給人工判斷的灰色地帶。但本文的管線是決定論式的,只有相似度門檻和分群,沒有機率,也沒有待判區。結果就是,下游的使用者無法回答一個很自然的問題:你算出來的這個 h 指數,不確定範圍有多寬?\n\n次要的問題有三個。第一,百分之四點六到百分之十一點一的合併率,沒有真值可以校準,我們不知道這些合併裡有多少是誤合。第二,合併之後集中度指標上升,這在數學上幾乎是必然的,把分散的引用歸併到同一個節點,集中度本來就會上升,所以這不算發現。第三,論文沒有報告門檻與分群連結準則的敏感度分析,而這兩個參數對結果的影響,往往比相似度指標的選擇還大。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,換戰場。同樣一批論文,分別從 Crossref 與 OpenAlex 取得參考文獻清單,跑同一條管線,比較合併率的差異。如果三個來源的合併率差距明顯,原文的外部效度宣稱就必須收斂。\n\n第二步,把合併正不正確變成可以標註的量。從真實資料的合併結果裡,依相似度分成五層,每層抽一百組,由兩位標註者獨立判斷是不是真的同一筆文獻,然後計算標註者之間的一致性係數,以及每一層的假陽性率。這一步是全篇最大的缺口,補上它,說服力會完全不同。\n\n第三步,做一個機率式的對照組。既然引用了記錄連結的理論,就真的實作一個機率式連結器,輸出每個配對的後驗機率,和現在的決定論式管線正面比較。如果決定論式的做法在準確度上不輸、速度又快很多,那才是站得住腳的貢獻。\n\n第四步,處理集中度上升的方向性問題。對同一批資料做三種處理:正確合併、隨機合併但合併次數相同、以及完全不合併,然後比較三者的集中度指標。如果正確合併和隨機合併的位移沒有差別,那就說明位移來自合併的次數,而不是合併的品質。這個替代解釋原文沒有排除。\n\n第五步,對三個維度做網格掃描:相似度門檻、分群的連結準則、封鎖的鍵值。輸出一張熱圖,標示原文的設定落在哪裡。如果最佳區域很窄,實用性要打折;如果很寬,那反而是強而有力的辯護。\n\n第六步,也是價值最高的一步:量測清理對科學地圖的下游效應。取一個既有的共被引分析,分別在清理前後建立網路,比較兩次分群的一致性。如果一致性明顯偏低,那就等於證明了未經清理的科學地圖是不可靠的。這個宣稱,比集中度指標上升強得多。\n\n【專家回應　第二則　〈哥倫比亞研究者的國內流動〉】\n\n這篇最聰明的地方是選址。它一次換掉了三個邊界條件:從國際換成國內、從高所得國家換成中等所得國家、從菁英樣本換成全體註冊研究者。而且用的是全國性的行政資料,不是抽樣調查。四萬多筆觀察值加上六個時點,在拉丁美洲的科學計量研究裡是罕見的規模。\n\n技術上最值得稱讚的,是檢定了比例勝算假設,發現被拒絕之後,誠實地改用不受限的設定。多數作者會忽略這個檢定結果,照樣報一組漂亮的係數。承認門檻異質,代價是係數數量倍增、解釋變得吃力,但這是誠實的代價。\n\n然而最致命的缺口,同樣是引用了卻沒有做。參考文獻裡有兩篇網路科學的經典,是關於科學合作網路結構的。引用它們,通常意味著作者心裡想的機制是:搬家會切斷合作關係,合作網路的斷裂才是懲罰的來源。可是摘要裡看不到任何網路變數。於是流動造成不穩定,這個結論的機制仍然是個黑盒子:究竟是合作斷裂?是資源損失?還是評鑑規則對新進成員不利?這三種解釋在目前的設計下無法區分。\n\n更根本的問題是因果識別。流動率只有百分之二點七,處理組非常小,而且高度自我選擇。有序邏輯迴歸加上落後共變量,無法排除一個非常自然的反向解釋:會搬家的人,本來就處在職涯不穩定的狀態,例如合約到期、沒有續聘,搬家是結果而不是原因。作者的措辭很謹慎,一直用相關、關聯這類字眼,但讀者和政策制定者不會那麼謹慎。\n\n次要的問題有三個。第一,不穩定這個結果變數混合了降級、退出、暫停三種完全不同的事件,應該用競爭風險或多狀態模型分開處理。第二,既然引用了城市尺度律,城市規模就不該只用較大或較小的二分法,而應該當成連續變數,甚至用相對於規模預期的殘差來衡量地方科研生態的強度。第三,標題承諾了性別、年齡、機構輪廓與勞動市場四組因素,但摘要的發現裡幾乎只剩下流動與機構集中度,標題與交付之間有落差。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,把重複的橫斷面接成研究者層級的面板。以個人為單位建立長格式資料,標記每個人的進入、退出、等級軌跡與機構軌跡,並且明確記錄誰在哪一輪消失了。沒有這一步,後面的固定效果與事件研究都做不了。\n\n第二步,把流動從一個二元指標拆成多個維度:移動的距離、目的地城市規模的對數、以及機構研究性質的改變。同時要盡量區分主動流動與被動流動,例如用合約到期、機構降級、機構關閉作為代理。\n\n第三步,改用能吸收個人異質性的模型。首選是個體固定效果,把不隨時間改變的能力與雄心吸收掉。如果等級變動太少導致識別力不足,就退而求其次做事件研究:以搬家那一年為零點,估計前後各三期的等級變化,檢查搬家之前的趨勢是不是平的。搬家前的趨勢,就是反向因果最直接的檢驗。\n\n第四步,做配對,再找外生衝擊。先用傾向分數或粗化精確配對,在搬家前的產出軌跡、年齡、性別、機構性質上把流動者與非流動者配起來。再去找機構關閉、系所裁撤這類被迫遷移的事件當作準實驗。兩層結果一致,關聯才能升級成效果。\n\n第五步,做四組穩健性檢定:排除首都波哥大之後重估;依職涯階段分層;依學科大類分層;把結果變數換成論文數與被引分位數。如果搬往小城市有懲罰這個結論,在排除波哥大之後就消失了,那真正的發現是首都的集聚優勢,整篇的框架必須改寫。\n\n第六步,主動去找流動有利的次群體。理論上應該存在:從教學型機構搬到研究密集機構的人、搬家同時伴隨升遷聘任的人。如果找到了,整篇的敘事就從流動沒用,變成流動的報酬取決於目的地的資源密度。後者理論上更有力。\n\n第七步,把合著網路變數接進來。計算搬家前後兩年的合作者留存率、新合作者數量、以及網路中心性的變化,當作中介變數放進模型。如果中介效果顯著,不穩定就有了機制解釋,而不只是一個統計關聯。\n\n【專家回應　第三則　〈威脅框架、機會框架與解釋水準〉】\n\n再次提醒,這一則的分析是建立在參考文獻結構上的推論,不是論文的自述。\n\n這篇最聰明的地方,是找到了兩個成熟理論的矛盾點。框架理論預測,損失框架會提高風險承擔;威脅僵化理論預測,威脅會降低探索與創新。兩個預測方向相反,長期並存,卻很少有人正面處理。用解釋水準當作調節變數去調和它們,這是一個結構完整的理論貢獻設計:不是加一個新變數,而是解釋一個既有的矛盾。這種設計在創新管理與組織行為的期刊都吃得開。\n\n但最致命的缺口,在於結果變數與操弄效度。承諾這個詞可以指意圖,可以指資源配置,也可以指面對壞消息時的持續投入。如果測的是自陳的意圖,那它離真實的資源決策非常遠。而解釋水準的操弄在管理情境裡特別脆弱:心理學常用的操弄是時間距離,可是把下週改成明年,同時改變了折現、不確定性與可歸責性,也就是說,一次動到了三個構念。沒有操弄檢核,交互作用的解釋權就會被質疑。\n\n還有一個引用了卻沒有做的地方,而且相當關鍵。這篇的結果變數是承諾,可是在被引用最多的參考文獻裡,只看到 Staw 的威脅僵化那一篇,看不到他更著名的承諾升級研究。承諾升級講的是,決策者會對已經失敗的路線持續加碼,原因是自我辯護與沉沒成本。在創新專案的脈絡裡,承諾究竟是美德還是病理,這是繞不開的問題。同樣看不到的,是真實選項與階段性投資的文獻,而那正是實務上處理遠期不確定專案的主流框架。\n\n次要的問題有兩個。第一,一百一十七筆參考文獻對一篇實驗導向的論文而言偏多,通常意味著理論鋪陳很長,風險是導論承諾了太多構念,而實證只檢驗其中一小塊。第二,交互作用的偵測需要的樣本量,遠大於主效果,如果沒有事前的效力分析,顯著的交互作用很可能是偽陽性。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,先取得正文。這篇不是開放取用,而且資料庫裡沒有摘要。在看到樣本、操弄與測量之前,不應該把任何關於它的敘述當成事實。如果作者已經做了操弄檢核與預先註冊,以下的多數建議就從修正變成延伸。\n\n第二步,把承諾從態度改成行為。設計一個資源配置任務,給受試者固定的虛擬預算和幾個可投入的專案階段,測量他配置給這個數位專案的金額,以及在收到中期壞消息之後的追加或撤資金額。金額是連續的、可比較的,而且和真實決策同構,遠優於七點量表上的意圖題。\n\n第三步,做一個二乘二乘二的預先註冊實驗。框架分成威脅與機會,解釋水準分成高與低,再加上第三個因子:回饋是正向還是負向。第三個因子的作用,是把承諾升級納進來。只有加入負面回饋,才能區分承諾是初始熱情,還是升級病理。\n\n第四步,做嚴格的操弄檢核。解釋水準操弄之後,立刻測抽象程度;框架操弄之後,測感知的得失方向與情緒喚起。關鍵是要證明:框架沒有改變抽象程度,解釋水準沒有改變感知風險。如果兩個操弄互相污染,交互作用就無法歸因於理論機制。另外要加一組中性框架當基線,才能判斷效果是威脅推動的,還是機會推動的。\n\n第五步,處理效力與樣本。事前做效力分析決定樣本量,交互作用假設下每一格至少要一百五十人,而且要在論文裡報告計算過程。同時跑學生樣本與具有預算決策權的管理者樣本,把外部效度直接變成一個實證問題,而不是限制節裡的一句道歉。\n\n第六步,主動設計會讓預測反轉的條件。例如高度時間壓力、公開承諾、以及更換決策者。如果威脅框架的效果在更換決策者之後消失了,那機制就是自我辯護,而不是風險偏好。這會實質改寫理論貢獻。\n\n第七步,把單次承諾改成三期的序列決策,每一期揭露一部分不確定性,受試者可以加碼、維持或撤資。分析的重點就從水準值移到軌跡的形狀。這樣可以同時回答兩個問題:框架影響的是起始的承諾,還是後續的調整速度?解釋水準影響的是值不值得做的判斷,還是對壞消息的反應?\n\n【今日總結】\n\n今天三則新聞,表面上一則談演算法、一則談職涯、一則談心理框架,但它們共享同一個主題:<b>我們用來下判斷的那個東西,本身有多可靠?</b>\n\n第一則說,你算出來的引用指標,取決於資料清理的品質,而清理從來不是中性的。第二則說,你觀察到的流動與晉升的關聯,取決於你有沒有處理選擇效應,而處理與否會改變政策結論。第三則說,管理者對專案的承諾,取決於這件事被怎麼講,而怎麼講是可以被操弄的。\n\n三篇論文各自都有一個引用了卻沒做的缺口:第一篇引了跨資料庫比較,卻只在單一資料庫驗證;第二篇引了合作網路,卻沒有測量網路;第三篇引了承諾的組織理論,卻可能只測了態度。這不是偶然。<b>參考文獻是作者對自己的承諾,而審稿最有效的一招,就是檢查這些承諾有沒有被兌現。</b>\n\n今天的每日學術新聞晚班就到這裡。明天早上,我們再會。"

   "podcast": "【每日學術新聞　二零二六年八月九日　午班】\n\n歡迎收聽每日學術新聞午班。今天為您帶來三則研究報導,以及三段專家回應。其中兩篇是前天才上線的新論文,分屬三本不同期刊。\n\n【第一則　自動化、組織創新,與薪資的互補效果】\n\n第一則來自《技術預測與社會變遷》,上線日期是八月七日。作者是愛沙尼亞塔爾圖大學的普斯托瓦洛娃與瓦赫特。\n\n這裡要先聲明一件事。開放學術資料庫尚未提供這篇的摘要,所以以下的說明是依據標題、主題分類、作者機構,以及三十八筆參考文獻的結構推斷,不代表原文的陳述。\n\n研究問題是:自動化與組織創新這兩件事同時發生時,對員工薪資的影響是相加的,還是互補的?而社會技能在其中扮演什麼角色?\n\n從參考文獻可以清楚看出理論骨架。米爾格羅姆與羅伯茨一九九五年談製造業中策略、結構與組織變革互補性的那篇,是互補性這個概念的正統來源。它的核心主張是:兩種做法同時採用的效果,大於各自單獨採用的加總。\n\n自動化那一端,錨在艾塞默魯與雷斯特雷波二零一九年的〈自動化與新任務〉,以及他們二零二一年的〈人口結構與自動化〉。社會技能那一端,錨在戴明二零一七年的〈勞動市場中社會技能日益重要〉。\n\n三塊拼在一起,推測的假設是:自動化本身可能壓低某些薪資,但當它與組織創新互補、而且員工具備社會技能時,效果會翻轉。\n\n作者群來自愛沙尼亞。這一點很關鍵。愛沙尼亞有完整的雇主與受僱者連結行政資料,是歐洲少數能把個人層級薪資與企業層級創新變數對接的國家之一。\n\n【第二則　競合組合的組態,以及大學與供應商的配對條件】\n\n第二則來自《Technovation》,日期是八月五日。作者群橫跨阿姆斯特丹自由大學、蒙彼利埃商學院與馬斯垂克大學。\n\n問題意識很具體。企業會同時與多種夥伴結盟,包括競爭對手。這種包含競爭者的聯盟組合,稱為競合組合。競爭者能提供互補又相容的資源,但也可能與其他夥伴產生衝突。那麼,在哪些夥伴類型的組合下,產品創新才會發生?\n\n資料是九百二十一家荷蘭企業,期間從二零一零年到二零一六年。方法採用明確集質性比較分析。\n\n第一個發現:與競爭者結盟,必須搭配與客戶的聯盟,才會促成產品創新。單獨的競合關係不夠,需要客戶端提供需求資訊來引導。\n\n第二個發現更有意思,是一個組態條件。當組合中存在與大學的連結時,供應商也必須同時在場,新產品才會被推出。換句話說,大學提供的知識,需要供應商的製造能力才能落地。\n\n第三個發現是邊界條件:導向產品創新的競合組態,會隨焦點企業的規模與產業動態而變化。\n\n【第三則　把評審權交給社群的衛教素材共同評估】\n\n第三則來自《健康研究政策與體系》,同樣是八月七日上線,開放取用。研究場域在坦尚尼亞。\n\n這篇切在一個少被處理的縫隙。公眾參與健康傳播設計的重要性已被廣泛承認,但關於社群,特別是身心障礙者,如何在低資源環境中主動擔任評審與驗證創意衛教素材的角色,所知甚少。\n\n做法是舉辦全國性競賽,邀請在地藝術家製作短篇動畫與語音廣播劇,用來傳達關鍵的眼睛健康訊息。創作端直接交給在地。\n\n評審環節是核心。十四位評審與十七位工作坊參與者,依十項準則評估投稿作品,之後對前三名進行驗證,檢視訊息的包容性、可理解性與有效性。\n\n結果分兩層。素材層面,建議包括加上字幕、手語與更清楚的視覺呈現;參與者也建議作品應更貼近坦尚尼亞的生活現實。過程層面,參與式的評審營造了包容感與擁有感,評審表示感到有自信、被重視、且自在。\n\n六位作者中有四位來自坦尚尼亞,包含三位在地非政府組織的實務工作者。\n\n【專家回應　第一則　互補性的檢定標準】\n\n先講這篇最值得注意的地方,而它藏在方法論的引用裡。\n\n這篇同時引用了三篇東西:粗化精確配對的原始文獻、它的統計軟體實作,以及金恩與尼爾森二零一九年那篇〈為什麼傾向分數不該用於配對〉。\n\n這個組合不是隨手引用,是立場宣示。作者刻意拒絕了傾向分數配對,選擇粗化精確配對。這是一個有立場的方法選擇,不是預設值。\n\n那個爭論你應該知道。金恩他們證明,當傾向分數配對持續刪除觀測值以求平衡時,超過某一點之後,再刪反而會增加不平衡。原因是傾向分數把多維共變數壓縮成一維,丟失了維度資訊。這被稱為傾向分數悖論。\n\n但選擇粗化精確配對也有代價。粗化的切點是研究者選的,而且維度一多就會有大量樣本失去配對而被丟棄。既然作者刻意選了這條路,審稿人一定會要求看粗化方案的敏感度分析。\n\n第二個問題更根本。互補性的檢定標準,比一般的交互作用嚴格得多。\n\n超模性的正式檢定要求的不只是交互項顯著,而是要在整個變數空間上滿足遞增差異的條件。管理學論文常把交互項為正直接說成互補,這是常見的過度延伸。而這篇引了米爾格羅姆與羅伯茨,就會被用那個標準檢視。\n\n還有一個技術問題,是跨層級設計的群集結構。薪資是個人層級的結果,但自動化與組織創新是企業層級的處理。同一企業內的員工誤差項必然相關。忽略這一點,標準誤會被低估、顯著性會被高估。這是跨層級研究最常見、也最容易被抓的缺陷。\n\n那麼,如果要重現並且改進這項研究,該怎麼做?\n\n第一步,先把互補性的檢定標準講清楚,再談結果。在方法章節明確說明你檢定的是哪一種:是回歸中的交互項為正,還是超模性的遞增差異條件,或是績效函數的二階交叉偏導。若只能做第一種,就用交互效果而不是互補性的措辭。\n\n第二步,把粗化方案做成敏感度分析。對每個連續共變數設定粗、中、細三種方案,交叉組合後重跑主要模型,把係數的分佈畫成一張圖,同時報告每種方案下的不平衡度量與樣本損失比例。\n\n第三步,社會技能改用任務基礎的指標。戴明用的是職業任務資料,不是自陳問卷。若愛沙尼亞的職業編碼可以對映到國際標準職業分類,這個轉換的成本並不高,而好處是能與英美文獻直接比較。\n\n第四步,處理群集結構。最低標準是企業層級的群集穩健標準誤;若企業數少於五十,改用 wild cluster bootstrap;更好的做法是多層次模型。\n\n第五步,找一個外生衝擊來強化識別。粗化精確配對處理的是可觀測的選擇偏誤,但自動化採用本身是策略選擇,受未觀測的管理品質影響。可用的變異包括機器人價格的國際變動,或用雷斯特雷波式的暴露測度——產業自動化率乘以企業初始產業結構——構造工具變數。\n\n第六步,把三向交互的檢定力誠實報告出來。自動化乘以組織創新乘以社會技能,若真的做到三階交互,樣本需求會非常大,結果通常也不穩定。事前做檢定力模擬,若不足就誠實改用分組比較,並說明這是描述性的。\n\n【專家回應　第二則　為什麼是明確集】\n\n這篇最有價值的發現,不是主效果,而是那個組態條件:有大學連結時,供應商也必須在場。\n\n這個發現說明了知識來源與實現能力必須配對。比起「多元合作有益」這種已知結論,它具體、反直覺,而且有明確的實務含意。這正是組態方法應該產出的東西。\n\n但全文最需要辯護的方法決定,是選擇明確集而不是模糊集。\n\n明確集把「有沒有這類夥伴」二元化,丟掉了強度資訊。與競爭者有一個聯盟,和有十個聯盟,在明確集裡是同一件事。而這篇引了菲斯的模糊集研究,卻選了明確集,就必須說明為什麼。是因為調查資料本來就是二元的?還是因為校準錨點難以建立?這個理由不寫清楚,審稿人會直接問。\n\n第二個問題是研究者自由度。質性比較分析的一致性門檻設零點八還是零點七五,會直接改變哪些組態被保留。組態研究若沒有報告門檻的敏感度分析,穩健性就無法評估。\n\n第三個問題是時間結構被壓平了。資料涵蓋七年,但這個方法本質上是橫斷的組態比較。聯盟組合會隨時間演化,而產品創新有滯後性。把七年壓成單一觀測,就無法區分「這個組態導致創新」與「創新成功的企業後來建立了這個組態」。\n\n這也連到反向因果的問題。有創新能力的企業,更容易吸引到大學與競爭者作為夥伴。\n\n那麼要怎麼重做?\n\n第一,改用模糊集,或正面辯護明確集的選擇。若原始調查有合作強度或夥伴數量,就用它們建立隸屬分數,並報告三個校準錨點的理論依據。若真的只有二元題項,就用一段說明校準所需的資訊不存在。兩種都可以,沒說明才是問題。\n\n第二,把一致性門檻與邏輯餘項處理做成敏感度矩陣。橫軸放三種一致性門檻,縱軸放保守解、中間解、簡約解三種餘項策略,九個格子各報告一次結果。穩定出現的組態才是可以主張的發現。\n\n第三,分析結果的缺席,不只分析結果的存在。依因果非對稱性原則,另外跑一次沒有產品創新的組態分析。這一半經常更有實務價值。而且若缺席分析剛好是存在分析的反面,那反而暗示關係其實是對稱的,用這個方法的正當性就要重新檢討。\n\n第四,把七年的時間結構用起來。用前期的聯盟組態預測後期的產品創新,建立時間上的先後,至少排除最明顯的反向因果。\n\n第五,正面處理反向因果。最低成本的做法是限制樣本為觀察期初尚無該類聯盟的企業,看新建立的組態是否預測後續創新。\n\n第六,報告有限多樣性的實際嚴重程度。明確列出條件數、邏輯組合總數、實際觀察到的組合數,以及每個保留組態的案例數。若某個組態只由三、五家企業支撐,就必須明說。\n\n第七,補一次跨國複製。荷蘭社群創新調查的姊妹資料在歐洲多國都有,變數定義高度一致。用德國或比利時的資料重跑,檢驗那個大學加供應商的組態是否穩定。\n\n【專家回應　第三則　參與的深度怎麼檢驗】\n\n這篇最有價值的,是把評審權真正交了出去,而不只是諮詢。\n\n多數宣稱做了公眾參與的研究,實際上只做到徵詢意見。這篇讓社群依十項準則評分並決定名次,是參與階梯上明顯更高的位置。這個設計差異值得被看見。\n\n但有幾個地方會被抓。\n\n第一,樣本規模讓有效性的宣稱撐不住。十四位評審與十七位工作坊參與者,足以支撐過程層面的質性發現,不足以支撐訊息有效性的評估。摘要同時提到理解度與有效性,而後者需要的是受眾端的前後測,不是評審端的判斷。\n\n第二,評審的選取方式決定了包容性宣稱的份量,而摘要沒有交代。十四位評審是怎麼招募的?身心障礙類別如何分布?若是透過既有的非政府組織網絡招募,就會有選擇偏誤——最邊緣的群體,通常也最不容易被既有網絡觸及。\n\n第三,過程性成果偏向自陳,而且有明顯的社會期許壓力。參與者說感到自信、被重視、自在,但這些是在研究團隊在場的情境下說出來的。參與式研究特別容易受到這種壓力,因為關係本身就是介入的一部分。\n\n第四,也是最核心的一問:共同生產的宣稱,應該用權力來檢驗,而不是用感受。真正的問題是——社群的評分是否曾經推翻研究團隊的偏好?若十項準則是團隊訂的、最終決策權仍在團隊手上,那參與的深度就有限。\n\n那麼要怎麼重做?\n\n第一步,把有效性的宣稱與證據對齊。兩條路:限縮措辭,把有效性改成可接受度,這不需要新資料;或補上受眾端的前後測,測量眼睛健康知識、就醫意圖或實際篩檢率的變化。建議先做第一條,把第二條寫成明確的後續研究設計。\n\n第二步,完整報告評審的選取過程,並評估代表性。招募管道、障礙類別分布、性別、城鄉分布,以及有多少人來自既有網絡。再比較評審群的組成與坦尚尼亞視障人口的已知分布,若有系統性落差,誠實報告。\n\n第三步,加入獨立的匿名回饋管道。委託與研究團隊無關的第三方,在活動結束兩到四週後訪談,並刻意詢問負面經驗——哪些環節讓你覺得意見沒被聽見。若這類資料與現場回饋一致,說服力會強得多;若不一致,那個落差本身就是重要發現。\n\n第四步,用權力轉移來檢驗共同生產。設計可驗證的指標:十項準則中有幾項是社群提出的?社群評分是否曾推翻團隊的偏好排序?最終決策權在誰手上?用明克勒的參與階梯自我定位,即使答案是合作而非社群主導,誠實定位也比籠統宣稱更有說服力。\n\n第五步,依 GRIPP2 逐項報告,特別是「參與如何改變了研究」那一項。若答案只是素材加了字幕,那參與就在諮詢層;若參與改變了研究問題或評估標準,那才是共同生產。這一項的答案,決定了論文的貢獻高度。\n\n第六步,把可轉移性從宣稱變成分析。明確列出這個模式運作所需的條件:是否需要既有的在地非政府組織網絡?依賴什麼識字率或媒體近用水準?藝術家社群的規模?把這些寫成一張必要前提對照表,讀者才能判斷自己的情境是否適用。\n\n【今日總結】\n\n今天這三篇,共同的主題是「宣稱要與證據對齊」。\n\n第一篇引了互補性的正統文獻,就得用互補性的檢定標準,而不是交互項顯著就好。第二篇選了明確集,就得說明為什麼丟掉強度資訊是合理的。第三篇說了有效性,但手上的證據只支撐可接受度。\n\n三個落差,三種修法,而且沒有一種需要新的資料——全部都是措辭與設計選擇的問題。\n\n以上是今天午班的每日學術新聞,晚上再會。"

   "podcast": "【每日學術新聞　二零二六年八月八日　早班】\n\n歡迎收聽每日學術新聞。本節目從開放學術資料庫 OpenAlex，追蹤十五本科學計量學與創新管理領域的期刊，為您整理今年最新發表的研究。今天早班為您帶來三則研究報導，以及三段專家回應。\n\n首先是今天的頭條。\n\n第一則。一本德語藥學期刊，五十年的作者性別普查。\n\n這項研究發表在《科學計量學》期刊，上線日期是昨天，八月七日。研究對象是德國藥學會的會員刊物《Pharmakon》，前身叫做《我們時代的藥學》。這是一本德語、非同儕審查的刊物。\n\n研究團隊做的是普查，不是抽樣。他們把一九七二年到二零二一年、整整五十年之間刊出的一千五百七十七篇文章、兩千五百零九位作者，全部納入分析，追蹤女性作者比例的長期變化。\n\n結果分成三個層次。\n\n第一個層次是總量。五十年間，女性作者只佔全體的百分之二十六。\n\n第二個層次是趨勢。這條曲線非常陡。一九七零年代初期，女性作者大約只有百分之五；到了二零二零年，這個數字已經接近百分之五十。卡方檢定的顯著性，達到萬分之零點四的水準。\n\n第三個層次，也是整篇研究最值得注意的一層。二零二零年，是這本期刊創刊以來，第一次出現女性第一作者多於男性的年份。然而，在教授這個最高學術職級上，女性人數仍然遠遠少於男性。底部翻轉了，頂端還沒有。\n\n研究另外還有兩個附帶發現。第一，五十年間每篇論文的平均作者數持續上升，這與整個科學界的合著趨勢一致。第二，非藥學背景的作者投稿變多，研究團隊把它解讀為跨領域交流增加的訊號。\n\n論文的最後，作者把研究定位成政策工具，明確指向德國的政治部門、大學，以及藥師公會。\n\n值得一提的是，這篇論文的資深作者 Roland Seifert，本身是德國漢諾威醫學院的分子藥理學家，發表過八百零七篇著作，被引用將近一萬五千次。他在《Naunyn-Schmiedeberg 藥理學檔案》這本期刊上有一百三十一篇著作，遠遠超過他其他任何發表管道。這樣的集中度，通常對應的是編輯職務。換句話說，這不是一位外來的計量學者在研究藥學界，而是領域內部人在做自我檢視。\n\n第二則。四家電子大廠，兩種平台原型，以及循環經濟的分岔路。\n\n這項研究發表在《Technovation》期刊，日期是八月六日。\n\n研究的問題意識是這樣的：數位平台正在重塑傳統的線性價值鏈，而且越來越被當成循環經濟落地的主要推手。但是，不同的平台設計，會不會導向不同的循環結果？\n\n研究團隊比較了四家電子製造商，分別是蘋果、三星、小米，以及戴爾，並且歸納出兩種平台原型。\n\n第一種，稱為高階整合生態系，以蘋果和三星為代表。這一路的做法是鎖定高價值消費者區隔，強調零組件整合與生命週期控制，平台治理封閉而且自有。他們的循環做法優先落在維修、翻新，以及延長產品壽命，而且全部發生在高度整合的產品服務系統之內。\n\n第二種，稱為開放式生態系協作者，以小米和戴爾為代表。這一路把夥伴與使用者拉進來共同參與，重心放在資產管理、服務模組化，以及面向價格敏感消費者與企業客戶的可負擔性。\n\n研究的結論是：平台設計會直接形塑循環成效。治理結構、商業模式，以及數位基礎設施這三者，必須與市場定位和使用者需求對齊。\n\n第三則。逆向創新要進入成熟市場，需要哪些正當性機制。\n\n這項研究發表在《產品創新管理期刊》，日期是八月五日。\n\n所謂逆向創新，指的是在新興市場研發、然後回銷已開發市場的產品。這個概念本身並不新，最經典的案例是奇異公司為印度市場開發的可攜式心電圖機，後來回銷美國。但是，這類產品要如何在成熟市場取得正當性，一直是個缺口。\n\n研究採用混合方法，分成兩個階段。\n\n第一階段是質性研究，透過半結構訪談，辨識並歸類出三種正當性機制，分別是身分機制、聯想機制，以及組織機制。研究以包裝食品為場域，說明逆向創新如何透過身分敘事、專家背書，以及策略性認證，來建立正當性。\n\n第二階段是量化研究，採用實驗性情境短文方法，驗證這三類機制分別強化正當性的哪些面向，以及這些面向如何接續影響消費者的知覺價值與購買意願。\n\n整體結論是：單一機制只能提升特定面向。逆向創新要成功擴散，需要同時處理多重正當性面向的整體性做法。\n\n以上是今天的三則研究報導。接下來是專家回應時間。\n\n【專家回應　第一則　性別普查研究】\n\n先談這篇研究最聰明的地方。它選了一本可以做到百分之百普查的封閉期刊，用範圍上的犧牲，換來五十年沒有缺漏的縱貫比較。在動輒撈取數百萬筆資料、卻永遠存在覆蓋偏誤與作者消歧誤差的稿件池裡，這種資料策略反而是有辨識度的。\n\n但是，這篇研究有一個致命的空缺，而且是它自己招來的。\n\n它引用了 Shaw 與 Stanton 二零一二年那篇《管線的漏洞》。那篇論文的核心主張是：必須把人口慣性，跟持續存在的性別差異，分開來看。所謂人口慣性的意思是，就算完全沒有任何偏誤，只要大量女性在近年進入這個領域，資深層級的女性比例也會因為晉升需要時間，而自然落後數十年。\n\n換句話說，女性作者比例從百分之五升到百分之五十，究竟有多少是來自新進世代的性別組成改變，又有多少是來自同一世代的女性真的留了下來、升了上去？這兩件事的政策含意完全不同。這篇研究引用了那個文獻，卻沒有做這個分解。\n\n第二個問題是統計工具配不上資料的解析度。把五十年切成幾個區段做卡方檢定，等於把一條連續的趨勢降格成類別比較。以年份為連續變項的邏輯迴歸，可以直接估算出每一年女性作者的勝算比，資訊量高出一個檔次。\n\n第三，外部效度的邊界比表面上更窄。非同儕審查刊物的投稿篩選機制，跟研究型期刊根本不同。它比較接近專業社群的溝通平台，而不是研究產出的競技場。所以這裡的比例，不能被讀成德國藥學界的研究生產力性別結構。\n\n那麼，如果要重現並且改進這項研究，該怎麼做？\n\n第一步，把單一期刊升級成焦點案例加對照群。保留《Pharmakon》當作焦點案例，同時用 OpenAlex 的德語篩選條件，加上藥學相關的主題編號，把整個德語藥學期刊群抓下來當作基準，並且區分同儕審查與非同儕審查兩類。這樣不只能回答這本期刊是否特殊，還能順便回答一個原研究完全沒碰、但資料唾手可得的問題：審查機制本身，是不是一個性別過濾器。\n\n第二步，性別推斷必須三角驗證。同時使用 Genderize、NamSor，以及 Gender API 三個服務，三者一致的取為高信度；不一致或無法判定的，用 ORCID 的自報資料補足；剩下的高產作者人工查驗。最重要的是，一定要報告無法判定的比率，並且做敏感度分析：把無法判定者全部當成男性、全部當成女性、按比例分配，看結論會不會翻轉。這一段有沒有做，幾乎決定了這類稿件的生死。\n\n這裡還有一個容易被忽略的陷阱。早期文獻常常只有姓氏縮寫，姓名推斷的失敗率會比近期高。如果無法判定的比率隨時間下降，而且不是隨機分布，那條上升曲線就有一部分是測量假象。所以必須報告無法判定率隨時間的分布。\n\n第三步，職級改用學術年齡當作主要操作化。用作者首次發表的年份推算學術年齡，切成早期、中期、資深三段。這樣全樣本都可取得，跨國也能比較，還能避開德語頭銜制度的特殊性。\n\n第四步，也是最核心的一步，做人口慣性分解。用作者首次發表年定義進入世代，然後把女性比例的變化拆成兩個成分：各世代之間的性別組成差異，以及同一世代內部隨時間的留存與晉升差異。可以用年齡、時期、世代分解，或是簡化的世代固定效果模型。做完這一步，這篇研究的貢獻等級會整個改變——從「比例上升了」，變成「上升有多少是真的改善」。\n\n第五步，換成混合效果邏輯迴歸，並且把第一作者、通訊作者、末位作者三個位置分開建模。末位作者在生醫傳統代表資深主導者，是漏斗效應最靈敏的位置。把三條軌跡畫在同一張圖上，落差本身就是論文的主圖。\n\n最後，如果要從描述走向因果，就需要一個外生衝擊。德國研究基金會在二零零八年推出的研究導向性別平等標準，可以當作斷點做中斷時間序列；或者以奧地利、瑞士的德語藥學期刊當作對照組，做差異中之差異，檢驗政策是否真的改變了曲線的斜率。\n\n【專家回應　第二則　平台原型研究】\n\n這篇研究最大的結構問題，是四個案例切成兩種原型，等於每一種原型只有兩個案例支撐。Eisenhardt 建議多案例研究使用四到十個案例，是有道理的：一個型態要能被稱為原型，必須先在同型內部看到重複，再在異型之間看到對比。每格只有兩個案例，這兩件事都撐不住。\n\n第二個問題，可以從它的參考文獻看出來。它引用了 Bowen 二零零九年那篇《文件分析作為質性研究方法》，這代表主要證據來自企業文件，而不是第一手訪談。問題在於，文件分析的方法論前提是文件具有可追溯性與非反應性——而企業自願揭露的永續報告，恰好兩者都不滿足。它本來就是為了塑造形象而生產的。漂綠風險因此不是一句限制段落可以打發的，它是活的效度威脅。\n\n第三，原型是類型學，不是機制。「平台設計影響循環成效」這句話裡面，成效那一端根本沒有被測量。沒有回收率、沒有翻新機營收佔比、沒有零件供應年限、沒有實際服役壽命，因果宣稱就只能停在敘事層次。\n\n第四，內生性直指核心。蘋果的高階市場定位，可能同時導致了封閉平台與延壽策略。也就是說，平台原型跟市場定位根本不是彼此獨立的自變數。如果不處理這個共同前因，所謂原型可能只是市場定位的另一個名字。\n\n那麼要怎麼重做？\n\n第一，案例數擴充到十二到十六家，並且補進三類目前完全缺席的行為者：挑戰者品牌、第三方維修平台，以及企業端的資訊資產處置業者。真正把循環做成生意的那一群人，現在完全不在樣本裡。\n\n第二，資料必須三角化。第一條腿是半結構訪談，每個案例訪問三到五位平台治理、逆物流與售後主管。第二條腿是不受企業控制的客觀資料，包括第三方可修復性評分、歐盟生態設計法規的合規文件、維修與翻新相關的專利分類，以及獨立拆解報告。第三條腿是使用者端的行為痕跡，例如二手市場的價格衰減曲線，可以當作實際服役壽命的替代指標。後面兩條特別重要，因為它們正好補上文件分析所缺的非反應性。\n\n第三，先處理與既有分類的關係，再談新原型。這篇引用了 Tukker 的產品服務系統回顧，卻沒有沿用他的產品導向、使用導向、結果導向三分法。應該先把擴充後的案例編碼進既有的三分法，看它切不切得開。如果切得開，就沒有必要自創；如果切不開，那個切不開的地方，就是新分類的立論基礎。\n\n第四，把平台原型拆成可測量的連續維度，包括治理封閉度、模組化程度、逆物流整合度，以及資料權屬歸屬。然後用集群分析或模糊集質性比較分析，讓原型從資料裡自己長出來。這一步同時解決了案例數不足與內生性兩個問題，因為維度是獨立測量的，不是從市場定位推導出來的。\n\n第五，補上循環績效的結果變數，並且用模糊集質性比較分析處理中型樣本。要問的是：治理封閉度、模組化，以及市場定位的哪些組合，構成高循環績效的充分條件。這種方法還能揭示等效路徑——可能有好幾條不同的組態，通向同樣的好結果。\n\n最後，如果要做因果識別，歐盟維修權相關規範的生效時點，提供了一個不受廠商策略控制的外生斷點。比較同一款產品在歐盟市場與非歐盟市場的維修可得性、零件價格與服役壽命變化，做差異中之差異。\n\n【專家回應　第三則　逆向創新正當性研究】\n\n這一篇要先修正一個容易犯的誤判。從參考文獻可以看出，它的測量嚴謹度其實高於一般的情境短文研究——事前檢定力分析、區辨效度檢驗、結構方程模型的適配門檻、涉入度量表、線上樣本品質的意識，全部都做了。批評它沒做標準檢查，是不成立的。\n\n真正可議的是它做的是哪一種。它用的是 Fornell 與 Larcker 的準則，而不是異質單質比值。前者在偵測相近構念的區辨效度不足時，敏感度偏低，這一點在近十年已經有系統性的模擬證據。而身分、聯想、組織這三個機制在概念上高度相鄰——專家背書到底該算聯想還是組織——正是最需要高敏感度檢驗的情境。\n\n接下來是房間裡的大象。受試者對「新興市場研發」的反應，究竟來自逆向創新這個結構本身，還是單純的來源國汙名？現行設計分不開這兩者。而整篇研究的理論宣稱能不能成立，就押在這一點上。從被引用最多的參考文獻來看，國際行銷的來源國傳統並沒有進入這篇的對話。\n\n第三，「需要整體性做法」這個結論被過度延伸了。要主張多重維度必須同時處理，必須測量交互作用或組態。只跑主效果與平行中介，就下這個結論，統計上撐不起來。\n\n第四，意圖不是行為。情境短文實驗測到的是購買意願，而意願與實際購買之間的落差，在消費行為文獻裡已經被反覆記錄。整篇研究的外部效度，全部押在這一個測量上。\n\n那麼要怎麼重做？\n\n第一步，也是整個重做計畫的地基：把來源國效應從逆向創新裡切乾淨。用二乘二的受試者間設計，一個維度是研發地，分成新興市場與已開發市場；另一個維度是品牌來源國，同樣分成兩種。只有當「新興市場研發，加上已開發市場品牌」這一格出現可解釋的差異，才能說效果來自逆向創新的結構，而不是來源國歧視。\n\n第二步，跨品類複製，並且讓風險成為理論上的調節變數。至少做三個品類，依照涉入度與風險排列：包裝食品屬於低風險，家用電器屬於中風險，醫療器材或汽車零件屬於高風險。可檢驗的預測很明確——風險上升時，機制的相對權重應該從身分敘事，轉移到組織性線索，也就是認證、法規合規與第三方檢驗。這個交互作用如果成立，理論貢獻立刻提高一個層級。\n\n第三步，把依變數從意圖推進到行為。加入一個誘因相容的測量，例如讓受試者用真實的參與費出價、真實選擇實驗，或者與電商平台合作進行田野實驗，直接觀察點擊與加入購物車的行為。這是把稿件從「又一篇情境短文研究」，變成「有行為證據」的關鍵升級。\n\n第四步，區辨效度改用異質單質比值，並且把測量模型、中介路徑與假設方向預先註冊。在實驗類研究上，預先註冊已經從加分項變成基本盤。\n\n第五步，如果要主張整體性，就必須做組態分析。用完全因子設計測量二階與三階交互作用，或改用模糊集質性比較分析，找出哪些機制組合構成高正當性的充分條件。\n\n最後，補齊邊界條件與跨文化複製。加入消費者世界主義、族群中心主義、對特定新興市場的先驗態度，以及品類知識這四個調節變數。它們回答的是「這套機制對誰有效」，而那正是實務貢獻的所在。同時，不要把已開發市場當成同質的整體，德國消費者對認證的反應強度，跟日本消費者對來源國的敏感度，可能差距很大。\n\n【今日總結】\n\n今天這三篇研究，卡在同一個位置。好的描述並不難，難的是把描述推進到可以識別的因果宣稱。第一篇擁有五十年的資料，卻沒有分解人口慣性；第二篇歸納出了原型，卻沒有結果變數；第三篇有嚴謹的測量，卻沒有行為依變數。三個缺口，三種補法，而且都不是資源問題，而是研究設計的選擇問題。\n\n以上是今天早班的每日學術新聞，中午再會。"
  }

<script>
// ── 朗讀引擎：Chrome 內建 Web Speech API，免安裝、免金鑰 ──────────────
const TTS = (function(){
  const synth = window.speechSynthesis;
  const MAX = 150;                       // 只在句末切，長度接近但不超過此值
  let voices = [], cur = null;           // cur = { host, segs, i, rate, v }

  // 為閱讀而寫的文字 → 為朗讀而讀。符號與數字轉成唸得出來的形式
  function speakify(s){
    return String(s || '')
      .replace(/<\/?b>/g, '')
      .replace(/(\d+(?:\.\d+)?)\s*%/g, '百分之 $1')
      .replace(/\bh\s*=\s*(\d+)/gi, 'h 指數 $1')
      .replace(/\bp\s*=\s*\./g, 'p 值 零點')
      .replace(/\bIRR\b/g, '發生率比')
      .replace(/(\d)\s*[–—~]\s*(\d)/g, '$1 到 $2')
      .replace(/\s*[→]\s*/g, '，接著是，')
      .replace(/\s*=\s*/g, ' 等於 ')
      .replace(/\s*·\s*/g, '，')
      .replace(/[《》〈〉「」『』]/g, '')
      .replace(/[<>#*_`|]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // 把一篇的所有分析欄位組成可朗讀的長稿
  function fullText(p){
    const L = [];
    const push = (h, body) => { if (body && body.length) { L.push('【' + h + '】'); L.push(body); } };
    L.push('【' + speakify(p.title) + '】');
    L.push(speakify(p.journal + '，' + p.date + '。' + (p.authors || '')));
    push('研究全貌', (p.gist || []).map(speakify).join('\n'));
    if (p.design) push('方法拆解', speakify(p.design));
    push('文獻定位，它在跟誰對話', (p.lineage || []).map(speakify).join('\n'));
    push('學者視角，貢獻與侷限', (p.critique || []).map(speakify).join('\n'));
    push('被該期刊接受的關鍵', (p.accept || []).map(speakify).join('\n'));
    if ((p.figures || []).length) push('領域人物誌，你該認識的人',
      p.figures.map(f => speakify(f.name + '，' + f.role + '，' + f.inst + '。' + f.stat + '。')
        + '\n' + speakify(f.famous) + '\n' + speakify('你該知道的是。' + f.must)).join('\n'));
    if ((p.canon || []).length) push('知識點，這個領域的共同語言',
      p.canon.map(c => speakify(c.term + '。' + c.t)).join('\n'));
    if ((p.redo || []).length) push('如果我要重做這個研究',
      p.redo.map((s, i) => speakify('第 ' + (i + 1) + ' 步。' + s.h + '。' + s.t)).join('\n'));
    if (p.fit) push('投稿定位', speakify(p.fit));
    return L.join('\n');
  }

  // 播報稿 → [{hd:bool, text}]，只在句號問號驚嘆號處斷句，避免語調被切斷
  function segment(raw){
    const out = [];
    String(raw || '').split(/\n+/).forEach(para => {
      para = para.trim();
      if (!para) return;
      if (para.charAt(0) === '【') { out.push({hd: true, text: para.replace(/[【】]/g,'')}); return; }
      let buf = '';
      para.split(/(?<=[。！？])/).forEach(part => {
        if (!part) return;
        if ((buf + part).length > MAX && buf) { out.push({hd:false, text: buf}); buf = part; }
        else buf += part;
      });
      if (buf.trim()) out.push({hd:false, text: buf});
    });
    return out;
  }

  // 自然度排序：神經語音 > 線上語音 > zh-TW > 其他中文
  function score(v){
    const s = (v.name + ' ' + v.lang);
    let n = 0;
    if (/natural|neural/i.test(s)) n += 100;
    if (/online/i.test(s))         n += 60;
    if (/google/i.test(s))         n += 40;
    if (/zh[-_]TW|Hant|Taiwan/i.test(s)) n += 30;
    if (/zh[-_]HK|Cantonese/i.test(s))   n += 5;
    if (/^zh/i.test(v.lang))       n += 10;
    if (/desktop|sapi/i.test(s))   n -= 30;   // 舊式本地語音，機械感最重
    return n;
  }

  function loadVoices(){
    const all = synth ? synth.getVoices() : [];
    const zh = all.filter(v => /^zh/i.test(v.lang));
    voices = (zh.length ? zh : all).slice().sort((a,b) => score(b) - score(a));
    return voices;
  }

  function fillSelects(host){
    const vs = loadVoices();
    const sel = host.querySelector('.va');
    if (sel && !sel.dataset.filled && vs.length) {
      sel.innerHTML = vs.map((v,i) =>
        '<option value="' + i + '">' + v.name.replace(/^Microsoft |^Google /,'') +
        (score(v) >= 100 ? ' ★自然' : '') + '</option>').join('');
      sel.value = 0;                      // 排序後第一個就是最自然的
      sel.dataset.filled = '1';
    }
    return vs.length;
  }

  function paint(host, idx){
    host.querySelectorAll('.script p').forEach(p => {
      const i = +p.dataset.i;
      p.classList.toggle('now', i === idx);
      p.classList.toggle('done', i < idx);
    });
    const p = host.querySelector('.script p.now');
    if (p && host.dataset.follow === '1') p.scrollIntoView({block:'center', behavior:'smooth'});
    const st = host.querySelector('.pstat');
    if (st) st.textContent = (idx + 1) + ' / ' + cur.segs.length;
  }

  function speakAt(i){
    if (!cur || i >= cur.segs.length) { stop(true); return; }
    cur.i = i;
    paint(cur.host, i);
    const s = cur.segs[i];
    const vs = loadVoices();
    const u = new SpeechSynthesisUtterance(s.text);
    if (vs[cur.v]) { u.voice = vs[cur.v]; u.lang = vs[cur.v].lang; } else { u.lang = 'zh-TW'; }
    u.rate = cur.rate * (s.hd ? 0.94 : 1);   // 章節標題唸慢一點
    u.pitch = s.hd ? 1.04 : 1;
    u.onend = () => {
      if (!cur || cur.i !== i) return;
      // 章節之間留半秒空白，聽起來像真的換段
      const gap = s.hd || (cur.segs[i+1] && cur.segs[i+1].hd) ? 550 : 0;
      if (gap) setTimeout(() => { if (cur && cur.i === i) speakAt(i + 1); }, gap);
      else speakAt(i + 1);
    };
    u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') stop(true); };
    synth.speak(u);
  }

  function start(host, segs, from){
    stop();
    cur = {
      host, segs, i: from || 0,
      rate: parseFloat(host.querySelector('.rate').value),
      v: +host.querySelector('.va').value || 0
    };
    host.querySelector('.play').textContent = '❚❚ 暫停';
    host.querySelector('.stop').disabled = false;
    speakAt(cur.i);
  }

  function stop(finished){
    if (synth) synth.cancel();
    if (cur) {
      const h = cur.host;
      h.querySelector('.play').textContent = '▶ 朗讀';
      h.querySelector('.stop').disabled = true;
      if (finished) {
        h.querySelectorAll('.script p').forEach(p => p.classList.remove('now'));
        h.querySelector('.pstat').textContent = '已播完';
      }
    }
    cur = null;
  }

  return {
    segment, speakify, fullText, fillSelects, start, stop,
    supported: () => !!synth,
    isPlaying: host => !!cur && cur.host === host,
    at: () => cur ? cur.i : 0,
    pause: () => synth.pause(),
    resume: () => synth.resume(),
    paused: () => synth && synth.paused,
    restart: (i, r) => { if (!cur) return; const h = cur.host, s = cur.segs;
                 synth.cancel();
                 cur = {host:h, segs:s, i, rate: (r == null ? cur.rate : r), v:+h.querySelector('.va').value||0};
                 speakAt(i); }
  };
})();
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    document.querySelectorAll('.podbody').forEach(h => {
      h.querySelectorAll('select').forEach(s => { delete s.dataset.filled; });
      const n = TTS.fillSelects(h), w = h.querySelector('.pwarn');
      if (n && w) w.style.display = 'none';
    });
  };
}

(function(){
  const D = JSON.parse(document.getElementById('digest-data').textContent);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ALLOW = /&lt;(\/?)b&gt;/g;                       // only <b> survives
  const rich = s => esc(s).replace(ALLOW, '<$1b>');

  const all = [];
  D.runs.forEach(r => r.papers.forEach(p => all.push(Object.assign({}, p, {_run:r}))));

  document.getElementById('sub').textContent =
    '追蹤 ' + D.journals.length + ' 本期刊 · 最後更新 ' + D.updated + ' · 新→舊倒序推進';
  const nBrief = D.runs.reduce((a, r) => a + ((r.briefs||[]).length), 0);
  document.getElementById('s-done').textContent = all.length + nBrief;
  document.getElementById('s-pool').textContent = D.pool.toLocaleString();
  document.getElementById('s-j').textContent = D.journals.length;
  const done = all.length + nBrief;
  const remain = Math.max(0, D.pool - done);
  document.getElementById('s-eta').textContent = Math.ceil(remain / 70) + ' 天';
  document.getElementById('prog').style.width =
    Math.max(0.6, done / D.pool * 100).toFixed(2) + '%';

  const fj = document.getElementById('fj');
  [...new Set(all.map(p => p.journal))].sort().forEach(j => {
    const o = document.createElement('option'); o.value = j; o.textContent = j; fj.appendChild(o);
  });

  const q = document.getElementById('q'), fn = document.getElementById('fn'), feed = document.getElementById('feed');
  try {
    const st = JSON.parse(localStorage.getItem('dsd-filters') || '{}');
    if (st.q) q.value = st.q; if (st.j) fj.value = st.j; if (st.n) fn.value = st.n;
  } catch(e){}
  const save = () => { try { localStorage.setItem('dsd-filters',
    JSON.stringify({q:q.value, j:fj.value, n:fn.value})); } catch(e){} };

  const arr = v => Array.isArray(v) ? v : (v ? [v] : []);

  function card(p){
    const tags = [
      '<span class="tag j">' + esc(p.journal) + '</span>',
      p.fresh ? '<span class="tag new">當日最新</span>' : '',
      '<span class="tag">' + esc(p.date) + '</span>',
      p.oa ? '<span class="tag oa">開放取用</span>' : '',
      ...(p.topics || []).map(t => '<span class="tag">' + esc(t) + '</span>')
    ].filter(Boolean).join('');

    let h = '<article class="card' + (p.fresh ? ' fresh' : '') + '">' +
      '<div class="meta">' + tags + '</div>' +
      '<h3><a href="' + esc(p.doi) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>' +
      '<div class="au">' + esc(p.authors) + '</div>';

    // 濃縮精華：沒展開時也看得到、聽得到
    const tl = p.tldr || {};
    const tlRows = [['研究什麼','what'],['用什麼方法','how'],['具體怎麼做','steps'],
                    ['什麼結果','result'],['結論','conclusion'],['貢獻','contribution'],
                    ['被接受的關鍵','key']].filter(r => tl[r[1]]);
    if (tlRows.length) {
      h += '<div class="tldr"><h3>⚡ 濃縮精華</h3><dl>' +
        tlRows.map(r => '<dt>' + r[0] + '</dt><dd>' + rich(tl[r[1]]) + '</dd>').join('') + '</dl>' +
        (tl.todo ? '<div class="act"><b>我如果要做 · </b>' + rich(tl.todo) + '</div>' : '') + '</div>';
    } else {
      // 沒有 tldr 欄位時，用研究全貌的第一段當速覽
      const first = arr(p.gist)[0];
      if (first) h += '<div class="tldr"><h3>⚡ 濃縮精華</h3><dl>' +
        '<dt>一句話</dt><dd>' + rich(first) + '</dd></dl></div>';
    }

    h += '<details class="deep"><summary>展開完整分析 · 研究全貌、方法拆解、文獻定位、學者視角、人物誌、知識點、重做藍圖</summary><div class="deepbody">';

    h += '<div class="sec gist"><h4>研究全貌</h4>' +
         arr(p.gist).map(t => '<p>' + rich(t) + '</p>').join('') + '</div>';

    if (p.design) h += '<div class="sec design"><h4>方法拆解</h4><div class="box">' + rich(p.design) + '</div></div>';

    if (arr(p.lineage).length) h += '<div class="sec lin"><h4>文獻定位 · 它在跟誰對話' +
      (p.refs ? '（' + p.refs + ' 筆參考文獻）' : '') + '</h4><div class="box"><ul>' +
      arr(p.lineage).map(t => '<li>' + rich(t) + '</li>').join('') + '</ul></div></div>';

    if (arr(p.critique).length) h += '<div class="sec crit"><h4>學者視角 · 貢獻與侷限</h4><div class="box"><ul>' +
      arr(p.critique).map(t => '<li>' + rich(t) + '</li>').join('') + '</ul></div></div>';

    if (arr(p.accept).length) h += '<div class="sec acc"><h4>被該期刊接受的關鍵</h4><div class="box"><ul>' +
      arr(p.accept).map(t => '<li>' + rich(t) + '</li>').join('') + '</ul></div></div>';

    if (arr(p.figures).length) h += '<div class="sec fig"><h4>領域人物誌 · 你該認識的人</h4><div class="figs">' +
      arr(p.figures).map(f => {
        const cls = f.role === '本篇作者' ? ' own' : (/未引/.test(f.role || '') ? ' ext' : '');
        return '<div class="fig"><div class="fh"><span class="fn">' + esc(f.name) + '</span>' +
          '<span class="fr' + cls + '">' + esc(f.role) + '</span></div>' +
          '<div class="fi">' + esc(f.inst) + ' · ' + esc(f.stat) + '</div>' +
          '<p>' + rich(f.famous) + '</p>' +
          '<p class="mu"><b>你該知道的是 · </b>' + rich(f.must) + '</p></div>';
      }).join('') + '</div></div>';

    if (arr(p.canon).length) h += '<div class="sec can"><h4>知識點 · 這個領域的共同語言</h4><dl class="can">' +
      arr(p.canon).map(c => '<div><dt>' + esc(c.term) + '</dt><dd>' + rich(c.t) + '</dd></div>').join('') +
      '</dl></div>';

    if (arr(p.redo).length) h += '<div class="sec redo"><h4>如果我要重做這個研究</h4><ol class="redo">' +
      arr(p.redo).map(s => '<li><strong>' + rich(s.h) + '</strong>' + rich(s.t) + '</li>').join('') + '</ol></div>';

    if (p.fit) h += '<div class="fit"><b>投稿定位 · </b>' + rich(p.fit) + '</div>';

    h += '</div></details>';

    // 整篇分析的朗讀版
    const fsegs = TTS.segment(TTS.fullText(p));
    h += '<details class="pod full"><summary>🎧 朗讀本篇完整分析 · 約 ' +
      Math.max(1, Math.round(fsegs.reduce((a, s) => a + s.text.length, 0) / 300)) + ' 分鐘</summary>' +
      '<div class="podbody"><div class="pwarn" style="display:none"></div>' + player() +
      '<div class="script">' + fsegs.map((s, i) =>
        '<p class="' + (s.hd ? 'hd' : '') + '" data-i="' + i + '">' + esc(s.text) + '</p>').join('') +
      '</div>' +
      '<button class="copy sec pbtn" style="margin-top:9px">複製全文</button>' +
      '</div></details>';

    return h + '</article>';
  }

  function player(){
    return '<div class="player">' +
      '<button class="pbtn play">▶ 朗讀</button>' +
      '<button class="pbtn sec stop" disabled>■ 停止</button>' +
      '<label>語速 <input type="range" class="rate" min="0.6" max="1.6" step="0.05" value="1"><span class="rv">1.00×</span></label>' +
      '<label>語音 <select class="va"></select></label>' +
      '<label class="fw"><input type="checkbox" class="follow"> 跟讀捲動</label>' +
      '<span class="pstat">—</span>' +
    '</div>';
  }

  function render(){
    save();
    const kw = q.value.trim().toLowerCase(), jj = fj.value, nn = fn.value;
    let html = '';
    D.runs.forEach(r => {
      const ps = r.papers.filter(p => {
        if (jj && p.journal !== jj) return false;
        if (nn === '1' && !p.fresh) return false;
        if (nn === 'oa' && !p.oa) return false;
        if (kw) {
          const hay = [p.title, p.authors, p.journal, (p.topics||[]).join(' '),
                       arr(p.gist).join(' '), p.design, arr(p.lineage).join(' '),
                       arr(p.critique).join(' '), arr(p.accept).join(' '),
                       arr(p.figures).map(f => f.name + f.inst + f.famous + f.must).join(' '),
                       arr(p.canon).map(c => c.term + c.t).join(' '),
                       arr(p.redo).map(s => s.h + s.t).join(' '), p.fit].join(' ').toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });
      if (!ps.length) return;
      html += '<div class="runhead"><h2>' + esc(r.date) + ' · ' + esc(r.slot) +
              '</h2><span class="when">' + esc(r.time) + ' · ' + ps.length + ' 篇</span></div>';
      html += ps.map(card).join('');

      // 中等摘要（第二層）
      const bs = (r.briefs || []).filter(b => {
        if (jj && b.journal !== jj) return false;
        if (nn === 'oa' && !b.oa) return false;
        if (kw) { const hay = [b.title, b.journal, (b.topics||[]).join(' '),
          arr(b.brief).join(' '), b.teach || ''].join(' ').toLowerCase();
          if (!hay.includes(kw)) return false; }
        return true;
      });
      if (bs.length) {
        html += '<div class="runhead" style="border-bottom-style:dashed"><h2>本輪快訊</h2>' +
                '<span class="when">' + bs.length + ' 篇中等摘要</span></div>';
        html += '<div class="briefs">' + bs.map(b =>
          '<div class="bf"><h4><a href="' + esc(b.doi) + '" target="_blank" rel="noopener">' +
          esc(b.title) + '</a></h4>' +
          '<div class="m">' + esc(b.journal) + ' · ' + esc(b.date) +
          (b.oa ? ' · 開放取用' : '') + ((b.topics||[]).length ? ' · ' + esc(b.topics.join('、')) : '') + '</div>' +
          arr(b.brief).map(t => '<p>' + rich(t) + '</p>').join('') +
          (b.teach ? '<div class="tc"><b>可教的一課 · </b>' + rich(b.teach) + '</div>' : '') +
          '</div>').join('') + '</div>';
      }
      if (r.podcast && !kw && !jj && !nn) {
        const rid = r.date + '-' + r.slot;
        const segs = TTS.segment(r.podcast);
        html += '<details class="pod" data-rid="' + esc(rid) + '"><summary>新聞播報稿 · ' +
          esc(r.date) + ' ' + esc(r.slot) + ' · 約 ' +
          Math.round(r.podcast.length / 300) + ' 分鐘</summary>' +
          '<div class="podbody">' +
          '<div class="pwarn" style="display:none"></div>' + player() +
          '<div class="script">' + segs.map((s, i) =>
             '<p class="' + (s.hd ? 'hd' : '') + '" data-i="' + i + '">' + esc(s.text) + '</p>').join('') +
          '</div>' +
          '<button class="copy sec pbtn" style="margin-top:9px">複製全文</button>' +
          '<div class="srcs">來源 DOI：' + ps.map(p => '<a href="' + esc(p.doi) + '" target="_blank" rel="noopener">' +
              esc(p.doi.replace('https://doi.org/','')) + '</a>').join(' · ') + '</div>' +
          '</div></details>';
      }
    });
    feed.innerHTML = html || '<div class="empty">沒有符合條件的論文。</div>';

    feed.querySelectorAll('button.copy').forEach(b => {
      b.onclick = () => {
        const txt = b.closest('.podbody').querySelector('.script').textContent;
        navigator.clipboard.writeText(txt).then(() => {
          const o = b.textContent; b.textContent = '已複製 ✓';
          setTimeout(() => b.textContent = o, 1600);
        });
      };
    });

    // ── 朗讀控制 ──
    feed.querySelectorAll('.podbody').forEach(host => {
      const warn = host.querySelector('.pwarn');
      if (!TTS.supported()) {
        warn.style.display = 'block';
        warn.textContent = '這個瀏覽器不支援語音朗讀，逐字稿仍可閱讀與複製。';
        host.querySelector('.player').style.display = 'none';
        return;
      }
      const nVoices = TTS.fillSelects(host);
      if (!nVoices) {
        warn.style.display = 'block';
        warn.textContent = '系統尚未載入中文語音。Windows 可到「設定 → 時間與語言 → 語音」新增中文（繁體）語音套件，重開瀏覽器後即可播報。';
      } else if (!/★自然/.test(host.querySelector('.va').innerHTML)) {
        warn.style.display = 'block';
        warn.textContent = '目前只找到舊式本地語音，機械感較重。Windows 到「設定 → 時間與語言 → 語音 → 新增語音」安裝中文（繁體），即可取得 Microsoft 的自然語音；清單中標示 ★自然 的選項音質最好。';
      }

      // 直接從 DOM 讀回段落，播報稿與全文分析共用同一套邏輯
      const segs = [...host.querySelectorAll('.script p')]
        .map(p => ({ hd: p.classList.contains('hd'), text: p.textContent }));
      const play = host.querySelector('.play');
      const rate = host.querySelector('.rate');
      const rv = host.querySelector('.rv');

      play.onclick = () => {
        TTS.fillSelects(host);
        if (!TTS.isPlaying(host)) { TTS.start(host, segs, 0); return; }
        if (TTS.paused()) { TTS.resume(); play.textContent = '❚❚ 暫停'; }
        else { TTS.pause(); play.textContent = '▶ 繼續'; }
      };
      host.querySelector('.stop').onclick = () => TTS.stop(true);
      rate.oninput = () => {
        rv.textContent = (+rate.value).toFixed(2) + '×';
        if (TTS.isPlaying(host)) TTS.restart(TTS.at(), +rate.value);
      };
      host.querySelector('.va').onchange = () => {
        if (TTS.isPlaying(host)) TTS.restart(TTS.at(), null);
      };

      // 跟讀捲動預設關閉：聽的時候可以自由翻閱，畫面不會被拉走
      const fw = host.querySelector('.follow');
      host.dataset.follow = '0';
      fw.onchange = () => { host.dataset.follow = fw.checked ? '1' : '0'; };
      // 只要使用者自己滑動，就立刻停止跟讀，不必手動關掉
      const sc = host.querySelector('.script');
      ['wheel', 'touchmove'].forEach(ev => sc.addEventListener(ev, () => {
        if (host.dataset.follow === '1') { host.dataset.follow = '0'; fw.checked = false; }
      }, { passive: true }));
      host.querySelectorAll('.script p').forEach(p => {
        p.onclick = () => {
          const i = +p.dataset.i;
          if (TTS.isPlaying(host)) TTS.restart(i, null); else TTS.start(host, segs, i);
          play.textContent = '❚❚ 暫停';
        };
      });
    });
  }

  // cumulative people index — dedupes across every run
  (function(){
    const seen = new Map();
    D.runs.forEach(r => r.papers.forEach(p => arr(p.figures).forEach(f => {
      if (!seen.has(f.name)) seen.set(f.name, {f: f, from: p.journal});
    })));
    if (!seen.size) return;
    const items = [...seen.values()].sort((a, b) => a.f.name.localeCompare(b.f.name));
    document.getElementById('people').innerHTML =
      '<details class="idx"><summary>人物索引 · 累積 ' + items.length + ' 位（點開展開）</summary>' +
      '<div class="idxbody">' + items.map(o =>
        '<div class="idxi"><b>' + esc(o.f.name) + '</b><span>' + esc(o.f.inst) +
        '</span><span>' + esc(o.f.stat) + '</span></div>').join('') +
      '</div></details>';
  })();

  // 全索引（第一層）
  (function(){
    const idx = D.index || [];
    if (!idx.length) return;
    const covered = new Set();
    D.runs.forEach(r => { (r.papers||[]).forEach(p => covered.add(p.wid));
                          (r.briefs||[]).forEach(b => covered.add(b.wid)); });
    const el = document.createElement('details');
    el.className = 'idxall';
    el.innerHTML = '<summary>全索引 · ' + idx.length + ' 篇已上架,其中 ' + covered.size +
      ' 篇已有摘要（點開展開)</summary><div class="idxlist">' +
      idx.slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')).map(x =>
        '<div class="idxrow"><span class="d">' + esc(x.date) + '</span>' +
        '<span class="jn">' + esc((x.journal||'').slice(0,18)) + '</span>' +
        '<span><a href="' + esc(x.doi) + '" target="_blank" rel="noopener">' + esc(x.title) + '</a>' +
        (covered.has(x.wid) ? ' <span class="tag oa">已摘要</span>' : '') + '</span></div>').join('') +
      '</div>';
    document.getElementById('people').appendChild(el);
  })();

  q.oninput = render; fj.onchange = render; fn.onchange = render;
  render();
})();
</script>
<script>

// ── 逐格朗讀：每個區塊一顆播放鍵，共用一個隱藏播放器 ──────────────
(function(){
  if (!TTS.supported()) return;

  const host = document.createElement('div');
  host.id = 'miniplayer';
  host.innerHTML =
    '<div class="player" style="display:none">' +
      '<button class="pbtn play"></button><button class="pbtn sec stop"></button>' +
      '<input type="range" class="rate" min="0.6" max="1.6" step="0.05" value="1">' +
      '<span class="rv"></span><select class="va"></select><span class="pstat"></span>' +
      '<input type="checkbox" class="follow">' +
    '</div><div class="script" style="display:none"></div>';
  document.body.appendChild(host);
  host.dataset.follow = '0';

  const bar = document.createElement('div');
  bar.className = 'minibar';
  bar.innerHTML = '<span class="mt"></span>' +
    '<button class="pbtn sec mp">❚❚</button><button class="pbtn sec ms">■</button>' +
    '<span class="mn"></span>';
  document.body.appendChild(bar);

  const sc = host.querySelector('.script');
  const label = bar.querySelector('.mt'), num = bar.querySelector('.mn');

  function playBlock(el, title){
    const clone = el.cloneNode(true);
    clone.querySelectorAll('.blkplay,.player,.script,button').forEach(x => x.remove());
    const segs = TTS.segment(TTS.speakify(clone.innerText || clone.textContent));
    if (!segs.length) return;
    sc.innerHTML = segs.map((s,i) =>
      '<p class="' + (s.hd?'hd':'') + '" data-i="' + i + '"></p>').join('');
    segs.forEach((s,i) => { sc.children[i].textContent = s.text; });
    TTS.fillSelects(host);
    TTS.start(host, segs, 0);
    label.textContent = title;
    bar.classList.add('on');
    document.querySelectorAll('.blkplay').forEach(b => b.textContent = '▶');
    const btn = el.querySelector(':scope > .blkplay') || el.querySelector('.blkplay');
    if (btn) btn.textContent = '❚❚';
  }

  bar.querySelector('.ms').onclick = () => {
    TTS.stop(true); bar.classList.remove('on');
    document.querySelectorAll('.blkplay').forEach(b => b.textContent = '▶');
  };
  bar.querySelector('.mp').onclick = () => {
    if (TTS.paused()) { TTS.resume(); bar.querySelector('.mp').textContent = '❚❚'; }
    else { TTS.pause(); bar.querySelector('.mp').textContent = '▶'; }
  };
  new MutationObserver(() => {
    const cur = sc.querySelector('p.now');
    if (cur) num.textContent = (+cur.dataset.i + 1) + ' / ' + sc.children.length;
  }).observe(sc, {subtree:true, attributes:true, attributeFilter:['class']});

  // 幫每個區塊掛上播放鍵
  window.attachBlockPlayers = function(){
    const targets = [
      ['.sec', el => (el.querySelector('h4')||{}).textContent || '區塊'],
      ['.fig', el => (el.querySelector('.fn')||{}).textContent || '人物'],
      ['.anc', el => (el.querySelector('h5')||{}).textContent || '對照'],
      ['.tribe .t', el => (el.querySelector('b')||{}).textContent || '社群'],
      ['.sect-item', el => (el.querySelector('h5')||{}).textContent || '章節'],
      ['.mref', el => (el.querySelector('b')||{}).textContent || '文獻'],
      ['.tldr', el => '濃縮精華 · ' +
        ((el.closest('.card')||{}).querySelector ? (el.closest('.card').querySelector('h3')||{}).textContent||'' : '').slice(0,24)],
      ['.jfit', () => '期刊契合分析']
    ];
    targets.forEach(([sel, namer]) => {
      document.querySelectorAll(sel).forEach(el => {
        if (el.querySelector(':scope > .blkplay')) return;
        const b = document.createElement('button');
        b.className = 'blkplay'; b.textContent = '▶';
        b.title = '朗讀這一格';
        b.onclick = e => {
          e.stopPropagation();
          if (b.textContent === '❚❚') {
            if (TTS.paused()) { TTS.resume(); b.textContent = '❚❚'; }
            else { TTS.pause(); b.textContent = '▶'; }
            return;
          }
          playBlock(el, namer(el));
        };
        el.style.position = 'relative';
        el.insertBefore(b, el.firstChild);
      });
    });
  };
  window.attachBlockPlayers();
  new MutationObserver(() => window.attachBlockPlayers())
    .observe(document.getElementById('feed') || document.body, {childList:true});
})();

</script>
</body>
</html>
